[pytest]
testpaths = tests
addopts = -ra -m "not live and not chromium"
markers =
    unit: Offline logic, SQLite and Flask API tests.
    live: Real HTTP calls to public EXIM; may fail when source/network changes.
    bulk: Expensive full catalog download; combine with live.
    chromium: Browser end-to-end tests against an isolated local app (no EXIM network).
    prices: Price contract against live EXIM; combine with live.
