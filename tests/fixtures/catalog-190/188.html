<html><h1>Hotel Riu Costa del Sol</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 143243, "name": "Hotel Riu Costa del Sol", "description": [{"code": null, "title": "Poloha", "text": "Hotel Costa del Sol se nachází na promenádě v letovisku Torremolinos. Letiště v Malaze je vzdáleno zhruba 8 km. Nedaleko hotelu se nachází autobusová zastávka."}, {"code": null, "title": "Popis hotelu", "text": "Při příjezdu na hotel budete uvítáni příjemnou obsluhou recepce, která vám bude k dispozici po celý váš pobyt. Na recepci si můžete směnit peníze nebo můžete využít služeb půjčovny aut. Pokud si zapůjčíte auto můžete ho parkovat na hotelovém parkovišti. Do vyšších pater budovy můžete pohodlně vyjet výtahem. Ve společných prostorách hotelu se můžete připojit k WiFi. V hotelu jsou bohaté celodenní možnosti stravování a občerstvení, např. hlavní restaurace s terasou Ajoblanco, Italská restaurace La Dolce Vita,  Andaluská restaurace María Sardina, Lobby bar Rebujito, Lounge bar La Malaguena, Lounge sportovní bar, Bar La Carihuela Plaza, Bar u bazénu Sherry, Bar El Jardin de Lola."}, {"code": null, "title": "Popis pokoje", "text": "Hotel nabízí ubytování celkem v 621 klimatizovaných pokojích rozmístěných ve třech budovách. Každý pokoj disponuje vlastním sociálním zařízením s toaletou, dále také trezorem, minilednicí, WiFi připojením a balkonem. Další popis vybavení a umístění pokojů, najdete v oficiálním popisu u jednotlivých termínů."}, {"code": null, "title": "Sport a zábava", "text": "Součástí hotelu jsou celkem 3 venkovní bazén s terasou na slunění, na které jsou pro Vás k dispozici lehátka a slunečníky. U bazénu najdete také bar s nabídkou osvěžujících nápojů. Pro relaxci a odpočinek Vám jistě dobře poslouží wellness zázemí v podobě krytého bazénu, parních lázní či různých procedur. Vybírat můžete také z široké nabídky masáží. V hotelu si můžete užít ty nejlepší sportovní i zábavní programy a večerní show či živou hudbu. Pokud patříte mezi aktivněji založené, můžete navštívit hotelové fitness, kde se pořádají také skupinové fitness aktivity v rámci programu Riu Fit. Pro nejmenší hosty je zde dětský bazén, Splash Park s vodními atrakcemi a dětský klub Riu Land. Nedaleko hotelu se nachází také 18jamkové golfové hřiště."}, {"code": null, "title": "Stravování", "text": "Stravování je poskytováno formou all inclusive."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Andalusie", "url": "https://www.eximtours.cz/spanelsko/andalusie"}, {"name": "Torremolinos", "url": "https://www.eximtours.cz/spanelsko/andalusie/torremolinos"}]}}</script></div></html>
