<html><h1>Alma Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 4141, "name": "Alma Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<div class=\"lRu31\" dir=\"ltr\"><span class=\"HwtZe\" lang=\"cs\"><span class=\"jCAhz ChMk0b\"><span class=\"ryNqvb\">Oblíbený resort se nachází v klidné oblasti Castiadas, u jedné z nejhezčích zátok jižní Sardínie.</span></span> <span class=\"jCAhz ChMk0b\"><span class=\"ryNqvb\">Ubytování je v bungalovech v typickém sardinském stylu, nedaleko nádherné pláže s jemným bílým pískem. </span></span><span class=\"jCAhz ChMk0b\"><span class=\"ryNqvb\">Letovisko Costa Rei je vzdálené cca 6 km, letiště v Cagliari cca 60 km.</span></span><span class=\"jCAhz ChMk0b\"><span class=\"ryNqvb\"> Alma Resort je díky svému zázemí a klidnému okolí vhodná i pro rodiny s dětmi.</span></span><span class=\"jCAhz ChMk0b\"><span class=\"ryNqvb\"> U hotelu se nachází i autobusová zastávka, odkud jezdí autobusy do městečka Castiadas.</span></span></span></div>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 250 m</li>\r\n<li>letiště: 60 km</li>\r\n<li>centra: 6 km Costa Rei</li>\r\n<li>nákupních možností: 4 km, v hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: <br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>klimatizace</li>\r\n<li>TV/sat.</li>\r\n<li>trezor</li>\r\n<li>minibar</li>\r\n<li>terasa</li>\r\n<li>4. lůžko palanda</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>lobby</li>\r\n<li>restaurace</li>\r\n<li>dětská kuchyňka (pro přípravu jídel pro nejmenší děti, s nabídkou základních potravin)</li>\r\n<li>2 bary</li>\r\n<li>TV místnost</li>\r\n<li>konferenční sál</li>\r\n<li>butik</li>\r\n<li>amfiteátr</li>\r\n<li>zahrada</li>\r\n<li>bazén (lehátka a slunečníky zdarma, osušky za zálohu)</li>\r\n<li>dětský bazén</li>\r\n<li>bar u bazénu</li>\r\n<li>dětské hřiště s houpačkami, skluzavkami, atrakcemi&nbsp;</li>\r\n<li>miniklub (3-12 let, denně kromě neděle)</li>\r\n<li>parkoviště</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písečná pláž cca 250 m od hotelu</li>\r\n<li>lehátka, slunečníky zdarma od 4. řady</li>\r\n<li>osušky za poplatek&nbsp;</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>K jídlu voda a stolní víno</li>\r\n<li>Vybrané místní nealkoholické nápoje, stolní víno, točené pivo, americká káva a teplé nápoje (10.00-23.00hod.)</li>\r\n<li>1x týdně typická sardská večeře</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>tenis</li>\r\n<li>malý fotbal</li>\r\n<li>lukostřelba</li>\r\n<li>stolní tenis</li>\r\n<li>plážový volejbal</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty</li>\r\n<li>kanoe&nbsp;</li>\r\n<li>šlapadla</li>\r\n<li>osvětlení tenisového kurtu</li>\r\n<li>potapěčské centrum</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>denní a večerní animační programy pro děti i pro dospělé</li>\r\n<li>hry</li>\r\n<li>soutěže</li>\r\n<li>hudební vystoupení</li>\r\n</ul>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<ul>\r\n<li>masáže (za poplatek)</li>\r\n</ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "Hotel má k dispozici pokoje pro handicapované hosty. Pokoje jsou na vyžádání a zpětné potvrzení z destinace."}, {"code": "SPECIFICS", "title": "Dodatečné služby", "text": "Pro hosty s alergií na lepek (bezlepková dieta) je k dispozici nabídka základních bezlepkových produktů v každém chodu."}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "V Itálii mohou být od hostů vyžadovány koupací čepice v hotelových bazénech."}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>WiFi ve společných prostorách hotelu zdarma</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<a href=\"http://www.almaresortsardegna.it\">www.almaresortsardegna.it</a>&nbsp;"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hviezdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "Na místě povinná platba pobytové taxy cca 1-3,5 eur/os./den. Rozsah a kvalita výše uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.<br /><strong>Poplatek:</strong> 70 EUR/týden, k úhradě na místě u dětí 0-2 let.&nbsp; Zahrnuje dětskou postýlku, možnost používání dětské kuchyňky na přípravu jídel pro nejmenší děti."}], "destination": [{"name": "Itálie", "url": "https://www.eximtours.cz/italie"}, {"name": "Sardinie", "url": "https://www.eximtours.cz/italie/sardinie"}, {"name": "Castiadas", "url": "https://www.eximtours.cz/italie/sardinie/castiadas"}]}}</script></div></html>
