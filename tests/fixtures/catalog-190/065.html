<html><h1>Ionian Sea villas & Aqua Park</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 166482, "name": "Ionian Sea villas & Aqua Park", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Rozlehlý hotelový komplex sestává ze 2 hotelů Ionian Sea hotel Villas a Thalassa Superior a&nbsp; je situován cca 150 m od menší pláže v klidné oblasti Kunopetra. Větší městečko Lixouri s mnoha kavárnami, obchody a bary se nachází 7 km od ubytování (pohodlně dostupné hotelovým minibusem, místní dopravou nebo taxi). Nákupní možnosti a zábavu mají hosté v bezprostřední blízkosti ubytování.&nbsp;"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 150 m</li>\r\n<li>letiště: 50 km Kefalonie</li>\r\n<li>centra: 7 km (Lixouri)</li>\r\n<li>nákupních možností: 7000 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>telefon</li>\r\n<li>klimatizace</li>\r\n<li>satelitní TV</li>\r\n<li>lednice</li>\r\n<li>balkon nebo terasa</li>\r\n</ul>\r\n&nbsp;<strong>Ostatní typy pokojů (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br /></strong><strong>Třílůžkový pokoj: </strong>pro 3 osoby<br />\r\n<ul>\r\n<li><strong>Mezonetový pokoj: </strong>pro 4 až 5 osob</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>Hotelový resort sestává z třípatrové hlavní budovy a několika nižších bungalovů</li>\r\n<li>krásná udržovaná zahrada.</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>směnárna</li>\r\n<li>prostorné lobby</li>\r\n<li>restaurace</li>\r\n<li>trezory na recepci (za poplatek)</li>\r\n<li>bar u bazénu</li>\r\n<li>hlavní restaurace</li>\r\n<li>2 venkovní bazény (lehátka a slunečníky zdarma)</li>\r\n<li>dětský bazén</li>\r\n<li>parkoviště</li>\r\n<li>internetový koutek (za poplatek)</li>\r\n<li>aquapark s 5ti skluzavkami (jediný na ostrově)</li>\r\n<li>mini market</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>Menší písčitá pláž (červený písek) s pozvolným vstupem do moře se nachází jen 100 m od hotelu.</li>\r\n<li>lehátka a slunečníky (za poplatek), na začátku a na konci sezony není přesně určeno kdy začne/skončí pronájem lehátek a slunečníku.&nbsp;</li>\r\n<li>Hosté mohou navštívit i další pláže v okolí jako např. Vatsa nebo Vrachinari, oblíbená pláž Xi je vzdálena 5 km od ubytování</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li class=\"f_list-item\">Snídaně, oběd a večeře formou bufetu</li>\r\n<li class=\"f_list-item\">Lehký snack a zmrzlina během dne</li>\r\n<li class=\"f_list-item\">Vybrané alkoholické a nealkoholické nápoje místní výroby (10.00-23.00 hod.)</li>\r\n</ul>\r\nBezlepková strava na vyžádání při objednávce zájezdu."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>fotbal</li>\r\n<li>tenis</li>\r\n<li>volejbal</li>\r\n<li>stolní tenis</li>\r\n<li>venkovní posilovna</li>\r\n<li>šipky</li>\r\n</ul>\r\n<br />"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>kulečník</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>Animační program pro děti a dospělé</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<strong>Animační program Mango klubu v termínu 21.6. - 9.9.2026</strong>"}, {"code": "NOTICE", "title": "Pro handicapované", "text": "<ul>\r\n<li>rampa u vchodu do hotelu a všech veřejných prostor</li>\r\n<li>široké vstupní dveře</li>\r\n<li>upravené pokoje pro handicapované</li>\r\n<li>bezbariérový přístup kolem bazénu</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>hotel neakceptuje psy</li>\r\n<li>úsek transferu mezi Argostoli-Lixouri je většinou organizován trajektem</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul style=\"list-style-type: disc;\">\r\n<li><strong>Zdarma:</strong> Wi-Fi v areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<ul>\r\n<li>ionianseahotel.gr</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kefalonie", "url": "https://www.eximtours.cz/recko/kefalonie"}, {"name": "Kounopetra", "url": "https://www.eximtours.cz/recko/kefalonie/kounopetra"}]}}</script></div></html>
