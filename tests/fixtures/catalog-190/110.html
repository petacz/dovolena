<html><h1>Mediterraneo Bay Hotel Spa & Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 13048, "name": "Mediterraneo Bay Hotel Spa & Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Přímo u pobřežní promenády v oblíbeném letovisku Roquetas de Mar. V okolí hotelu restaurace, bary a nákupní možnosti. Centrum letoviska s přístavem cca 2 km, autobusová zastávka cca 100 m od hotelu.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Hotelový komplex ve středomořském stylu a rozlehlým kompexem bazénů (přes 3000m2). Vstupní hala s recepcí, restaurace a bar, výtahy; 3 tématické restaurace a la carte (italská, grill a asijská). V rozsáhlé a pečlivě udržované zahradě bazén, bazén se skluzavkami, bar u bazénu a slunečníky a lehátka zdarma, osušky oproti kauci, výměna za poplatek.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj:</strong> (DR01): koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., telefon, minilednička, trezor za poplatek, balkon nebo terasa; 2 lůžka široká 135 cm nebo 1 lůžko široké 150 cm (bez možnosti další přistýlky).&nbsp;</li>\r\n<li><strong>Dvoulůžkový pokoj Level</strong> (DR02): viz DR; 2 lůžka široká 135 cm bez možnosti přistýlky, TV/SAT 49 úhlopříčka, výhled na moře nebo boční výhled na moře, trezor zdarma, voda a ovoce na uvítanou. Vstupy do jednotlivých restaurací a la carte, nutná rezervace předem (Green Monkey, italská, Takamaka Asie, Grill.) Možnost využít lehátka a slunečníky na pláži zdarma, rezervace nutná na recepci - když budou volné – patří hotelu a rezervaci udělá jen hotel, toto je negarantovaná služba.Přednostní check - in.&nbsp;</li>\r\n<li><strong>Junior Suite</strong> (SU01): viz DR, prostornější; 2 lůžka široká 135 cm bez možnosti přistýlky, možnost snídaně v restauraci Green Monkey, možnost využít lehátka a slunečníky na pláži zdarma, rezervace nutná na recepci - když budou volné – patří hotelu a rezervaci udělá jen hotel, toto je negarantovaná služba.</li>\r\n<li><strong>Junior Suite Royal</strong> (SU02): viz Junior suite, pohovka, výhled na moře, boční výhled na moře nebo výhled na bazén, trezor zdarma, voda a ovoce na uvítanou. Vstupy do jednotlivých restaurací a la carte, nutná rezervace předem (Green Monkey, italská, Takamaka Asie, Grill.) Možnost využít lehátka a slunečníky na pláži zdarma, rezervace nutná na recepci - když budou volné – patří hotelu a rezervaci udělá jen hotel, toto je negarantovaná služba.</li>\r\n<li><strong>Dvoulůžkový pokoj vstup do bazénu </strong>(DR03<strong>):</strong> viz DR, ale s větší terasou, přímý vstup do bazénu (bazén je společný, není nijak oddělený), trezor zdarma. Vstupy do jednotlivých restaurací a la carte, nutná rezervace předem (Green Monkey, italská, Takamaka Asie, Grill.) Možnost využít lehátka a slunečníky na pláži zdarma, rezervace nutná na recepci - když budou volné – patří hotelu a rezervaci udělá jen hotel, toto je negarantovaná služba.</li>\r\n</ul>\r\n<br /><strong>Poznámka ke všem druhům pokojů:</strong> v pokojích jsou vždy pevné postele bez možnosti přistýlek, hotel samozřejmě počítá s reálnou obsazeností pokoje v každém pokoji. Budou li na pokoji 2 osoby = dostanou 1 manželskou postel 150 cm x 2 m, případně i dvě manželské postele vedle sebe 135 cm x 2 m. Budou li na pokoji ubytované 3 a více osob, vždy se počítá se dvěma manželskými postelemi vedle sebe a pohodlně se vyspí. Například v jedné manželské posteli rodiče a v druhé manželské posteli 1 dítě či 2 děti apod. Rozdělení je plně v kompetenci hotelu, ale vždy hotel reaguje na potřeby jednotlivých klientů."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní a večerní animační program.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu. Možnost dokoupení programu all inclusive.</li>\r\n</ul>\r\n<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehké občerstvení (12.00-16.00 hod.)</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje (10.00-24.00 hod.)</li>\r\n<li>Možnost 1 večeře a la carte za týden (v rámci 1 týdne není možné využít vícekrát stejnou restauraci a la carte, vždy nutná rezervace předem</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Široká pláž s hrubým pískem oddělena pouze pěší pobřežní promenádou. Lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Za poplatek:</strong> fitness.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, vodní svět pro děti, hřiště, animace, dětská postýlka zdarma (na vyžádání).</p>\r\n<p><strong>Animační program Funtazie klubu v termínu 25.6. - 2.9.2026 </strong>(neplatí pro produkt Fischer Dynamix)</p>"}, {"code": "WEB", "title": "Web", "text": "http://mediterraneobay.com/en/services.html"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>&nbsp;Zdarma: </strong>WiFi v hotelu pro klienty zdarma.&nbsp;</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Almería", "url": "https://www.eximtours.cz/spanelsko/costa-almeria"}, {"name": "Roquetas de Mar", "url": "https://www.eximtours.cz/spanelsko/costa-almeria/roquetas-de-mar"}]}}</script></div></html>
