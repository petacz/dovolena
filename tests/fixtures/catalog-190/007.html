<html><h1>Vantaris Luxury Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1064, "name": "Vantaris Luxury Beach Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Kompletně zrekonstruovaný hotelový komplex je součástí 5 sesterských hotelů, které leží na klidném místě v blízkosti prázdninového letoviska Georgioupolis. Hotel je ideálním výchozím bodem pro poznávání ostrova, jediné sladkovodní jezero na Krétě je vzdáleno cca 5 kilometrů. Zastávka místní autobusové dopravy se nachází asi 50 metrů od hotelu. Toto příjemné ubytování doporučujeme všem, kteří chtějí strávit klidnou a odpočinkovou dovolenou, i rodinám s dětmi.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m u pláže</li>\r\n<li>letiště: 100 km Heraklion / 48 km Chania</li>\r\n<li>centra: 3.5 km Georgioupolis</li>\r\n<li>nákupních možností: 0 m v místě</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Economy</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednice</li>\r\n<li>trezor (za poplatek, pro hosty s All Inclusive zdarma)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>terasa</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>dětská postýlka na vyžádání (za poplatek 5 EUR/den)</li>\r\n<li>pouze omezené množství pokojů, starší pokoje, méně výhodná poloha</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior:</strong> balkon, nově zrekonstruované pokoje</li>\r\n<li><strong>Dvoulůžkový pokoj, Sea Front:</strong> balkon nebo terasa, pokoje v první řadě, blíže k moři, nově zrekonstruované pokoje</li>\r\n<li><strong>Dvoulůžkový pokoj, Premium:</strong> balkon nebo terasa, nově zreko , hranolky, ovoce, 12.30–15.30 salátový bar, 11.00–15.20 zmrzlina, 15.30–17.00 filtrovaná káva, čaj, zákusky</li>\r\n</ul>\r\n<strong>Upozornění:</strong> výše uvedené časy a místa se mohou změnit. U večeře je vyžadováno formální oblečení."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>stolní tenis (vybavení za poplatek)</li>\r\n<li>tenisový kurt (osvětlení a vybavení za poplatek)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty na pláži</li>\r\n<li>kulečník</li>\r\n<li>minifitness</li>\r\n<li>sauna</li>\r\n<li>masáže</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>nepravidelné večerní programy</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>Wi-Fi v celém areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "http://www.vantarishotels.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Kavros", "url": "https://www.eximtours.cz/recko/kreta/kavros"}]}}</script></div></html>
