<html><h1>Elba Carlota Beach & Golf resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1599, "name": "Elba Carlota Beach & Golf resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel upoutá svoji jedinečnou polohou mezi písečnou pláží a golfovým hřištěm. Centrum letoviska Caleta de Fuste s obchody, restauracemi, bary a kavárnami cca 2 km. Komerční centrum s mnoha obchody, restauracemi, kinem, supermarketem, bowlingem a dalšími zábavními možnostmi v těsné blízkosti hotelu. Hlavní město Puerto del Rosario cca 13 km. Mezinárodní letiště Fuerteventura je vzdáleno 8 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>323 pokojů, 5 pater, vstupní hala s recepcí, výtahy, restaurace, snack bar, lobby bar, obchod se suvenýry, 5 konferenčních sálů. V zahradě 2 bazény (1 s možností klimatizace/ vyhřívání), bar u bazénu a terasa s lehátky a slunečníky zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong>: koupelna (vysoušeč vlasů), WC, klimatizace, telefon, TV/sat., minibar, trezor za poplatek, balkon nebo terasa.</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře</strong>: boční výhled na moře.</li>\r\n<li><strong>Junior suita, Výhled moře</strong>: opticky oddělená obývací část a ložnice.</li>\r\n<li><strong>Senior suita, 1 ložnice, Výhled moře:</strong> pro 2 dospělé a dvě děti, oddělená ložnice a obývací část</li>\r\n<li><strong>Rodinný pokoj, Propojený:</strong> propojené dva pokoje</li>\r\n<li><strong>Rodinný pokoj, Propojený, Boční výhled moře:</strong> propojené dva pokoje, výhled moře.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní a večerní animační program, pravidelné večery s živou hudbou.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>Snídaně a večeře formou bufetu. Možnost dokoupení plné penze nebo programu all inclusive.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Uměle vytvořená pláž s jemným světlým pískem a pozvolným vstupem do moře přímo u hotelu. Větší písečná pláž ve středisku Caleta de Fuste cca 2 km, několikrát denně hotelový autobus zdarma. Lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Za poplatek:</strong> tenis, fitness, jacuzzi, 18jamkové golfové hřiště v těsné blízkosti hotelu.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Brouzdaliště a hřiště, miniklub (3–12 let), animace, hlídání dětí za poplatek (na vyžádání), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "ALL_INCLUSIVE", "title": "All inclusive", "text": "<ul>  <li>Snídaně, oběd a večeře formou bufetu</li>  <li>Lehký snack (10.00–18.00 hod.)</li>  <li>Zmrzlina pro děti (10.00–18.00 hod.)</li>  <li>Odpolední káva, čaj a zákusek</li>  <li>Vybrané alkoholické a nealkoholické nápoje (10.00–23.00 hod.)</li>  </ul>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC, AMEX.</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.hoteleselba.com"}, {"code": "NOTE", "title": "Handicap", "text": "<p>Na vyžádání pokoje plně přizpůsobené pro handicapované klienty.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma</strong>: WiFi v lobby a na pokojích.</li>  </ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p><strong>Oficiální třída: ****</strong></p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Fuerteventura", "url": "https://www.eximtours.cz/spanelsko/fuerteventura"}, {"name": "Caleta de Fuste", "url": "https://www.eximtours.cz/spanelsko/fuerteventura/caleta-de-fuste"}]}}</script></div></html>
