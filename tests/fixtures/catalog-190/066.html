<html><h1>Alykanas Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 142533, "name": "Alykanas Beach", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Přímo na břehu moře, v klidném letovisku Alykanas, cca 400 m od centra městečka s obchody, restauracemi, tavernami a bary. Hlavní město Zakynthos cca 16 km (spojení linkovým autobusem, zastávka cca 400 m). Letiště cca 18 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>135 pokojů, vstupní hala s recepcí, restaurace, lobby bar, vedlejší budova (annex) cca 200 m za hlavní budovou (dále od moře). Venku bazén, bar u bazénu, terasa s lehátky a slunečníky zdarma, osušky za poplatek.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Superior: </strong>koupelna/WC (vysoušeč vlasů) klimatizace, TV/sat., lednice, trezor za poplatek, set pro přípravu kávy a čaje, balkon nebo terasa, v hlavní budově, přistýlka formou extra postele, 25-27m2.<br /><br />\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Boční výhled moře:</strong> prostornější, směrem k moři.</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice:</strong> oddělená ložnice, 45m2.</li>\r\n<li><strong>Dvoulůžkový pokoj, Annex: </strong>méně prostorný, koupelna nerenovována, cca 200 m od hlavní budovy.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Dlouhá písečná pláž s pozvolným vstupem do moře přímo u hotelu, lehátka a slunečníky za poplatek, osušky za poplatek, sprchy na pláži. Přístup na pláž po několika schodech.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně oběd a večeře formou bufetu</li>\r\n<li>Lehký snack a zmrzlina během dne</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje místní výroby (10.30-23.00 hod.)</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n<li>Vegetariánská strava pouze výběr z bufetu</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětské brouzdaliště, splash park, dětské hřiště, dětská postýlka zdarma.</p>"}, {"code": "SPECIFICS", "title": "Dodatečné služby", "text": "<strong>Zante Plaza Day Pass:&nbsp;</strong>Hosté mohou zdarma využít služby a stravování ve vybraných sesterských hotelech sítě Zante Plaza Hotels (společný náramek).<br />\r\n<p>• Alykanas Beach Hotel by Zante Plaza (Alykanas Beach)<br />• Klelia Beach Hotel by Zante Plaza (Kalamaki Resort)<br />• Exotica Hotel &amp; Spa by Zante Plaza (Kalamaki Resort)<br />• Zante Plaza Hotel &amp; Apartments (Laganas Resort)<br />• Keri Village &amp; Spa by Zante Plaza - Adults Only (Keri Resort)</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul style=\"list-style-type: disc;\">\r\n<li><strong>Zdarma:</strong> WiFi v areálu hotelu.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "http://www.alykanas-beach.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Alikanas", "url": "https://www.eximtours.cz/recko/zakynthos/alikanas"}]}}</script></div></html>
