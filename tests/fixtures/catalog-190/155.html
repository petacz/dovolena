<html><h1>Puente Real Hotel</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 159965, "name": "Puente Real Hotel", "description": [{"code": null, "title": "Poloha", "text": "Oblíbený hotel leží v první linii u pláže (pouze za místní komunikací a plážovou promenádou) na okraji letoviska Torremolinos. Centrum letoviska s obchody, bary, restauracemi a diskotékami vzdáleno cca 1,3 km. Letiště Malaga vzdáleno cca 7 km. Nedaleko hotelu se nachází vlakové nádrazé i autobusová zastávka, odkud se snadno dostanete do krásné Malagy."}, {"code": null, "title": "Vybavení", "text": "Hotelový komplex 3 budov, jedna z nich zrenovovaná pro 2025 - pokoje typu junior suite, budova má vlastní bazén a zahradu. Vstupní hala s recepcí 24 hod., místnost pro zavazadla, TV místnost, výtah, parkoviště, bufetová restaurace, a la carte restaurace (italská), kavárna, bar, bar u bazénu. 2 bazény s lehátky a slunečníky na terase zdarma."}, {"code": null, "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj standard:</strong> koupelna/WC, vysoušeč vlasů, TV/SAT, telefon, malá lednička, trezor za poplatek, klimatizace, balkón nebo terasa. (umístění v budově dále od pláže)<br /><strong>Dvoulůžkový pokoj superior</strong>: stejné vybavení jako standard, vyšší budova blíže pláži, boční výhled na moře.<br /><strong>Junior Suite:</strong> nově zrekonstruované a vybavené junior suity 2025 - oproti klasickým pokojům mají zástěnou oddělenou ložnici a obývací část s rozkládací pohovkou.&nbsp; Jsou situované v zahradě s bazénem v klidné části komplexu.<br /><strong>Junior Suite s výhledem na bazén</strong>: navíc výhled na bazén."}, {"code": null, "title": "Pláž", "text": "písčitá pláž oddělená pouze místní komunikací a plážovou promenádou. Lehátka a slunečníky na pláži za poplatek."}, {"code": null, "title": "Stravování", "text": "<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu, včetně nápojů k jídlu (voda, džus, víno, pivo)</li>\r\n<li>Lehké občerstvení (10.00-13.00 hod. a 15:00 - 19:00 hod.)</li>\r\n<li>odpolední káva, čaj, zákusky a zmrzlina pro děti</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje (10:30-23.00 hod.) - klienti mají 40% slevu na brand likéry a nápoje z nápojového lístku)</li>\r\n<li>Upozornění: výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit.</li>\r\n</ul>\r\n<strong>All inclusive PREMIMUM (GOLD):</strong><br />navíc Gold drinks, premiové značkové drinky a koktejly.<br />1 x večeře v a la carte restauraci, nutná rezervace předem<br />vybranné nápoje v Beach Clubu před hotelem&nbsp;<br />24 hod. snacky a nápoje<br />přednostní check in<br />exkluzivní zóna pro klienty Gold v lobby baru a v baru u bazénu<br />osušky za depozit k bazénu"}, {"code": null, "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> sporty během animačních programů - lukostřelba, aerobic, stolní tenis<br /><strong>Za poplatek:</strong> fitness, tenisové kurty"}, {"code": null, "title": "Zábava", "text": "Pravidelné denní i večerní animační a zábavné programy."}, {"code": null, "title": "Děti", "text": "dětská postýlka na vyžádání zdarma, dětské hřiště, dětský bazén, dětská židlička, animační programy v rámci miniklubu."}, {"code": null, "title": "Internet", "text": "<strong>Wifi: </strong>Zdarma v hotelu a na pokojích."}, {"code": null, "title": "Web", "text": "<a href=\"http://www.puente\">www.puentereal.com</a>"}, {"code": null, "title": "Oficiální kategorie", "text": "4 hvězdičky"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Andalusie", "url": "https://www.eximtours.cz/spanelsko/andalusie"}, {"name": "Torremolinos", "url": "https://www.eximtours.cz/spanelsko/andalusie/torremolinos"}]}}</script></div></html>
