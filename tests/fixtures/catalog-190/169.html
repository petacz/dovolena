<html><h1>Ilyssion</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 144528, "name": "Ilyssion", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotelový komplex v klidné části jihovýchodní strany ostrova cca 55 km letiště, cca 12 km letovisko Lindos s akropoli, cca 7 km letovisko Lardos, cca 800 m letovisko Pefki s tavernami a obchůdky.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>173 pokojů, vstupní hala s recepcí, restaurace, bar, minimarket, v zahradě 2 bazény(sladkovodní) a 1 bazén s mořskou vodou(otevřen/uzavřen dle počasí, neobsahuje chlor, zpravidla uzavřen na začátku a konci sezony). Lehátka a slunečníky u bazénů zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<p><strong>Dvoulůžkový pokoj: </strong>koupelna/WC (vysoušeč vlasů oproti depozitu), telefon, TV/sat., trezor (za poplatek), lednice, klimatizace (15/6-15/9 zdarma, ostatní termíny&nbsp; za poplatek), balkon nebo terasa.</p>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled na moře:</strong> výhled na moře</li>\r\n<li><strong>Rodinný pokoj:</strong> 1 prostornější místnost v přízemí.</li>\r\n<li><strong>Junior suita:</strong>&nbsp;ložnice a obývací část, opticky odděleno, prostornější.&nbsp;</li>\r\n<li><strong>Suita:</strong> 2 oddělené místnosti, 2x koupelna.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Krásná písčitá pláž s pozvolným vstupem do moře cca cca 80 metrů od hotelu. Přímo před areálem hotelu kamenitá pláž a malé zátoky. Lehátka a slunečníky na pláži za poplatek.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>kontinetální snídaně (07.30-10.00 hod.)</li>\r\n<li>lehký oběd jako pizza, burger, pita gyros, špageti apod. (12.00-14.00 hod.)</li>\r\n<li>večeře formou bufet (18.30-21.00 hod.)</li>\r\n<li>odpolední občerstvení, káva, čaj , sušenky, ledová tříšť pro děti</li>\r\n<li>místní rozlévané nealkoholické a alkoholické nápoje (11.00-22.45 hod., víno, pivo a kotejly od 12.00 hodin, tvrdý alkohol od 18.00 hod.)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Za poplatek:</strong> tenisový kurt (bez vybavení), biliár.</li>\r\n<li><strong>Zdarma:</strong> plážový vollejbal</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Hotel pořádá 1x týdně zábavní programy.&nbsp;</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "SPECIFICS", "title": "Dodatečné služby", "text": "<p>VISA, EC/MC.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong><strong>&nbsp;</strong>v lobby</li>\r\n<li><strong>Za poplatek:</strong> na pokoji</li>\r\n</ul>\r\n<p>&nbsp;</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.hotelilyssion.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Rhodos", "url": "https://www.eximtours.cz/recko/rhodos"}, {"name": "Pefki", "url": "https://www.eximtours.cz/recko/rhodos/pefki"}]}}</script></div></html>
