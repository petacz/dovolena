<html><h1>Sol Lanzarote</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2980, "name": "Sol Lanzarote", "description": [{"code": null, "title": "Poloha", "text": "<p>Krásný hotel se skvělými službami se nachází v první linii u pláže ve středisku Puerto del Carmen nedaleko pobřežní promenády. V okolí se nachází velké množství nákupních i zábavních možností, barů a restaurací. Mezinárodní letiště Lanzarote je vzdáleno 6 km od hotelu (7 minut jízdy autem).</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, společenské prostory, lobby bar, restaurace, kadeřnictví, salon krásy, minimarket. V zahradě 3 bazény (1 s možností klimatizace/vyhřívání), terasa s lehátky a slunečníky zdarma, osušky oproti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Superior:</strong> koupelna/WC (vysoušeč vlasů), klimatizace, oddělený obytný prostor, TV/sat., telefon, mini lednice, mikrovlnná trouba, varná konvice, trezor za poplatek, balkon nebo terasa (výhled do zahrady či směrem k městu).<br /><br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled moře:</strong> výhled na moře.</li>\r\n<li><strong>Suita,1 ložnice, Výhled moře: </strong>župany, prostornější - oddělený velký obytný prostor, výhled na moře.</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Písečná pláž Matagorda přímo u hotelu (jen přes pobřežní promenádu), lehátka a slunečníky za poplatek.</p>"}, {"code": null, "title": "Stravování", "text": "<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>snídaně, oběd a večeře formou bufetu</li>\r\n<li>lehký snack (sendviče, hamburgery, pizza, zmrzlina) v baru (12.00 –17.00 hod.)</li>\r\n<li>vybrané místní alkoholické a nealkoholické nápoje (10.30–23.30 hod.)</li>\r\n</ul>\r\nBezlepkovou / bezlaktózovou stravu nutno nahlásit předem."}, {"code": null, "title": "Sportovní nabídka", "text": "<p><strong>Zdarma: </strong>fitness, v rámci animací jóga, aqua gymnastika, spinning, lekce zumby aj.<strong><br />Za poplatek:</strong> půjčovna kol, masáže, vodní sporty na pláži.</p>"}, {"code": null, "title": "Zábava", "text": "<p>Pravidelné animační programy, zábavné show, živá hudba.</p>"}, {"code": null, "title": "Děti", "text": "<p>Bazén, hřiště, miniklub (pro děti 5–12 let), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": null, "title": "Pro handicapované", "text": "<p>Na vyžádání několik pokojů přizpůsobených pro handicapované klienty. Bezbariérový pohyb v areálu, rampa do bazénu.</p>"}, {"code": null, "title": "Internet", "text": "<p><strong>Zdarma:</strong> WiFi v hotelu.<br /><br /></p>"}, {"code": null, "title": "Web", "text": "www.melia.com"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "V zimním období 1.11.2026-30.4.2027 delegátský servis pouze na telefonu."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Lanzarote", "url": "https://www.eximtours.cz/spanelsko/lanzarote"}, {"name": "Playa de los Pocillos", "url": "https://www.eximtours.cz/spanelsko/lanzarote/playa-de-los-pocillos"}]}}</script></div></html>
