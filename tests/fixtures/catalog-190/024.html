níky na pláži zdarma</li>\r\n</ul>\r\n<strong>Upozornění:</strong>&nbsp;U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> fitness, stolní tenis, šipky.<br /><strong>Za poplatek:</strong> biliár, vodní sporty na pláži."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Lehký animační program, večery s živou hudbou, taneční&nbsp;show.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětské hřiště,&nbsp; miniklub, dětská postýlka zdarma, minidisco, dětské židličky v restauraci.</p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>Zdarma:</strong> vnitřní vyhřívaný bazén (k využití zdarma v květnu a říjnu)<strong><br />Za poplatek:</strong> různé druhy masáží a zábalů, omlazovací balíčky, kosmetické balíčky, sauna, parní lázně."}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma:</strong> Wi-Fi v lobby a na pokojích.</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.zeushotels.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>\r\n<p>&nbsp;</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Stalis", "url": "https://www.eximtours.cz/recko/kreta/stalis"}]}}</script></div></html>
