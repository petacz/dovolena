<html><h1>Playazimbali</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 25, "name": "Playazimbali", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Přímo u pobřežní promenády v klidné části Playa Vera. Menší centrum s možností nákupů a několika bary cca 600 m. Podél několik kilometrů dlouhé pobřežní promenády několik barů. Město Mojacár cca 10 km (spojení linkovým autobusem), autobusová zastávka cca 100 m. Rybářské městečko Gurracha s přístavem, pobřežní promenádou a řadou obchodů a restaurací cca 4 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>242 pokojů, 4 patra, výtahy. Vstupní hala s recepcí, bar, restaurace, 2 restaurace a la carte (italská a středomořská kuchyně, otevřeno pouze v hlavní sezoně). V rozlehlé zahradě bazén s lehátky a slunečníky zdarma, jacuzzi (pouze osoby starší 15 let), bar u bazénu. Osušky oproti kauci, výměna za poplatek.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj nebo Dvoulůžkový pokoj Revenue</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, stropní ventilátor, telefon, TV/sat., minibar, trezor za poplatek, balkon nebo terasa; 2 lůžka široká 135 cm bez možnosti přistýlky.</li>\r\n<li><strong>Dvoulůžkový pokoj Superior s malou předzahrádkou - výhled do zahrady</strong>: viz dvoulůžkový pokoj, modernější vybavení, pokoje umístěné v přízemí s malou předzahrádkou.</li>\r\n<li><strong>Dvoulůžkový pokoj obsazený 1 osobou</strong>: viz dvoulůžkový pokoj, ale pouze 1 lůžko o velikosti 1,35 x 2 m</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní a večerní animační program.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze Plus</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu ( u večeře voda, džus, limo, pivo nebo víno)</li>\r\n</ul>\r\n<strong>Premium All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu, nápoje k jídlu (voda, pivo, víno, limonády)</li>\r\n<li>Lehký snack - tapas (12.00–15.00 a 17.00–19.00 hod.)</li>\r\n<li>Neomezené množství rozlévaných nealkoholických a alkoholických nápojů z nápojového lístku místní výroby (10.30–24.00 hod.)</li>\r\n<li>V den odjezdu platnost do 12.00 hod.</li>\r\n<li>Výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Široká pláž s hrubým pískem a malými oblázky oddělena pouze pěší pobřežní promenádou. Lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Zdarma:</strong> fitness, minigolf, stolní tenis.</li>  <li><strong>Za poplatek:</strong> aquapark Aquavera cca 900 m.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén se skluzavkami, hřiště, miniklub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<p>Hotel akceptuje pobyt se psem do 15 kg za poplatek (na vyžádání).</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.playasenator.com/"}, {"code": "WELLNESS", "title": "Wellness", "text": "<ul>  <li>Spa centrum Aqua Playa, vstup od 16 let</li>  <li><strong>Za poplatek:</strong> vyhřívaný hydromasážní bazén, turecká lážně, sauna, masáže</li>  </ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma:</strong> WiFi v lobby.</li>  <li><strong>Za poplatek:</strong> internetový koutek.</li>  </ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Almería", "url": "https://www.eximtours.cz/spanelsko/costa-almeria"}, {"name": "Vera Playa", "url": "https://www.eximtours.cz/spanelsko/costa-almeria/vera-playa"}]}}</script></div></html>
