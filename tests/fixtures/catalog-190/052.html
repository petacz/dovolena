<html><h1>Zante Sun</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 5258, "name": "Zante Sun", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Hotelový komplex Zante Sun se nachází v klidném prostředí, přibližně 300 m od centra Agios Sostis s několika obchůdky a restauracemi, živé centrum letoviska Laganas cca 2 km, cca 20 minut chůze podél moře, hlavní město Zakynthos cca 10 km (pravidelné autobusové spojení až z letoviska Laganas). Letiště je vzdáleno 10 km od hotelu."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláž: 75 m</li>\r\n<li>letiště: 10 km</li>\r\n<li>centrum: 300 m (Agios Sostis), 2 km (Laganas)</li>\r\n<li>nákupní možnosti: 300 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj:<br /></strong>\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>TV/sat.</li>\r\n<li>klimatizace</li>\r\n<li>trezor za poplatek (20 EUR/ týden)</li>\r\n<li>telefon</li>\r\n<li>balkon nebo terasa (18-23 m²)</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Rodinný pokoj: </strong>jedna prostornější místnost, palanda.</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice:</strong> umístěné v mezonetu nebo suitě s oddělenými ložnicemi, cca 38m2.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>7 dvoupatrových budov</li>\r\n<li>160 pokojů</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>klimatizovaná restaurace</li>\r\n<li>lobby bar</li>\r\n<li>TV místnost</li>\r\n<li>konferenční místnost</li>\r\n<li>3 bazény</li>\r\n<li>dětské brouzdaliště</li>\r\n<li>malé dětské hřiště (pro děti cca do 5 let)</li>\r\n<li>bar u bazénu</li>\r\n<li>terasa na slunění s lehátky a slunečníky zdarma</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>přístupná po několika schodech</li>\r\n<li>úzká, písečná, s pozvolným vstupem</li>\r\n<li>lehátka a slunečníky za poplatek</li>\r\n<li>plážové osušky za poplatek cca 2&nbsp;EUR/den</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Snack během dne</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje (10.00–23.00 hod.)</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>fitness</li>\r\n</ul>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>Za poplatek:<br /></strong>\r\n<ul>\r\n<li>masáž</li>\r\n<li>sauna</li>\r\n<li>vířivka</li>\r\n<li>nehtové studio</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "n/a."}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong>&nbsp;WiFi v celém areálu hotelu.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://zantesunresort.gr/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Agios Sostis", "url": "https://www.eximtours.cz/recko/zakynthos/agios-sostis"}]}}</script></div></html>
