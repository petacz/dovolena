<html><h1>Apollonia Beach Resort & Spa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 36190, "name": "Apollonia Beach Resort & Spa", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotel Apollonia Beach Resort &amp; SPA se nachází na okraji letoviska Amoudara přímo u široké písečné pláže, kde nabízí svým klientům lehátka a slunečníky zdarma. Skládá se z hlavní budovy a dvoupatrových bungalovů, umístěných v krásné, rozlehlé, udržované zahradě, která přímo vybízí k relaxaci a odpočinku. Zároveň má hotel spoustu možností zábavy a sportovního vyžití jak pro dospělé, tak pro děti. Doporučujeme jej všem věkovým kategoriím a rodinám s dětmi. Oficiální kategorie hotelu je 5*, naše hodnocení je 4*+.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m u pláže</li>\r\n<li>letiště: 16 km Heraklion</li>\r\n<li>centra: 1.5 km Amoudara</li>\r\n<li>nákupních možností: 1.5 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový Pokoj:</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>telefon</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>TV</li>\r\n<li>lednička</li>\r\n<li>varná konvice</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka na vyžádání (zdarma)</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled na moře</strong></li>\r\n<li><strong>Bungalov:</strong> pokoje umístěné v nižších, patrových budovách, budovy jsou umístěné v přední části hotelu a v zadnější části naproti vstupu do hlavní budovy&nbsp;</li>\r\n<li><strong>Rodinný pokoj, 2 pokoje:</strong> 2 místnosti oddělené posuvnými dveřmi</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe:</strong> zrekonstruované pokoje (od sezony 2027)</li>\r\n<li oznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Amoudara", "url": "https://www.eximtours.cz/recko/kreta/amoundara"}]}}</script></div></html>
