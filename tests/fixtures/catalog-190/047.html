<html><h1>Serene Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 154506, "name": "Serene Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Příjemný prázdninový komplex v těsné blízkosti dlouhé písečné pláže. Resort se skládá z hlavní budovy a několika dvoupatrových vilek, umístněných v krásné rozlehlé zahradě. Pro hotelové hosty je k dispozici bohatá nabídka relaxačních a sportovních aktivit, rovněž skvělé zázemí pro děti. V roce 2023 hotel prošel výraznou renovací a modernizací. Hotel můžeme doporučit klientům hledajícím aktivní i odpočinkovou dovolenou."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: u pláže</li>\r\n<li>letiště: 80 km Lamezia Terme</li>\r\n<li>centra: 5 km Steccato di Cutro</li>\r\n<li>nákupních možností: v hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>klimatizace (individuální)</li>\r\n<li>TV/Sat.</li>\r\n<li>telefon</li>\r\n<li>trezor (zdarma)</li>\r\n<li>minilednička</li>\r\n<li>v 1. patře s menším balkonem</li>\r\n</ul>\r\n<br />Na vyžádání možnost pokojů pro handicapované klienty."}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala&nbsp;</li>\r\n<li>recepce</li>\r\n<li>WiFi (zdarma)</li>\r\n<li>hlavní restaurace</li>\r\n<li>plážová restaurace</li>\r\n<li>několik barů</li>\r\n<li>2 bazény (lehátka a slunečníky zdarma)</li>\r\n<li>dětský bazén</li>\r\n<li>miniklub (0-17 let)</li>\r\n<li>dětský park</li>\r\n<li>půjčovna aut</li>\r\n<li>obchody</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>soukromá písečná pláž</li>\r\n<li>lehátka a slunečníky v ceně (1 slunečník, 2 lehátka/pokoj, ručníky za poplatek)</li>\r\n<li>plážový bar</li>\r\n<li>Hotelová pláž je vhodná i pro handicapované klienty a klienty na vozíčku (JOB chair).</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>posilovna</li>\r\n<li>multifunkční hřiště (volejbal, basketbal)</li>\r\n<li>paddle tenis</li>\r\n<li>boccia</li>\r\n<li>stolní tenis</li>\r\n<li>skupinová gymnastika</li>\r\n<li>animační programy</li>\r\n<li>večerní zábavní programy</li>\r\n<li>živá hudba</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>wellness</li>\r\n<li>soukromé lekce plachtění a windsurfingu</li>\r\n<li>vybrané vodní sporty na pláži</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>snídaně, obědy a večeře formou bufetu (k dispozici nealkoholické nápoje, pivo, víno, vše rozlévané, místní výroby)</li>\r\n<li>neomezené množství rozlévaných nealkoholických nápojojů, vybrané druhy alkoholu, místní víno, granita, aperitiv</li>\r\n<li>časy podávání určuje hotel a mohou se měnit</li>\r\n</ul>\r\n<br />Pro hosty s potravinovými alergiemi (laktóza, lepek, vejce) má hotel k dispozici základní výběr jídel (balených) v hlavní restauraci během hlavních jídel."}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "V hotelovém bazénu nově&nbsp;<strong>není</strong>&nbsp;vyžadována koupací čepice.<br /><br /><strong>Poplatek: </strong>pobytová taxa 2,5 EUR/osoba/noc, splatná v hotovosti na místě.<br /><strong>Poplatek:</strong> Coccinella Baby Care - zahrnut v ceně. Pro rodiny s dětmi 0-3 let. Zahrnuje dětskou postýlku, dětskou kosmetiku, redukci na toaletu, přebalovací stůl, ohřívač lahví, využívání dětské kuchyňky v hlavní restauraci, židličky, vstup do Baby Blue Parku, využívání speciálně navrženého hřiště pro děti od 0-6 let.<br /><br />Pokud je přílet letadla do destinace plánovaný tak, že klienti nestíhají večeři, bude na místě připravený balíček se studenou večeří. V případě, že je poslední den plánový odlet v pozdějších hodinách, klienti musí udělat check-out dle hotelových pravidel. All Inclusive lze využívat do 14:00, následné využívání služeb All Inclusive a večeře je za poplatek (poplatek určuje hotel, ke zjištění na recepci na místě), klienti však mohou využívat veřejných prostorů hotelu. Late check-out z pokoje si klienti musí sami ověřit na místě, v závislosti na dostupnosti v hotelu.&nbsp;<strong><br /><br /></strong>"}], "destination": [{"name": "Itálie", "url": "https://www.eximtours.cz/italie"}, {"name": "Kalábrie", "url": "https://www.eximtours.cz/italie/kalabrie"}, {"name": "Marinella di Cutro", "url": "https://www.eximtours.cz/italie/kalabrie/marinella-di-cutro"}]}}</script></div></html>
