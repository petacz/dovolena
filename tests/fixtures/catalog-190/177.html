<html><h1>TH BAIA DEGLI DEI LE CASTELLA</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 140297, "name": "TH BAIA DEGLI DEI LE CASTELLA", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>TH Baia Degli Dei Le Castella se nachází přímo u krásné písčité pláže s pozvolným vstupem do moře a s pohádkovým výhledem na pevnost Aragonese, kam se dostanete krátkou procházkou. U pevnosti také můžete prozkoumat městečko Le Castella, kde najdete mnoho restaurací, barů a obchodů. Během dne se v hotelu zabavíte animačními programy, k relaxaci vybízí dva bazény. Využít lze také široké nabídky volnočasových aktivit, rodiny s dětmi ocení dětský klub pro všechny věkové kategorie a dětské hřiště. Ubytování je poskytováno buď v hlavní budově nebo v nízkých dvoupatrových budovách, které jsou umístěné v pěkné zahradě.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: u pláže</li><li>letiště: 80 km Lamezia Terme</li><li>centra: 1.8 km Le Castella</li><li>nákupních možností: 1200 m</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV</li>\r\n<li>minibar</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>V případě ubytování 4 osob může být přistýlka řešená formou palandy.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": " <ul><li>vstupní hala s recepcí</li><li>hlavní restaurace s terasou</li><li>tématická restaurace (za poplatek)</li><li>bar</li><li>bar na pláži</li><li>2 bazény (lehátka a slunečníky zdarma, osušky za poplatek)</li><li>Wi-Fi v lobby zdarma</li><li>obchod se suvenýry</li><li>dětské hřiště</li><li>dětský bazén</li><li>dětský klub (3-17 let)</li></ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>písčitá</li><li>1 slunečník a 2 křesla / pokoj zdarma od 7. řady</li><li>plážový bar</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": " <ul><li>animační programy</li><li>večerní programy</li><li>tenis</li><li>stolní tenis</li><li>minifotbal</li><li>plážový volejbal</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": " <ul><li>vodní sporty na pláži</li><li>SPA centrum</li><li>sauna</li><li>turecké lázně</li><li>masáže</li></ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>10:00 - 23:00, zahrnuje snídaně, obědy a večeře formou bufetu, během jídla nealkoholické nápoje a víno zdarma. Neomezené množství rozlévaných nealkoholických a vybraných alkoholických nápojů místní výroby. Lze čerpat v místech a časech určených hotelem. Upozornění: výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Pobytová taxa cca 3 EUR/osoba/den splatná v hotovosti na místě pobytu. V hotelovém bazénu nově <strong>není</strong> vyžadována koupací čepice.<br /><br />Povinný poplatek za děti ve věku 0-1,99 je již zahrnut v ceně zájezdu a zahrnuje: dětskou postýlku, přebalovací pult, dětskou vaničku, ohřívač lahví (na vyžádání a za depozit), dětskou židličku v restauraci a dětské jídlo (mléko, těstoviny, sušenky, atd.)"}], "destination": [{"name": "Itálie", "url": "https://www.eximtours.cz/italie"}, {"name": "Kalábrie", "url": "https://www.eximtours.cz/italie/kalabrie"}, {"name": "Le Castella", "url": "https://www.eximtours.cz/italie/kalabrie/le-castella"}]}}</script></div></html>
