<html><h1>Arion Green Riviera</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 5154, "name": "Arion Green Riviera", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Oblíbený hotel v klidné oblasti obklopený krásnou zelení. Příjemné středisko Vassilikos s několika tavernami, kavárnami a obchody pouze několik minut chůze. Rušné turistické středisko Argassi s bohatým nočním životem cca 9 km. Hlavní město Zakynthos cca 13 km (spojení linkovým autobusem, zastávka 200 m).</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 80 m</li>\r\n<li>letiště: 15 km</li>\r\n<li>centra: 9 km (Argassi)</li>\r\n<li>nákupních možností: 400 m v okolí hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů),</li>\r\n<li>individuální klimatizace,</li>\r\n<li>telefon,</li>\r\n<li>TV/sat.,</li>\r\n<li>lednička,</li>\r\n<li>trezor,</li>\r\n<li>set na přípravu kávy a čaje,</li>\r\n<li>balkon nebo terasa</li>\r\n<li>mohou být situovány v méně příznivé poloze</li>\r\n</ul>\r\n<strong><br />Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Promo: </strong>méně výhodná poloha v rámci areálu.</li>\r\n<li><strong>Mezonet:</strong> ložnice v patře.</li>\r\n<li><strong>Dvoulůžkový pokoj, sdílený bazén:</strong> v přízemí, vstup do sdíleného bazénu.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>4 budovy</li>\r\n<li>50 pokojů</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>restaurace</li>\r\n<li>bar</li>\r\n<li>venkovní bazén</li>\r\n<li>bar u bazénu</li>\r\n<li>terasa s lehátky a slunečníky zdarma</li>\r\n<li>dětské hřiště u hotelu Arion Sea Front</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláž", "text": "<ul>\r\n<li>Písečná pláž u sesterského hotelu Aspro Krino Dunes cca 80 m od hotelu (při vstupu do vody oblázky)</li>\r\n<li>Lehátka i slunečníky na pláži zdarma</li>\r\n<li>Plážový bar u hotelu Aspro Krino Dunes v rámci All Inclusive (pivo, víno, nealko)</li>\r\n<li>Známá pláž Banana Beach v pěší dostupnosti (cca 200m)</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All inclusive</strong><br />\r\n<ul style=\"list-style-type: disc;\">\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack během dne</li>\r\n<li>Zmrzlina&nbsp;</li>\r\n<li>Nealkoholické a alkoholické nápoje místní výroby</li>\r\n</ul>\r\nBezlepkovou/bezlaktózovou stravu nutno vyžádat."}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Vassilikos", "url": "https://www.eximtours.cz/recko/zakynthos/vassilikos"}]}}</script></div></html>
