<html><h1>MarSenses Ferrera Blanca Hotel</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 242352, "name": "MarSenses Ferrera Blanca Hotel", "description": [{"code": null, "title": "Poloha", "text": "Hotel se nachází v Cala d’Or na Mallorce, konkrétně v oblasti Cala Ferrera, u pobřeží Středomoří. Má přímý přístup na pláž skrze blok T v komplexu, což zajišťuje pohodlí pro hosty, kteří si chtějí užít moře a písek bez nutnosti dlouhého cestování. Centrum Cala d’Or s přístavem, bary, restauracemi a obchody je v krátké dojezdové vzdálenosti, okolí nabízí také příležitosti pro výlety, chůzi podél pobřeží, sportovní aktivity i místní kulturu. Mezinárodní letiště v Palma de Mallorca je vzdáleno cca 65 km od hotelu."}, {"code": null, "title": "Popis hotelu ", "text": "MarSenses Ferrera Blanca Hotel Family je čtyřhvězdičkový rodinný aparthotel, který patří k širšímu komplexu Ferrera Blanca. Hotel prošel nedávnou renovací a má 139 komfortně vybavených pokojů rozdělených do bloků A-M a T. K dispozici je recepce s nepřetržitým provozem, fitness centrum pro hosty, více venkovních bazénů včetně bazénu u divadla a srdcovitého bazénu, prostor Sensiland určený dětem se skluzavkami, miniklubem a herními prvky. Součástí vybavení jsou bary včetně divadelního baru, snack baru (Sensibar), hlavní bufetová restaurace a restaurace s výhledem, živé večerní show a program pro děti i dospělé."}, {"code": null, "title": "Popis pokoje ", "text": "Apartmán nabízí samostatnou ložnici s dvěma oddělenými lůžky nebo postelí pro dva, obývací část s rozkládací pohovkou, vybavenou kuchyňku, vybavenou terasu s posezením, klimatizaci, Wi-Fi, 40″ Smart TV, vlastní koupelnu se sprchou a fénem a bezpečnostní schránku.\n<br/><br/>\r\nSuity jsou podobně řešené se samostatnou ložnicí a obývací částí s pohovkou, mají také terasu, klimatizaci, 40″ Smart TV, vybavenou kuchyňku nebo lednici, vlastní koupelnu se sprchou a fénem a bezpečnostní schránku. <br/><br/>\r\nSuite s výhledem na bazén poskytuje stejné vybavení jako standardní suita, ovšem s terasou s výhledem na bazény.\n<br/><br/>\r\nSuite s výhledem na moře má navíc výhled na moře z terasy, všechno ostatní vybavení je jako u ostatních suit.<br/><br/>\r\n\nStudio je kompaktní varianta s lůžky (dvě oddělené nebo postel pro dva), vlastní koupelna se sprchou, terasa, TV, klimatizace a některé mají kuchyňku či lednici."}, {"code": null, "title": "Sport a zábava ", "text": "Hosté mohou využít čtyři venkovní bazény, včetně tvarově zajímavých bazénů (např. bazén u divadla, srdcovitý bazén) a zónu Sensiland s dvěma dětskými bazény, skluzavkami a miniklubem. K dispozici je fitness centrum vybavené pro posilování a kardio, denní animační program pro děti i dospělé, možnost plážového volejbalu, fotbalu a lukostřelby. Večer se konají představení v divadle (živé show) a v večerním programu nechybí zábava pro celou rodinu."}, {"code": null, "title": "Stravování ", "text": "Hotel funguje ve formátu all inclusive, což zahrnuje snídani, oběd, večeři i občerstvení přes den, včetně nápojů (národní a mezinárodní) kromě prémiových. Hlavní restaurace nabízí bohatý bufet s variací středomořských i mezinárodních pokrmů a show cookingem, Sensibar slouží jako snack bar během dne s lehkými jídelními možnostmi jako pizzy, burgery či saláty, bar u bazénu poskytuje občerstvení a nápoje, restaurace i bary jsou připraveny pro rodiny s dětmi, je možnost využít dětské menu a vysokých židlí."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Cala d Or", "url": "https://www.eximtours.cz/spanelsko/mallorca/cala-d-or"}]}}</script></div></html>
