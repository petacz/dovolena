<html><h1>Marilena Hotel</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2526, "name": "Marilena Hotel", "description": [{"code": null, "title": "Poloha", "text": "<p>Cca 5 km západně od hlavního města Heraklion. V okolí obchody, restaurace, bary. Letiště Heraklion je vzdáleno 10 km od hotelu.</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Hotelový komplex tvořený 3 budovami, 212 pokojů, vstupní hala s recepcí, hlavní restaurace, lobby bar s venkovní terasou, TV místnost. Venku bazén, terasa na slunění, lehátka a slunečníky zdarma, osušky oproti kauci, bar u bazénu.</p>"}, {"code": null, "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Economy, Přízemí</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., telefon, trezor za poplatek (cca 1,5 EUR/den), minilednička, terasa, pokoje ve sníženém přízemí.<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Dvoulůžkový pokoj, Superior:&nbsp;</strong>balkon nebo terasa</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled moře: </strong>balkon nebo terasa</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice: </strong>dvě místnosti oddělené dveřmi</li>\r\n<li><strong>Čtyřlůžkový pokoj:</strong> prostornější</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Písečná pláž cca 150 m, lehátka a slunečníky za poplatek.</p>"}, {"code": null, "title": "Stravování", "text": "<p><strong>All Inclusive:</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (10.00–23.00 hod.)</li>\r\n<li>Snack (10.00–17.00 hod.)</li>\r\n</ul>"}, {"code": null, "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> stolní tenis, šipky.<br /><strong>Za poplatek:</strong> kulečník."}, {"code": null, "title": "Děti", "text": "<p>Dětské hřiště, dětská postýlka zdarma.</p>"}, {"code": null, "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v lobby a na pokojích.<br /><strong>Za poplatek:</strong> internetový koutek v lobby."}, {"code": null, "title": "Web", "text": "https://marilenahotel.gr/"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Chania je vzdáleno 135 km od hotelu."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Amoudara", "url": "https://www.eximtours.cz/recko/kreta/amoundara"}]}}</script></div></html>
