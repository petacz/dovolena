<html><h1>Amour Holiday Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 144430, "name": "Amour Holiday Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel v blízkosti pláže Canal d´Amour. Centrum letoviska Sidari s obchody, tavernami, obchody se suvenýry a bary cca 150 m, hlavní město Korfu a letiště cca 38 km (spojení linkovým autobusem).</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Hlavní budova a 10 vedlejších dvoupatrových budov, 93 pokojů, vstupní hala s recepcí (trezor za poplatek), restaurace, bar. Venku bazén, bar u bazénu, terasa s lehátky a slunečníky zdarma (osušky u bazénu zdarma).</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Deluxe, Výhled zahrada</strong>: koupelna/WC (vysoušeč vlasů), TV/sat., klimatizace, lednička, trezor, telefon, varná konvice, balkon/ terasa, 20m2.<br /><br /><strong>Ostatní typy pokojů</strong>&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul style=\"list-style-type: disc;\">\r\n<li><strong>Rodinný pokoj, Výhled zahrada:</strong> pokoj s palandou, 25-30m2.</li>\r\n<li><strong>Rodinný pokoj, Výhled zahrada, Posuvné dveře: </strong>místnost oddělená posuvnými dveřmi, 25-30m2.</li>\r\n<li><strong>Junior Suita, Výhled zahrada:</strong> prostornější pokoj, 20-25m2.</li>\r\n<li><strong>Junior Suita, Sdílený bazén:</strong> prostornější pokoj se sdíleným bazénem, 20-25m2.&nbsp;</li>\r\n<li><strong>Dvoulůžkový pokoj, Promo, Výhled zahrada: </strong>méně výhodná poloha v rámci areálu, může být umístěné v annexové budově.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž cca 100 m. Lehátka a slunečníky za poplatek, hotelové osušky oproti kauci, výměna za poplatek. Pláž Canal d´Amour cca 400 m.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul style=\"list-style-type: disc;\">\r\n<li>Snídaně (7:30-10:00), oběd (12:30-14:30) a večeře (19:00-21:30) formou bufetu.</li>\r\n<li>Lehký snack během dne (11:00-12:00, 15:00-18:00)</li>\r\n<li>Alkoholické a vybrané nealkoholické nápoje místní výroby (v rámci all inclusive 10:30-22:45)</li>\r\n<li>Hotel bezlepkovou stravu neposkytuje (pomůže s výběrem z bufetu)</li>\r\n<li>Upozornění: výše uvedené časy jsou stanovené hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Za poplatek:</strong> vodní sporty na pláži."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Živá hudba a tematické večery (2x týdně), možnosti vyžití v centru letoviska Sidari.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětské hřiště, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma:</strong> WiFi v celém areálu hotelu.</p>"}, {"code": "WEB", "title": "Web", "text": "https://www.amourholidayresortcorfu.com/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Korfu", "url": "https://www.eximtours.cz/recko/korfu"}, {"name": "Sidari", "url": "https://www.eximtours.cz/recko/korfu/sidari"}]}}</script></div></html>
