<html><h1>MAREBELLO BEACH RESORT</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2620, "name": "MAREBELLO BEACH RESORT", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Oblíbený zrekonstruovaný rodinný hotel se skládá z hlavní budovy a několika vedlejších budov, umístěných v krásné udržované zahradě. Leží v samém centru letoviska Marmari, u hezké písčité pláže s pozvolným vstupem do moře. Okolí hotelu láká k příjemným večerním procházkám do městečka, kde naleznete spoustu taveren, obchůdků a kaváren. Hotel doporučujeme všem věkovým kategoriím a rodinám s dětmi. Oficiální kategorie hotelu je 3*, naše hodnocení je 4*.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 50 m u pláže</li>\r\n<li>letiště: 9 km Kos</li>\r\n<li>centra: 0 km</li>\r\n<li>nákupních možností: 0 m</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí&nbsp;</li>\r\n<li>hlavní restaurace</li>\r\n<li>hlavní bar</li>\r\n<li>bar u bazénu</li>\r\n<li>bazén se sladkou vodou (lehátka a slunečníky zdarma)</li>\r\n<li>dětský bazén se sladkou vodou</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Standardní pokoj</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace (zdarma)</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednička (zdarma)</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>internet (zdarma)</li>\r\n<li>trezor (za poplatek 2 eura)</li>\r\n<li>vlastní sociální zařízení (koupelna, vysoušeč vlasů, WC)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka na vyžádání (zdarma)</li>\r\n</ul>\r\n<strong>Ubytování za příplatek</strong>\r\n<ul>\r\n<li>Rodinný pokoj – přistýlky formou palandy nebo rozkládacího lůžka.</li>\r\n<li>Třílůžkový pokoj -&nbsp; 3 pevná lůžka.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže"
