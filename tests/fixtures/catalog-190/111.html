<html><h1>Rosamar Garden Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 152495, "name": "Rosamar Garden Resort", "description": [{"code": null, "title": "Obecný popis:", "text": "Plážový hotel Rosamar Garden Resort, oblíbený zvláště u novomanželů na svatební cestě, se nachází cca 42 km od Girona (Barcelona cca 80 km, LLEIDA cca 250 km). Nejbližší písečná pláž leží cca 500 m od hotelu. Na pláži jsou k dispozici slunečníky a lehátka (případně za poplatek). Do turistického centra se dostanete po cca 1 km. Nejbližší nákupní možnosti najdete ve vzdálenosti 40 km od Vašeho ubytování, supermarket najdete ve vzdálenosti cca 200 m. Do nejbližších barů a restaurací se dostanete po cca 500 km. Nejbližší diskotéka se nachází ve vzdálenosti cca 2 km. Další možnosti zábavy Vám během Vašeho pobytu nabízejí kino (cca 5 km) a divadlo (cca 1 km). Z hotelu se můžete dostat k následujícím turistickým zajímavostem: PORT AVENTURA (cca 200 km), SAGRADA FAMILIA (cca 70 km) a MONTSERRAT (cca 8 km). O Vaši mobilitu se během dovolené postarají půjčovna aut a motocyklů, stanoviště taxi (cca 1 km) a také autobusová zastávka (cca 2 km). Do vzdálenějších míst se můžete dostat z nádraží vzdáleného asi 9 km. Lékařskou pomoc najdete v případě potřeby v nemocnici, která se nachází ve vzdálenosti cca 1 km od hotelu. Letiště Barcelona je ve vzdálenosti cca 91 km. Další letiště Girona leží ve vzdálenosti cca 29 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento 7podlažní hotel disponuje celkem 350 pokoji. V hotelu se nachází recepce (přihlášení je možné od 14:00 hodin, odhlášení do 11:00 hodin), lobby s barem, 4 výtahy, klimatizace, sejf (zdarma), parkoviště (za poplatek) a security entry system. O blaho hostů se stará restaurace (klimatizovaná). Novomanželům nabízí hotel obzvláště romatickou polohu a výhled. Wi-Fi je hotelovým hostům k dispozici zdarma. Vozíčkářům nabízí hotel částečně bezbariérové koupelny a bezbariérový vstup. Úklid pokojů a pokojový servis jsou případně za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu s akvaparkem patří 3 bazény se sladkou vodou a dětský bazének. Zde jsou k dispozici slunečníky (případně za poplatek) a také lehátka (zdarma). "}, {"code": null, "title": "Stravování:", "text": "Snídaně formou bufetu. Polopenze: včetně snídaně a večeře. Plná penze zahrnuje snídaně, obědy a večeře. Snídaně, obědy a večeře pouze ve vybraných restauracích. Také dětské menu. All inclusive: snídaně, obědy a večeře. Snídaně, obědy a večeře pouze ve vybraných restauracích. K dispozici jsou také dětské menu. Internet zdarma a zdarma využití sejfu (na kauci). Dřívější přihlášení a pozdější odhlášení je možné (dle vytížení/ dispozice). "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: pilates, tenis (případně za poplatek, vzdálený cca 5 km), kulečník (za poplatek), jóga, stolní tenis (za kauci), aerobik, plážový volejbal, minigolf, fitness, fotbal a šipky (případně za poplatek). Ve vzdálenosti cca 1 km jsou nabízeny vodní sporty (částečně od místních poskytovatelů). Golfové hřiště se nachází 30 km od hotelu. Nabídka wellness: sauna, whirlpool a hamam zdarma. Solárium, parní lázeň a masáže případně za poplatek. Zábava pro dospělé: animační program s večerní show. O zábavu malých hostů se postará dětské hřiště. Hlídání dětí: animační program pro děti od 4 - 9 let, školka a babysitting (případně za poplatek). Herna. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina, němčina, francouzština, ruština, nizozemština, španělština a portugalština. Tento hotel neakceptuje kreditní karty. Kreditní karty: Visa. "}, {"code": null, "title": "Popis pokojů", "text": "Hotel Rosamar Garden Resort má 300 dvoulůžkových pokojů a 50 apartmánů s kapacitou pro 2 až 5 osob.\r\nK základnímu vybavení pokojů patří: zařízená terasa nebo balkon, Koupelna s fénem, satelitní TV, klimatizace, topení, minilednice, telefon, trezor a WiFi připojení k internetu. </br>  </br>  \r\n\r\nJednotlivé druhy pokojů: </br>  \r\n<strong> Standardní dvoulůžkový pokoj</strong>\r\n<li>20 m2</br>  </br>  \r\n\r\n<strong> Apartmán</strong>\r\n<li>35-40 m2\r\n<li>Kuchyň s nádobím\r\n<li>Některé apartmány mají výhled na aquapark</br>  </br>  \r\n"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Brava", "url": "https://www.eximtours.cz/spanelsko/costa-brava"}, {"name": "Lloret de Mar", "url": "https://www.eximtours.cz/spanelsko/costa-brava/lloret-de-mar"}]}}</script></div></html>
