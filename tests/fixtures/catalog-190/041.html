<html><h1>Impressive Playa Granada Golf</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 28380, "name": "Impressive Playa Granada Golf", "description": [{"code": null, "title": "Obecný popis:", "text": "Plážový hotel Impressive Playa Granada leží cca 10 km od Motril (Salobreña cca 5 km, Almuñecar cca 25 km). Nejbližší oblázková pláž leží přímo u hotelu. Na pláži si hosté mohou zapůjčit slunečníky (případně za poplatek). Do turistického centra se dostanete po cca 9 km. Nejbližší nákupní možnosti najdete ve vzdálenosti 70 km od Vašeho ubytování., supermarket najdete ve vzdálenosti cca 800 m. Do nejbližších barů a restaurací se dostanete také po cca 800 m. Také nejbližší diskotéka se nachází ve vzdálenosti cca 800 m. Z hotelu se můžete dostat k následujícím turistickým zajímavostem: Sierra Nevada (cca 96 km) a Málaga (cca 90 km). O Vaši mobilitu se během dovolené postarají blízká autobusová zastávka. Lékařskou pomoc najdete v případě potřeby v nemocnici, která se nachází ve vzdálenosti cca 12 km od hotelu. Mezinárodní letiště v Malaze je vzdáleno cca 95 km od hotelu. "}, {"code": null, "title": "Vybavení:", "text": "Tento 2podlažní hotel, naposledy zrenovovaný v roce 2017, má 300 pokojů. K vybavení hotelu patří recepce (přihlášení je možné od 15:00 hodin, odhlášení do 12:00 hodin), lobby, klimatizace, sejf (případně za poplatek), kadeřnictví, malý obchod, další obchody, kino, diskotéka, divadlo, parkoviště (za poplatek) a směnárna. Wi-Fi je hotelovým hostům k dispozici zdarma. Dále má hotel konferenční prostor s připojením k internetu. Služba praní prádla je za poplatek. Služba žehlení prádla je případně za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení námořnicky zařízeného hotelu patří bazén a dětský bazének. Zde jsou k dispozici slunečníky (případně za poplatek). "}, {"code": null, "title": "Stravování:", "text": "Polopenze: včetně snídaně a večeře. Plná penze zahrnuje s
