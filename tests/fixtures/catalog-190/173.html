<html><h1>NINOS GRAND BEACH</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 145234, "name": "NINOS GRAND BEACH", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Zrekonstruovaný hotel v 2023 na řecké pevnině v oblasti Kastrosikia, pouhých 18 km severně od města Prevezy, nedaleko ostrova Lefkáda, je postaven na privilegovaném místě přímo u moře, na dlouhé pláži Kastrosikia s nejdelším pobřežím Středozemního moře. Jedná se o hotelový komplex se stávající z hlavní budovy a vedlejších budov,&nbsp; který je bklopen rozlehlou zahradou s okrasnými květinami a stromy. Nedaleko se nacházejí místní malebné taverny (cca 2km) v Kanali, kde můžete ochutnat místní pochoutky. Pouhých 10 km odtud je významné archeologické naleziště Nicopolis, město založené Oktavianem Augustem na památku jeho vítězství v bitvě u Aktia (roku 31 př.n.l.) proti Antoniovi a Kleopatře a cca 7 km se nachází archeologické naleziště Kassope s úžasným výhledem na Ambracianský záliv a Jónské moře.&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenosti", "text": "<ul>\r\n<li>Pláž: 0</li>\r\n<li>Vzdálenost od letiště: 20 km</li>\r\n<li>Město Preveza: 18 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong><strong>Dvoulůžkový pokoj:&nbsp;</strong></strong><br />\r\n<ul>\r\n<li>koupelna, fén</li>\r\n<li>klimatizace (zdarma)</li>\r\n<li>satelitní TV</li>\r\n<li>mini lednička (zdarma)</li>\r\n<li>bezpečnostní schránka (zdarma)</li>\r\n<li>telefon,&nbsp; Wi-Fi&nbsp;</li>\r\n<li>balkon nebo terasa</li>\r\n<li>rozloha pokoje 20,15m2</li>\r\n</ul>\r\n<br /><strong><strong><strong>Ostatní typy pokojů </strong></strong></strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<strong><strong><strong><br /></strong></strong></strong>\r\n<ul>\r\n<li><strong>Pokoj s výhledem na moře:</strong> výhled moře, rozloha 20,15m2, možná dětská postýlka (zdarma)</li>\r\n<li><strong>Pokoj Superior: </strong>prostornější 23,15m2, možnost ubytování až 3 osoby. Není zde místo na dětskou postýlku.</li>\r\n<li><strong>Pokoj Superior, výhled moře: </strong>viz. Superior pokoj, výhled na moře.&nbsp; Není zde místo na dětskou postýlku.</li>\r\n<li><strong>Rodinný pokoj s palandou:</strong> viz. Dvoulůžkový pokoj; větší pokoj 23,15m2 s palandou. Není zde místo na dětskou postýlku. Možnost ubytovat max. 3 dospělé osoby.</li>\r\n<li><strong>Rodinný pokoj s palandou, výhled moře:</strong><strong>&nbsp;</strong>viz. rodinný pokoj s palandou; výhled moře. Není zde místo na dětskou postýlku. Možnost ubytovat max. 3 dospělé osoby.</li>\r\n<li><strong>Superior rodinný pokoj, 2 místnostmi oddělené posuvnou stěnou, výhled moře: </strong>rodinný pokoj s 2 místnostmi 27,50/29 m2. Možná dětská postýlka (zdarma)</li>\r\n<li><strong>Deluxe rodinný pokoj, 2 místnosti oddělené posuvnou stěnou, výhled moře, sdílený bazén </strong>(se slanou vodou)<strong>: </strong>viz. rodinný pokoj s 2 místnostmi, rozloha 28/30m2. Není zde místo na děstkou postýlku.&nbsp;</li>\r\n<li><strong>Junior Suita, výhled moře: </strong>rozloha 28/30m2, možnost ubytování až 3 osob, kávovar nespresso,&nbsp; bezplatné použití hotelového tabletu (nutná záloha), možná dětská postýlka (zdarma).</li>\r\n<li><strong>Junior Suita se sdíleným bazénem, výhled moře: </strong>viz Junior Suita s výhledem na moře; sdílený bazén se slannou vodou. Možná dětská postýlka (zdarma)</li>\r\n</ul>\r\n<strong><strong><br /></strong></strong>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí s 24 hodinových servisem</li>\r\n<li>lobby a vnitřní bar</li>\r\n<li>restaurace</li>\r\n<li>bar u bazénu</li>\r\n<li>snack bar</li>\r\n<li>Wi-Fi ve společných prostorách hotelu (zdarma),</li>\r\n<li>bazény se slanou vodou (lehátka a slunečníky zdarma)</li>\r\n<li>dětský bazén se slanou vodou</li>\r\n<li>dětské hřiště</li>\r\n<li>lékařská služba na zavolání (za poplatek)</li>\r\n<li>parkování pro hotelové hosty (zdarma)</li>\r\n<li>dětský klub (pro děti 4–10 let)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>Dlouhá písečno-oblázková pláž přímo u hotelu (lehátka a slunečníky zdarma). Doporučujeme boty do vody</li>\r\n<li>Plážové osušky k dispozici za zálohu 10EUR, výměna 2EUR.&nbsp;</li>\r\n<li>Plážový bar za poplatek (není v rámci All inclusive).</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<p><strong>All inclusive:</strong><br />V hlavní restauraci snídaně 7.30 - 10.00, obědy 12.30 - 14.30,&nbsp; večeře formou bufetu 19.00 do 21.30.<br />Během jídla jsou v ceně místní nápoje (točené pivo, domácí víno, nealkoholické nápoje, voda (ne balená).<br />Dětské menu. Dětské jídelní židličky v restauraci.<br />Během večeře v restauraci je vyžadován dress code smart casual (u mužů nejsou akceptovány krátké kalhoty).<br /><strong>Epirus bar</strong> - hlavní bar zahrnutý v all inclusive balíčku: <br />7.30 – 10.00 – točené pivo, domácí víno, nealko nápoje, voda (nebalená), káva, čaj.<br />19.00 – 22.30 – podává alkoholické nápoje místní výroby (Ouzo, Gin, Vodka, Rum) točené pivo, domácí víno, nealko nápoje, voda (nebalená), káva, čaj.<br /><strong>Olympia Pool bar</strong> -10.00 - 19.00 nápoje a zmrzlina, 11.00 - 12.00 dopolední snack, 12.00-16.30 teplé občerstvení, 15.00 - 18.00 (čaj, káva, sušenky).&nbsp;<br />Balíček All inclusive zahrnuje lihoviny místní produkce (Ouzo, Gin, Vodka, Rum), točené pivo, domácí víno, nealkoholické nápoje, voda. Všechny koktejly jsou vyráběny z místních nápojů.&nbsp;<br /><strong>Hlavní bar Nikopolis</strong> 18.00 - 24.00 \"a la carte\" bar, značkové nápoje, káva, nealko nápoje (za poplatek).</p>\r\n<p><strong>A la carte restaurace</strong> \"Syrtaki taverna\" za poplatek (není v All inclusive programu). Sleva 20% pro klienty hotelu.&nbsp;<br /><br /></p>\r\n<ul>\r\n<li>bezlepkovou / bezlaktozovou stravu nutno nahlásit po příjezdu do hotelu</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>stolní tenis</li>\r\n<li>tenisový kurt</li>\r\n<li>basketbalové hřiště</li>\r\n<li>venkovní a vnitřní dětské hřiště</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p><strong>Animační program Funtazie klubu v termínu 23.6. - 4.9.2027</strong></p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<strong>Motion - dovolená v pohybu - český animační klub pro dospělé v termínu 4.6.2026 - 24.9.2026.</strong>\r\n<ul>\r\n<li>2 x týdně tematické večery s živou hudbou a řeckými tanci</li>\r\n</ul>"}, {"code": "ABOUT_HOTEL", "title": "Pro Handicapované", "text": "<ul>\r\n<li>rampa u vchodu do hotelu a všech veřejných prostor včetně prostoru u bazénu</li>\r\n<li>široké vstupní dveře</li>\r\n<li>upravené pokoje pro handicapované na vyžádání</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>Domácí zvířata nejsou povolena</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> Internet ve společných prostorách hotelu, Wi-Fi na pokojích"}, {"code": "WEB", "title": "Web", "text": "https://www.ninosgrandbeachresort.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Lefkada", "url": "https://www.eximtours.cz/recko/lefkada"}, {"name": "Preveza", "url": "https://www.eximtours.cz/recko/lefkada/preveza"}]}}</script></div></html>
