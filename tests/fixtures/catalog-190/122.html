<html><h1>Jo-An Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2504, "name": "Jo-An Beach", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V letovisku Adelianos Kampos, cca 6 km od města Rethymnon. Vzdálenost od letiště v Heraklionu cca 70 km a letiště Chania cca 73 km. V okolí obchody, restaurace, taverny.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, salonek, restaurace, bar, společenská místnost s TV, prádelna za poplatek (na vyžádání). 2 bazény (nově po rekonstrukci), z toho jeden s oddělenou částí pro děti, terasa na slunění s lehátky a slunečníky zdarma, osušky za poplatek 2,5 EUR (každá další výměna také za poplatek 2,5 EUR), bar u bazénu (v přední části hotelu u pláže).</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Promo:</strong> koupelna/WC (vysoušeč vlasů), telefon, trezor za poplatek (cca 2 EUR/den), lednička, klimatizace, set na přípravu kávy a čaje, TV/sat., balkon nebo terasa.<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong></li>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře:</strong>&nbsp;částečný výhled na moře</li>\r\n<li><strong>Rodinný pokoj, 1 ložnice:</strong> ložnice a obývací část</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice, Výhled zahrada:</strong> 2 oddělené ložnice</li>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled zahrada: </strong>zrekonstruované pokoje, trepky a župany</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Boční výhled na moře: </strong>zrekonstruované pokoje, trepky a župany</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s oblázky přímo u hotelu. Pro vstup do moře doporučujeme obuv. Lehátka a slunečníky za poplatek (cca 6 EUR/set/den).</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze:</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<strong><strong>All Inclusive:<br /></strong></strong>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (11.00–23.00 hod.)</li>\r\n<li>Zmrzlina (11.30–12.30 a 15.30–17.30 hod.)</li>\r\n<li>Snack (11.30–12.30 a 16.00–17.00 hod.)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Za poplatek:</strong> elektronické hry, kulečník, vodní sporty na pláži."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Nákupní a zábavní možnosti, bary a restaurace v okolí hotelu, 1× týdně řecký večer.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, dětské hřiště, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v lobby a na pokojích.<br /><strong>Za poplatek:</strong> internetový koutek."}, {"code": "WEB", "title": "Web", "text": "http://www.joanbeach.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Adelianos Kampos", "url": "https://www.eximtours.cz/recko/kreta/adelianos-kampos"}]}}</script></div></html>
