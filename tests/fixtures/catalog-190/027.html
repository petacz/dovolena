<html><h1>Agapi Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2314, "name": "Agapi Beach Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotelový komplex se zahradou cca 6 km západně od Heraklionu, v letovisku Amoudara, přímo na pláži. V okolí možnosti nákupů a zábavy.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Hlavní budova a bungalovy v krétském stylu. Vstupní hala s recepcí, restaurace s mezinárodní a řeckou kuchyní, taverna, italská restaurace &#224; la carte, lobby bar, konferenční místnost. V zahradě 3 bazény, dětské brouzdaliště, terasa na slunění, lehátka, osušky a slunečníky zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: koupelna (vysoušeč vlasů), trepky, WC, klimatizace, telefon, TV/sat., hudební kanál, trezor (zdarma), minilednička (lahev vody po příletu), set pro přípravu čaje a kávy, balkon nebo terasa, cca 21m2, umístěné v v prvním a druhém patře hlavní budovy.<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře: </strong>balkon, cca 23m2</li>\r\n<li><strong>Dvoulůžkový pokoj, Premium, Výhled moře: </strong>nově zrekonstruované pokoje,<strong> </strong>župany, pantofle, Nespresso kávovar (denně doplňované kapsle), balkon, cca 23m2.</li>\r\n<li><strong>Bungalov, Výhled zahrada: </strong>župany, pantofle, cca 25m2.</li>\r\n<li><strong>Bungalov, Boční výhled moře: </strong>župany, pantofle, cca 25m2.</li>\r\n<li><strong>Bungalov, Sea Front, Výhled moře:</strong> v první řadě u moře, župany, pantofle, cca 25m2.</li>\r\n<li><strong>Bungalov, Exclusive:</strong> prostornější, modernější vybavení, župany, pantofle, cca 30m2, Nespresso kávovar (denně doplňované kapsle, od sezony 2027)</li>\r\n<li><strong>Bungalov, Exclusive, Pool Front</strong>: prostornější, modernější vybavení, výhled na bazén, župany, pantofle, cca 30m2, Nespresso kávovar (denně doplňované kapsle, od sezony 2027)</li>\r\n<li><strong>Mezonet, 2 ložnice:</strong> 1 ložnice v přízemí + 1 ložnice v patře, župany, pantofle, cca 60m2, Nespresso kávovar (denně doplňované kapsle, od sezony 2027)</li>\r\n<li><strong>Suita, 1 ložnice:</strong> ložnice a obývací část oddělená dveřmi, župany, pantofle, Nespresso kávovar (denně doplňované kapsle), cca 35m2, nově zrekonstruované pro sezonu 2026, 1x přístup do SPA zdarma (Sauna nebo Hammam, od sezony 2027, 18+), Netflix, minibar (nealkoholické nápoje a pivo, doplňované každý 3 den, od sezony 2027)</li>\r\n<li><strong>Rodinná Suita, 1 ložnice:</strong> ložnice a obývací část oddělená dveřmi, župany, pantofle, Nespresso kávovar (denně doplňované kapsle), cca 35m2, nově zrekonstruované pro sezonu 2026, 1x přístup do SPA zdarma (Sauna nebo Hammam, od sezony 2027, 18+), Netflix, minibar (nealkoholické nápoje a pivo, doplňované každý 3 den, od sezony 2027)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Přímo u písečné pláže oceněné modrou vlajkou. Lehátka, slunečníky a osušky zdarma. Bar a taverna na pláži.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All Inclusive Premium:</strong></p>\r\n<ul>\r\n<li>Brzká snídaně 5.00-7.00 (na vyžádání), snídaně 7:00-10.30, pozdní snídaně 10.30-11.00, oběd 12.30-14.00 a večeře 18.45-21.30 formou bufetu, pozdní lehké občerstvení 21.45-23.00.</li>\r\n<li>Taverna: 11.00-17.30 nealkoholické nápoje, káva, víno, pivo, zrmzlina, 13.00-15.30 oběd formou bufetu</li>\r\n<li>Možnost večeře v taverně nebo italské restauraci a´la carte (po předchozí rezervaci minimálně 1 den předem)</li>\r\n<li>\"Taka-Taka\" 12.30-17.30 gyros, souvlaki, burger atd., 15.00-17.00 palačinky, vafle.</li>\r\n<li>Čaj, káva, cappuccino, alkoholické a nealkoholické nápoje místní výroby a vybraný značkový alkohol v taverně nebo v baru na pláži (11.00–17.30 hod.)</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby a vybraný značkový alkohol, hlavní bar (17.00–01.00 hod.), bar u bazénu (10.00-17.30), bar na pláži (10.00-17.30)</li>\r\n<li>Odpolední káva, čaj a zákusky (16.00–17.30 hod., v baru u bazénu \"Amora\"))</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> 2 tenisové kurty (osvětlení a výuka za poplatek), fitness, volejbal, šipky, stolní tenis, šlapadla, kánoe, plážový volejbal.<br /><strong>Za poplatek:</strong> vodní sporty na pláži."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Animační programy a večery s živou hudbou.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětské brouzdaliště, hřiště, miniklub, dětský bufet v hlavní restauraci (během oběda a večeře), hlídání dětí za poplatek (na vyžádání), dětská postýlka zdarma.</p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>Za poplatek:</strong><br />\r\n<ul>\r\n<li>SPA centrum</li>\r\n</ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<p>Na vyžádání k dispozici několik bezbariérových bungalovů.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v celém areálu hotelu."}, {"code": "WEB", "title": "Web", "text": "http://www.agapibeach.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>\r\n<p>&nbsp;</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Amoudara", "url": "https://www.eximtours.cz/recko/kreta/amoundara"}]}}</script></di
