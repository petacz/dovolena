<html><h1>Grecotel Casa Paradiso</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2621, "name": "Grecotel Casa Paradiso", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>U dlouhé písečné pláže cca 2 kilometry od centra menšího letoviska Marmari s obchůdky, tavernami a bary. Autobusová zastávka cca 50 metrů od hotelu, dobré dopravní spojení do hlavního města. Letiště Kos je vzdáleno 12 km od hotelu.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>268 pokojů, hlavní budova a bungalovy v zahradě, vstupní hala s recepcí, výtah v hlavní budově, hlavní restaurace, řecká taverna na pláži, plážový bar, bar u bazénu a snack bary, TV/video místnost, amfiteátr, minimarket, obchod se suvenýry. V udržované zahradě dva bazény včetně brouzdaliště, dětský bazén s tobogany. Lehátka, slunečníky a osušky u bazénu zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj (Casa room, fields view)</strong>: koupelna s vanou/WC (vysoušeč vlasů), klimatizace, TV/sat., telefon, set na přípravu kávy a čaje, minilednička, trezor za poplatek, balkon nebo terasa, hlavní budova, cca 23m2.<br /><br />Ostatní typy pokojů (pokud není uvedeno jinak,&nbsp; mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Promo</strong> <strong>(Mini room)</strong>:&nbsp; menší cca 18m2,&nbsp; hlavní budova.</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled směrem k moři (Casa room, side sea view)</strong>: výhled směrem k moři, hlavní budova, cca 23m2</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled&nbsp; na moře</strong> <strong>(Casa room, sea view)</strong>: výhled na moře, hlavní budova, cca 23m2.</li>\r\n<li><strong>Bungalov (Casa Veranda Fields view)</strong>:&nbsp; v zahradě ve viladomech, po rekonstrukci, cca 24m2.</li>\r\n<li><strong>Bungalov, Výhled směrem k moři (Casa Veranda, side sea view)</strong>: v zahradě ve viladomech, výhled strana k moři, po rekonstrukci, cca 24m2.</li>\r\n<li><strong>Bungalov s výhledem na moře (Casa Veranda, sea view)</strong>): v zahradě ve viladomech, výhled na moře, po rekonstrukci, cca 24m2.</li>\r\n<li><strong>Rodinný pokoj v bungalovu do krajiny&nbsp;(Family bungalow fields view):</strong>&nbsp; v zahradě ve viladomech, 2 oddělené místnosti (zatahovacími dveřmi), výhled do krajiny, cca 35m2.</li>\r\n<li><strong>Rodinný pokoj v bungalovu strana k moři</strong> <strong>(Family Cabana side sea view)</strong>: v zahradě ve viladomech, 2 oddělené místnosti (zatahovacími dveřmi), výhled strana k moři , po rekonstrukci, cca 35m2.</li>\r\n<li><strong>Rodinný pokoj</strong> <strong>(Casa family fields view)</strong>: , 2 oddělené místnosti (zatahovacími dveřmi), patrová postel nebo další lůžka pro děti, cca 32 m2.</li>\r\n<li><strong>Rodinný pokoj</strong> <strong>(Casa family side sea view)</strong>:&nbsp; 2 oddělené místnosti (zatahovacími dveřmi), patrová postel nebo další lůžka pro děti, výhled strana k moři, cca 32 m2.</li>\r\n<li><strong>Suita (Casa Banana): </strong>2 místnosti oddělené zatahovacími dveřmi, po rekonstrukci, cca 32 m2.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Dlouhá písečná pláž se světlým pískem. Lehátka a slunečníky zdarma. K dispozici sprchy a převlékárny.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive<br /><br /></strong></p>\r\n<ul>\r\n<li>Snídaně formou bufetu (07.30–10.00 hod.)</li>\r\n<li>Pozdní kontinentální snídaně (10.00–10.30 hod.)</li>\r\n<li>Oběd formou bufetu (12.30–14.30 hod.)</li>\r\n<li>Večeře pro děti (18.30–19.30 hod.)</li>\r\n<li>Večeře formou bufetu (18.30–21.30 hod.)</li>\r\n<li>Tematické večeře</li>\r\n<li>Káva, čaj, nealkoholické nápoje, pivo, víno, alkoholické nápoje a koktejly, zmrzlina, palačinky a sušenky v taverně a plážovém baru (10.30–18.00 hod.)</li>\r\n<li>Saláty, dezerty a ovoce v taverně (12.30–14.30 hod.)</li>\r\n<li>Dopolední a odpolední snack formou bufetu (11.00–12.15 a 16.30–17.00 hod.)</li>\r\n<li>Palačinky v taverně u plážového baru (ve vybraných hodinách)</li>\r\n<li>Nealkoholické a alkoholické nápoje (10.00–23.00 hod.)</li>\r\n<li>Půlnoční snack v lobby baru (23.30–24.00 hod.)</li>\r\n<li>Bar na pláži (10.00–13.00 hod.)</li>\r\n<li>Zmrzlina (11.30-18:00 hod.)</li>\r\n</ul>\r\n<p><strong>&nbsp;</strong></p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma:</strong> tobogan, 2 tenisové kurty, stolní tenis, šipky, boccia,&nbsp; plážový volejbal, hřiště na basketbal, fitnes, aerobik,</li>\r\n<li><strong>Za poplatek: </strong>&nbsp;vodní sporty na pláži, půjčovna kol, lekce tenisu pro děti a dospělé, biliárd.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Bohatý denní i večerní program – aquaaerobik, jogging, vodní pólo, show, disko.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Grecoland klub (3–12 let), pro starší děti během dne sportovní a jiné zábavné aktivity, malé hřiště se skluzavkou a houpačkami, dětská postýlka zdarma, židličky, ohřívače láhví, sterilizátory, monitory a kočárky, možnost zakoupení dětského jídla, kosmetiky, oblečení, hraček a plen, hlídání dětí (na vyžádání), Grecoteens (13–17 let, od poloviny června do poloviny září) – zábava včetně sportovních her, vodního póla, plážového volejbalu, basketbalu, lukostřelby atd.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi ve veřejných prostorách a na pokojích.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "http://www.grecotel.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita výše uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kos", "url": "https://www.eximtours.cz/recko/kos"}, {"name": "Marmari", "url": "https://www.eximtours.cz/recko/kos/marmari"}]}}</script></div></html>
