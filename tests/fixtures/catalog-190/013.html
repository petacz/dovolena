<html><h1>Serenusa Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 153765, "name": "Serenusa Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Hotel Serenusa Village prošel kompletní rekonstrukcí v roce 2023 a je navržen tak, aby vyhoval veškerým potřebávám dospělých i dětí. Nachází se přímo na nádherné pláži Licata, cca 42 km od proslulého Valle dei Templi. Rodiny jistě potěší bohaté zázemí pro děti, využít lze tobogány či dětské hřiště nebo dětské kluby. Vybírat lze ze široké nabídky sportovních aktivit a animačních programů. Jedná se o skvělou volbu i pro náročnější klienty."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: přímo na pláži</li>\r\n<li>letiště: 65 km Comiso</li>\r\n<li>centra: 4 km Falconara</li>\r\n<li>nákupních možností: 8,8 km Licata</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>koupelna/WC</li>\r\n<li>individuální klimatizace</li>\r\n<li>TV</li>\r\n<li>minilednice</li>\r\n<li>trezor</li>\r\n<li>balkon</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>2x restaurace (a la carte Il Gusto a Blu Beach Restaurant)</li>\r\n<li>tématická restaurace Il Patio - dostupná po předchozí rezervaci na oběd a večeři</li>\r\n<li>plážová restaurace \"Sea Box\"</li>\r\n<li>bar</li>\r\n<li>plážový bar</li>\r\n<li>velký sladkovodní bazén s tobogány a vířivkou (cca 800 m2)</li>\r\n<li>bazén se sladkou vodou (25m x 8m)</li>\r\n<li>butiky a obchody</li>\r\n<li>bankomat</li>\r\n<li>pronájem automobilů</li>\r\n<li>parkoviště</li>\r\n<li>WiFi zdarma</li>\r\n<li>dětské hřiště</li>\r\n<li>miniklub, teeny club, junior club</li>\r\n<li>místnost pro úschovnu zavazadel</li>\r\n<li>amfiteátr</li>\r\n<li>doktor (za poplatek)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>soukromá písečná pláž</li>\r\n<li>plážový servis - 1 slunečník a 2 lehátka zdarma (na pokoj, od 4. řady)</li>\r\n<li>osušky pro klienty od 12 let zdarma, do 12 let za poplatek</li>\r\n<li>bar na pláži</li>\r\n<li>první 3 řady - vetší slunečníky a trezor (za poplatek)</li>\r\n<li>přístupná i pro hůře pohyblivé, přístup na pláž je po zpevněné cestě o délce cca 180 m s maximálním sklonem 6 %</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>plážový volejbal</li>\r\n<li>plážový tenis</li>\r\n<li>aquagym</li>\r\n<li>yoga</li>\r\n<li>zumba</li>\r\n<li>fotbalové hřiště s umělou trávou</li>\r\n<li>tenis</li>\r\n<li>lukostřelba</li>\r\n<li>stolní tenis</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>windsurfing</li>\r\n<li>paddleboard</li>\r\n<li>kánoe</li>\r\n<li>šlapadla</li>\r\n<li>wellness a SPA</li>\r\n<li>masáže</li>\r\n<li>hotelový shuttle bus do městečka Licata (cena cca 3 EUR/směr/osoba)</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive<br /></strong>\r\n<ul>\r\n<li>Snídaně, obědy a večeře formou bufetu, neomezené množství rozlévaných nealkoholických a vybraných alkoholických nápojů místní výroby, od 19:30 výběr koktejlů</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "Pobytová taxa 2-4 EUR/os. noc splatná v hotovosti v destinaci. V hotelovém bazénu nově&nbsp;<strong>není</strong>&nbsp;vyžadována koupací čepice.<br /><br /><span data-teams=\"true\">Deposit ve výši 10 EUR/pokoj/pobyt za Smart Card, která je využívaná pro placení v hotelu. Tuto částku lze utratit za služby v hotelu, v případě nevyužití služeb je na konci pobytu zůstatek na kartě refundovatelný.</span><br /><br /><strong>Poplatek:</strong> Coccinella Baby Care - zahrnut v ceně. Pro rodiny s dětmi 0-3 let. Zahrnuje dětskou postýlku, dětskou kosmetiku
