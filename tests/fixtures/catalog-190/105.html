<html><h1>Porto Skala</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2430, "name": "Porto Skala", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Jednopodlažní vilky postavené&nbsp;v mírném kopci nad mořem. Letovisko Skala&nbsp;s obchody, tavernami, kavárnami a bary cca&nbsp;3 km, hlavní město ostrova Argostoli a letiště&nbsp;cca 50 km. Zastávka autobusu u hotelu.<br />Pravidelná autobusová doprava do střediska Skala za poplatek 1,50 EUR/jedna cesta</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 40 m</li>\r\n<li>letiště: 50 km</li>\r\n<li>centra: 3 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Boční výhled moře<br /></strong>\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>individuální klimatizace</li>\r\n<li>telefon</li>\r\n<li>satelitní TV</li>\r\n<li>minibar</li>\r\n<li>trezor (zdarma)</li>\r\n<li>balkon nebo terasa</li>\r\n</ul>\r\n<br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře: </strong>výhled na moře.</li>\r\n<li><strong>Jednolůžkový pokoj, Boční výhled moře:</strong> jedno lůžko.</li>\r\n<li><strong>Rodinný pokoj, Boční výhled moře</strong><strong> :&nbsp; </strong>navíc 2 lůžka většinou ve formě palandy</li>\r\n<li><strong>Rodinný pokoj, Výhled moře</strong><strong> : </strong>navíc 2 lůžka většinou ve formě palandy<strong> </strong>s výhledem na moře</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>74 vkusně zařízených pokojů v klasickém řeckém stylu ve vilkách v zahradě</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>směnárna</li>\r\n<li>menší obchodní arkáda</li>\r\n<li>společenská a konferenční místnost,</li>\r\n<li>hlavní restaurace s venkovní terasou</li>\r\n<li>bary</li>\r\n<li>venkovní bazén s terasou na slunění,
