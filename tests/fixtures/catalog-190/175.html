<html><h1>Amour Garden</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 258142, "name": "Amour Garden", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Nově vybudovaný hotel se nachází v živém letovisku Sidari, nedaleko vyhlášené pláže Canal d´Amour. Přímo sousedí se sesterským resortem Amour Holiday, se kterým sdílí služby i stravování. Hotel doporučujeme všem věkovým skupinám i rodinám s dětmi.&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m u pláže</li>\r\n<li>letiště: 38 km</li>\r\n<li>centra: 150 m</li>\r\n<li>nákupních možností: 150 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj, Deluxe, Výhled zahrada</strong>:<br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>TV/sat., klimatizace</li>\r\n<li>lednička</li>\r\n<li>trezor</li>\r\n<li>telefon</li>\r\n<li>varná konvice</li>\r\n<li>balkon/ terasa</li>\r\n<li>20 m2</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong>&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul style=\"list-style-type: disc;\">\r\n<li><strong>Dvoulůžkový pokoj, Superior: </strong>prostornější, 26 m2.</li>\r\n<li><strong>Rodinný pokoj, Deluxe, Palanda, Výhled zahrada:</strong> prostornější, palanda, 28 m2.</li>\r\n<li><strong>Rodinný pokoj, Deluxe, Výhled zahrada, Posuvné dveře: </strong>prostornější,<strong> </strong>místnost oddělená posuvnými dveřmi, 28 m2.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>hlavní budova a několik dvoupatrových budov</li>\r\n<li>vstupní hala s recepcí (trezor za poplatek)</li>\r\n<li>restaurace</li>\r\n<li>bar</li>\r\n<li>bazén</li>\r\n<li>bar u bazénu</li>\r\n<li>terasa s lehátky a slunečníky zdarma (osušky u bazénu zdarma)</li>\r\n<li>dětské hřiště</li>\r\n<li>dětská postýlka zdarma</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písečná pláž cca 100 m</li>\r\n<li>lehátka a slunečníky za poplatek</li>\r\n<li>hotelové osušky oproti depositu, výměna za poplatek</li>\r\n<li>pláž Canal d´Amour cca 400 m</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<p><strong>All inclusive</strong></p>\r\n<ul style=\"list-style-type: disc;\">\r\n<li>Snídaně (7:30-10:00), oběd (12:30-14:30) a večeře (19:00-21:30) formou bufetu.</li>\r\n<li>Lehký snack během dne (11:00-12:00, 15:00-18:00)</li>\r\n<li>Alkoholické a vybrané nealkoholické nápoje místní výroby (v rámci all inclusive 10:30-22:45)</li>\r\n<li>Stravování probíhá v sesterském hotelu Amour Holiday Resort (stejný areál)</li>\r\n<li>Hotel bezlepkovou stravu neposkytuje (pomůže s výběrem z bufetu)</li>\r\n<li>Upozornění: výše uvedené časy jsou stanovené hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty na pláži</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>živá hudba a tematické večery (2x týdně)</li>\r\n<li>možnosti vyžití v centru letoviska Sidari</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>WiFi v celém areálu hotelu areálu zdarma</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Korfu", "url": "https://www.eximtours.cz/recko/korfu"}, {"name": "Sidari", "url": "https://www.eximtours.cz/recko/korfu/sidari"}]}}</script></div></html>
