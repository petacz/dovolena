<html><h1>CLUB HOTEL MARINA BEACH</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 146129, "name": "CLUB HOTEL MARINA BEACH", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Club Hotel Marina Beach stojí na pobřeží zálivu Orosei, pouhých cca 200 metrů od nádherné pláže . Těšit se můžete na hned několik kouzelných vedle sebe ležících pláží lemovaných hustými bujnými borovými lesy. Pro své hosty připravenou bohatou nabídku nejrůznějších sportů i aktivit a o zábavu pečuje po celou dobu pobytu také profesionální tým animátorů. Nejlepším místem pro relaxaci je velký venkovní bazén, u kterého můžete koupání střídat s popíjením osvěžujících koktejlů. Ve vzpomínkách na nezapomenutelný pobyt na Sardinii jistě nebudou chybět ani příjemné chvíle spojené s typickými místními jídly, národními specialitami a mezinárodními pokrmy, které se v době obědů i večeří podávají formou bufetu. Za příplatek a na základě předchozí rezervace zajišťuje Club Hotel Marina Beach pravidelnou kyvadlovou dopravu do měst Orosei.&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 200 m</li>\r\n<li>letiště: 86 km&nbsp;</li>\r\n<li>centra: 2 km</li>\r\n<li>nákupních možností: 0 m v resortu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový/Třílůžkový/Čtyřlůžkový pokoj</strong><br />\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>TV/SAT</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>telefon</li>\r\n<li>minibar (za poplatek)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>u třílůžkového pokoje při obsazenosti 2 osobami můžou být jen dvě lůžka</li>\r\n<li>u čtyřlůžkového pokoje při obsazenosti 2 a 3 osobami můžou být jen dvě nebo tři lůžka</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace s terasou</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<
