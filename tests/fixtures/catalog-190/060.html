<html><h1>Cavo Orient Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 5178, "name": "Cavo Orient Beach Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V klidné poloze přímo na břehu moře, oblíbené turistické středisko Tsilivi s mnoha obchody, restauracemi a bary cca 5 km, menší supermarket cca 500 m, autobusová zastávka 500m, hlavní město Zakynthos cca 11 km, letiště Zakynthos cca 15 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, výtah, restaurace, á la carte restaurace, 2 bary, bazén, lehátka a slunečníky u bazénu zdarma, bar u bazénu, zahrada. Areál rozdělený na 3 ubytovací části; Cavo Orient Beach/ Cepu Orient / Cavo Orient Beach Annex.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Deluxe: </strong>koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., minilednička, trezor, set pro přípravu kávy a čaje, balkon nebo terasa, 29 m².<br />\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul style=\"list-style-type: disc;\">\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Nová budova:&nbsp;</strong>moderní pokoje umístěné v nově postavené budově naproti hotelu (CEPU Orient).</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Sdílený bazén, Nová budova:</strong> vstup do sdíleného bazénu, moderní pokoje umístěné v nově postavené budově naproti hotelu (CEPU Orient).</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Sdílený bazén:</strong> vstup do sdíleného bazénu.</li>\r\n<li><strong>Junior Suita, Výhled moře, Výhled bazén:</strong> prostornější, výhled moře/ bazén, 34 m².</li>\r\n<li><strong>Junior Suita, Sdílený bazén:</strong> prostornější, přístup do sdíleného bazénu, 34 m².</li>\r\n<li><strong>Suita, Luxury, Výhled moře:</strong> prostornější, v hlavní budově, výhled na moře, 40 m².</li>\r\n<li><strong>Suita, Strana k moři:</strong> směrem k pláži, výhled na moře, 40 m2.</li>\r\n<li><strong>Suita, Luxury, Sdílený bazén:</strong> prostornější, přístup do sdíleného bazénu, v hlavní budově, 40 m².</li>\r\n<li><strong>Suita, Soukromý bazén:</strong> směrem k pláži, privátní bazén, 40m2.</li>\r\n<li><strong>Suita, Deluxe, Výhled na moře, Annex:</strong> prostornější, 40 m², ložnice oddělená posuvnými dveřmi, umístěné v annexové budově vzdálené cca 300 m (výhled na moře z větší vzdálenosti)</li>\r\n<li><strong>Suita, Deluxe, Soukromý bazén, Annex:</strong> privátní bazén, ložnice oddělená posuvnými dveřmi, umístěné v annexové budově vzdálené cca 300 m.</li>\r\n<li><strong>Honeymoon Suita, Strana k moři: </strong>luxusní suita směrem k pláži, výhled na moře, 40 m2.</li>\r\n</ul>\r\n<strong><br />* Ubytování je rozděleno do 3 samostatných částí:</strong><br />\r\n<ul>\r\n<li>Cavo Orient Beach - hlavní areál</li>\r\n<li>Cepu Orient - nově postavená budova cca 80m od hlavního areálu (2025)</li>\r\n<li>Cavo Orient Beach Annex - v klidnější části, cca 300m od hlavní budovy</li>\r\n</ul>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack během dne</li>\r\n<li>Odpolední čaj, káva a zákusek</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje místní výroby (10.00–23.00 hod.)</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s pozvolným vstupem do moře přímo u hotelu; slunečníky, lehátka a plážové osušky zdarma (výměna možná každý den, ztráta 25e). Při vstupu do moře mohou být oblázky, doporučujeme obuv do vody.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul style=\"list-style-type: disc;\">  <li><strong>Zdarma: </strong>posilovna</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, dětské hřiště, dětská herna, dětská postýlka (za poplatek splatný na místě, na vyžádání).</p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "4x týdně živá hudba v baru u bazénu"}, {"code": "WELLNESS", "title": "Wellness", "text": "<ul style=\"list-style-type: disc;\">\r\n<li><strong>Zdarma:</strong> vnitřní bazén</li>\r\n<li><strong>Za poplatek:</strong> masáže (na vyžádání)</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul style=\"list-style-type: disc;\">\r\n<li><strong>Zdarma:</strong> WiFi v areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://www.cavoorient.com/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Drosia", "url": "https://www.eximtours.cz/recko/zakynthos/drosia"}]}}</script></div></html>
