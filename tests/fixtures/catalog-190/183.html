<html><h1>H10 Tenerife Playa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 12924, "name": "H10 Tenerife Playa", "description": [{"code": null, "title": "Obecný popis:", "text": "Jen pár kroků od veřejné písečné/ kamenité pláže \"Playa Marianez\" v Puerto de la Cruz / Orotava leží plážový hotel H10 Tenerife Playa. Do turistického centra se dostanete po cca 1 km. Město Puerto De La Cruz je vzdáleno asi 1 m (La Orotava asi 10 km, Santa Cruz de Tenerife asi 35 km). Nákupní možnosti jsou vzdálené cca 2 km od Vašeho ubytování. Do nejbližších barů a restaurací se dostanete po cca 150 m. Nejbližší diskotéka se nachází ve vzdálenosti cca 1 km. Z hotelu se můžete dostat k následujícím turistickým zajímavostem: Lago Marianez (cca 50 m) a Teide (cca 42 km). O Vaši mobilitu se během dovolené postarají stanoviště taxi (cca 500 m) a také autobusová zastávka (cca 2 km). Lékařskou pomoc najdete v případě potřeby v nemocnici, která se nachází ve vzdálenosti cca 1 km od hotelu. Letiště Tenerife Jih leží ve vzdálenosti cca 92 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento 10podlažní hotel má 324 pokojů. K vybavení hotelu patří recepce otevřená 24 hodin denně (přihlášení je možné od 14:00 hodin, odhlášení do 12:00 hodin), lobby, 3 výtahy, klimatizace, sejf (za poplatek), kadeřnictví, malý obchod, další obchody a diskotéka. O blaho hostů se stará restaurace (klimatizovaná) a snack bar. Wi-Fi je hotelovým hostům k dispozici zdarma. Dále má hotel konferenční prostor. Úklid pokojů je zdarma. Služba praní prádla je za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří 2 bazény se sladkou vodou a samostatný dětský bazének. Zde jsou k dispozici lehátka a slunečníky (zdarma). Osvěžující nápoje je možno dostat přímo v baru u bazénu. "}, {"code": null, "title": "Stravování:", "text": "Snídaně formou bufetu. Polopenze. All inclusive. "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: šipky (případně za poplatek), kulečník (případně za poplatek), aerobik, plážový volejbal a stolní tenis (případně za poplatek). Nabídka wellness: sauna a masáže za poplatek. Solárium případně za poplatek. Hlídání dětí: miniklub a babysitting (za poplatek). "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina. Kreditní karty: Euro/MasterCard. "}, {"code": null, "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj s výhledem na moře</strong>\r\n<li>Vybavení: manželská postel nebo dvě samostatné postele, vana, fén, minibar, TV s mezinárodními kanály, WiFi, klimatizace, trezor, psací stůl, láhev vody na osobu při příjezdu\r\n"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Tenerife", "url": "https://www.eximtours.cz/spanelsko/tenerife"}, {"name": "Puerto de la Cruz", "url": "https://www.eximtours.cz/spanelsko/tenerife/puerto-de-la-cruz"}]}}</script></div></html>
