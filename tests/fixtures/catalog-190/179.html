<html><h1>Sitia Beach Resort and Spa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 144122, "name": "Sitia Beach Resort and Spa", "description": [{"code": null, "title": "Obecný popis:", "text": "Asi 50 m od volně přístupné písečné pláže v Sitia se nachází plážový hotel Sitia Beach Resort and Spa. Na pláži si hosté mohou zapůjčit lehátka a slunečníky (zdarma). Do turistického centra se dostanete pouze po cca 100 m. Město Heraklion je vzdáleno asi 120 km (Ag Nikolaos asi 60 km, Sitia asi 500 m). O Vaši mobilitu se během dovolené postarají stanoviště taxi (přímo u hotelu) a také autobusová zastávka (cca 300 m). Lékařskou pomoc najdete v případě potřeby v nemocnici, která se nachází ve vzdálenosti cca 2 km od hotelu. Letiště Chania je ve vzdálenosti cca 275 km. Další letiště Heraklion leží ve vzdálenosti cca 127 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento 4podlažní hotel má 162 pokojů. V hotelu se nachází recepce (přihlášení je možné od 14:00 hodin, odhlášení do 11:00 hodin), lobby s barem, 2 výtahy, klimatizace, obchod a parkoviště (zdarma). O blaho hostů se stará restaurace (klimatizovaná) a snack bar. Wi-Fi je hotelovým hostům k dispozici zdarma. Dále má hotel konferenční prostor s celkem 250 sedadly a připojením k internetu. Pokojový servis, služba praní prádla a služba žehlení prádla jsou za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří 3 bazény a dětský bazének. Zde jsou k dispozici lehátka a slunečníky (zdarma). V baru u bazénu jsou k dostání osvěžující nápoje. "}, {"code": null, "title": "Stravování:", "text": "Snídaně (07:00 - 10:30 hod.) formou bufetu. Polopenze: včetně snídaně a večeře. All inclusive: Nealkoholické nápoje (10:00 - 23:00 hod.), pivo (10:00 - 23:00 hod.), víno (10:00 - 23:00 hod.), káva a čaj (10:00 - 23:00 hod.) a národní alkoholické nápoje (10:00 - 23:00 hod.). "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: fotbal, volejbal, aerobik, basketbal a tenis (zdarma, přímo u hotelu). V bezprostřední blízkosti hotelu jsou nabízeny vodní sporty (částečně od místních poskytovatelů). Nabídka wellness: lázeňská oblast, sauna, parní lázeň, hamam a masáže případně za poplatek. Hřiště. Hlídání dětí: animační program pro děti a miniklub pro děti od 4 - 12 let. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina, němčina a francouzština. "}, {"code": null, "title": "Standard Pokoj Pro Rodinu:", "text": "Pokoje jsou vybavené dvěma samostatnými lůžky nebo jedním lůžkem, přistýlkou, dětskou postýlkou (zdarma), balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. "}, {"code": null, "title": "Double Standard Pokoj:", "text": "Pokoje jsou vybavené dvěma samostatnými lůžky nebo jedním lůžkem, přistýlkou, dětskou postýlkou (zdarma), balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. Velikost: cca 24 m². Za příplatek je možný výhled na moře."}, {"code": null, "title": "Standard Pokoj (Propagace):", "text": "Pokoje jsou vybavené dvěmi samostatnými lůžky nebo jedním lůžkem, dětskou postýlkou (zdarma), kachličkami, balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. Velikost: cca 24 m². "}, {"code": null, "title": "Double Standard Pokoj (Výhled na moře):", "text": "Pokoje jsou vybavené dvěmi samostatnými lůžky nebo jedním lůžkem, přistýlkou, dětskou postýlkou (zdarma), kachličkami, balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. Velikost: cca 24 m². "}, {"code": null, "title": "Postel pro 1 osobu Standard Pokoj:", "text": "Pokoje jsou vybavené dvěmi samostatnými lůžky nebo jedním lůžkem, dětskou postýlkou (zdarma), kachličkami, balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. Velikost: cca 24 m². "}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Sitia", "url": "https://www.eximtours.cz/recko/kreta/sitia"}]}}</script></div></html>
