<html><h1>Sol Katmandu Park and Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 141395, "name": "Sol Katmandu Park and Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotel Sol Katmandu Park, patřící do známého řetězce Sol Mélia, se nachází v oblasti Magaluf, nedaleko od dlouhé písčité pláže. Svou polohou v blízkosti centra a zábavy je ideální jak pro trávení dovolené na pláži, tak i pro aktivní odpočinek. Hotel je skvělou volbou hlavně pro rodiny s dětmi, pro které je k dispozici dětský aquapark se širokou nabídkou doplňkových programů a animací. Klienti hotelu mají vstupné zdarma. V blízkosti hotelu se také nachází golfové hřiště a půjčovna kol.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 250 m</li><li>letiště: 25 km Palma de Mallorca</li><li>centra: 0.3 km</li><li>nákupních možností: v centru</li></ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>404 pokojů</li>\r\n<li>10 pater, výtahy</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>restaurace</li>\r\n<li>lobby bar</li>\r\n<li>snack bar u bazénu</li>\r\n<li>Wi-Fi zdarma</li>\r\n<li>bazén</li>\r\n<li>lehátka a slunečníky u bazénu zdarma</li>\r\n<li>osušky oproti depozitu</li>\r\n<li>dětský bazén</li>\r\n<li>miniklub</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV/sat.</li>\r\n<li>minibar (za poplatek)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>trezor (zdarma)</li>\r\n<li>balkon</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhledem moře</strong>: balkon s výhledem na moře.</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior</strong>: renovovaný.</li>\r\n<li><strong>Rodinný pokoj</strong>: prostornější, rozkládací pohovka.</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice</strong>: 2 propojené Dvoulůžkové pokoje.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>široká písčitá</li>\r\n<li>pozvolný vstup do moře</li>\r\n<li>lehátka a slunečníky za poplatek</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": " <ul><li>animační programy</li><li>večerní programy</li><li>zábavní park Katmandu™ (vstup do parku do 18.00 a po dobu pobytu pro hosty hotelu zdarma)</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>golf (3 km)</li>\r\n<li>půjčovna kol (v blízkosti hotelu)</li>\r\n<li>vodní sporty na pláži</li>\r\n<li>tenis (v blízkosti hotelu)</li>\r\n</ul>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<strong>All Inlusive</strong><br />\r\n<ul>\r\n<li>snídaně, oběd a večeře formou bufetu</li>\r\n<li>11.00–13.00, 15.00–18.30 hod. lehký snack</li>\r\n<li>21.30–23.00 hod. večerní snack&nbsp;</li>\r\n<li>10.00–24.00 hod. vybrané nealkoholické nápoje, zmrzlina&nbsp;</li>\r\n<li>vybrané alkoholické nápoje k hlavnímu jídlu (max. 3 nápoje během oběda nebo večeře)</li>\r\n<li class=\"f_list-item\">all Inclusive je čerpán v místech a časech určených hotelem, právo na změnu vyhrazeno</li>\r\n</ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<ul>\r\n<li>na vyžádání pokoje přizpůsobené pro handicapované klienty</li>\r\n<li>bezbariérový pohyb v areálu hotelu</li>\r\n<li>křeslo do bazénu</li>\r\n</ul>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<ul>\r\n<li>VISA</li>\r\n<li>EC/MC</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "www.melia.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Magalluf", "url": "https://www.eximtours.cz/spanelsko/mallorca/magalluf"}]}}</script></div></html>
