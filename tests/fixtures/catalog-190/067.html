<html><h1>Cactus Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 103248, "name": "Cactus Beach", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V centru letoviska Stalida, cca 35 km od Heraklionu. Nákupní možnosti, bary, kavárny, diskotéky, taverny, restaurace i možnosti zábavy v bezprostřední blízkosti ubytování.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, směnárna, lobby bar, restaurace, 2 restaurace a la carte (řecká, italská), minimarket, konferenční sál. V zahradě 3 bazény, bazén s tobogány, splash park pro menší děti, snack bar u bazénu a terasa s lehátky a slunečníky zdarma, osušky oproti kauci 10 EUR (každá výměna za poplatek 1 EUR).</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., telefon, mini lednice )1x lahev vody po příletu), trezor za poplatek (cca 3 EUR/den), balkon nebo terasa.&nbsp;<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Třílůžkový pokoj:&nbsp;</strong>prostornější</li>\r\n<li><strong>Rodinný pokoj, 1 ložnice</strong>: jedna prostorná místnost</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice</strong>: dvě ložnice oddělené dveřmi</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s pozvolným vstupem do moře (vstup do moře místy kamenitý) přes místní komunikaci/promenádu. Bar na pláži (zahrnut do All Inclusive). Lehátka a slunečníky za poplatek (cca 15 EUR/set). Další dlouhé písečné pláže v blízkosti.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All Inclusive:</strong></p>\r\n<ul>\r\n<li>Hlavní restaurace: 7.00-10.00 snídaně, 12.00-14.00 oběd a 18.00-21.00 večeře fromou bufetu. U snídaně nealkoholické nápoje, káva, čaj, u oběda a večeře nealkoholické nápoje, pivo víno.</li>\r\n<li>A´la carte \"Pizzeria Paradise\": 18.30-21.00 večeře, servírovaná (1x za pobyt po předchozí rezervaci).</li>\r\n<li>A´la carte taverna \"Greek Paradise\": 18.30.-21.00 večeře, servírovaná (1x za pobyt po předchozí rezervaci).</li>\r\n<li>Hlavní bar: 18.00-23.00 nealkoholické a alkoholické nápoje (vše místní výroby, rozlévané), pivo, víno, káva, čaj</li>\r\n<li>Bary u bazénu \"Dolphin\" a \"Lagoon\": 10.00-18.00 nealkoholické a alkoholické nápoje (vše místní výroby, rozlévané), pivo, víno, káva, čaj, 10.00-17.00 lehké občerstvení, 15.00-16.00 zákusky, zmrzlina</li>\r\n<li>Bar u bazénu \"Medousa\": 10.00-23.00 nealkoholické a alkoholické nápoje (vše místní výroby, rozlévané), pivo, víno, káva, čaj, 10.00-17.00 lehké občerstvení, 15.00-16.00 zákusky, zmrzlina</li>\r\n<li>Bar u pláže: 10.00-17.00 10.00-18.00 nealkoholické a alkoholické nápoje (vše místní výroby, rozlévané), pivo, víno, káva, čaj, 10.00-17.00 lehké občerstvení, 15.00-16.00 zákusky, zmrzlina</li>\r\n</ul>\r\n<strong>Upozornění:</strong>&nbsp;U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> stolní tenis, plážový volejbal, šipky aj. v rámci animace.<br /><strong>Za poplatek:</strong> minigolf (v sesterském hotelu), vodní sporty na pláži. Možnost využití Spa centra v sesterském hotelu Cactus Royal."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Animační programy, večerní zábavné show v amfiteátru.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Bazén se skluzavkami, splash park, brouzdaliště, hřiště, miniklub, mini disco, dětská postýlka zdarma.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v celém areálu hotelu."}, {"code": "WEB", "title": "Web", "text": "https://www.cactusbeach.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "tex
