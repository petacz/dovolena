<html><h1>Eurovillage Achilleas</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 86556, "name": "Eurovillage Achilleas", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotelový komplex v krásné udržované zahradě přímo u dlouhé písečné pláže, 1,5 km od centra letoviska Mastichari s tavernami a obchůdky. Hlavní město Kos 21 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, restaurace, TV místnost, minimarket naproti u hotelu, amfiteátr. Venku 1 velký bazén (820m2) a dětský bazén (59m2), terasa s lehátky a slunečníky zdarma, osušky zdarma, bary u bazénu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj:</strong> koupelna/WC (vysoušeč vlasů), klimatizace, telefon, TV/sat., minilednička, trezor za poplatek, terasa.<br /><br />\r\n<p><strong>Ostatní typy pokojů (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</strong></p>\r\n<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled na moře:</strong>&nbsp; výhled na moře.</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior:</strong> renovované.</li>\r\n<li><strong>Rodinný pokoj:</strong>&nbsp; 2 místnosti oddělené dveřmi.</li>\r\n<li><strong>Windmill dům:</strong> koupelna a obývací pokoj v přízemí, ložnice v patře, 2× TV/Sat, 2× klimatizace, set na přípravu kávy a čaje. Ubytování v atypických domech ve tvaru \"větrného mlýnu\".</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž přímo u hotelu. Lehátka, slunečníky a osušky zdarma.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>All inclusive<br /><br /></p>\r\n<ul>\r\n<li>Snídaně formou bufetu (07.30–09.30 hod.)</li>\r\n<li>Oběd formou bufetu (12.30–14.00 hod.)</li>\r\n<li>Večeře formou bufetu (19.00–21.30 hod.)</li>\r\n<li>Tematické večeře (18.30–21.30 hod., nutná rezervace)</li>\r\n<li>Zmrzlina (10.00–18.00 hod.)</li>\r\n<li>Teplý a studený snack – pizza, sendviče atd. (10.00–18.00 hod.)</li>\r\n<li>Odpolední káva a čaj</li>\r\n<li>Bar na pláži (červen–září, 10.00–18.00 hod.)</li>\r\n<li>Nealkoholické a alkoholické nápoje (10.00–23.00 hod.)</li>\r\n<li>neomezený vstup do vodního parku Lido, včetně hotelové autobusové přepravy (pobyty 1.6.-30.9.2027, termín se může lišit v závislosti na aktuální otevírací době)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma:</strong> fitness, stolní tenis, tenis, minigolf, hřiště na plážový volejbal, šipky.</li>\r\n<li><strong>Za poplatek:</strong> půjčovna kol.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Animační programy, discoklub (pouze v hlavní sezoně).</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>2 dětské bazény, hřiště, animace, miniklub (4–11 let), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi v lobby a u bazénu.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://www.eurovillageachilleashotel.com"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 kategorie</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu.&nbsp;</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kos", "url": "https://www.eximtours.cz/recko/kos"}, {"name": "Mastichari", "url": "https://www.eximtours.cz/recko/kos/mastichari"}]}}</script></div></html>
