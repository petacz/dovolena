<html><h1>Caravia Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2548, "name": "Caravia Beach", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Velmi příjemný hotel, který tvoří hlavní budova, bungalovy a nová depandance jen pro dospělé, leží na klidném místě v nádherné vzrostlé zahradě, u krásné písčité pláže s pozvolným vstupem do moře. Okolí hotelu láká k příjemným večerním procházkám, například do turistického centra Marmari, které je od hotelu vzdáleno necelých 600 metrů. Město Kos je vzdáleno 13 kilometrů. Moderně zařízený hotel svými vynikajícími službami uspokojí i náročnější klientelu. Doporučujeme jej všem, kteří chtějí prožít klidnou dovolenou v příjemném prostředí i rodinám s dětmi.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 0 m u pláže</li><li>letiště: 12 km Kos</li><li>centra: 0.6 km (Marmari), 13 km (hlavní město Kos)</li><li>nákupních možností: 600 m</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace (zdarma)</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>lednička (zdarma)</li>\r\n<li>koupelna se sprchou/WC (vysoušeč vlasů)</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>telefon (za poplatek)</li>\r\n<li>francouzské okno</li>\r\n<li>dětská postýlka na vyžádání (zdarma)</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Bungalov</strong> – obývací pokoj a ložnice (odděleno posuvnými dveřmi), balkon nebo terasa</li>\r\n<li><strong>Junior suite:</strong> část jen pro dospělé, v 1.patře, balkon, sdílený bazén.</li>\r\n<li><strong>Junior suite se sdíleným bazénem</strong>: část jen pro dospělé, sdílený bazén, v přízemí, terasa.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis
