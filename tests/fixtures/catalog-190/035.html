<html><h1>Civitel Creta Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 9073, "name": "Civitel Creta Beach", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Civitel Creta Beach Hotel se nachází na ideálním místě, přímo u krásné písčité pláže v oblasti Ammoudara. Komplex připomíná exotickou zahradu s palmami, nabízí elegantní kamenné bungalovy, prostorné pokoje a velký venkovní plavecký bazén se slanou vodou. Tento hotel je vhodný pro každého, kdo si chce užít klidnou a odpočinkovou dovolenou.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 0 m u pláže</li><li>letiště: 11 km Heraklion</li><li>centra: 5 km Heraklion </li><li>nákupních možností: 0 m v okolí hotelu</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Economy, Výhled zahrada:</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednice (1× láhev vody po příletu)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n<li>v hlavní budově</li>\r\n<li>Economy pokoj - pouze omezené množství pokojů</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Dvoulůžkový pokoj, Výled zahrada:</strong> umístěn v hlavní budově</li>\r\n<li><strong>Dvoulůžkový pokoj, Water Front:</strong> pokoje blíže k moři</li>\r\n<li><strong>Bungalov, Výhled zahrada</strong>&nbsp;</li>\r\n<li><strong>Bungalov, Premium, Výhled zahrada:</strong>&nbsp;zrekonstruované pokoje</li>\r\n<li><strong>Bungalov, Premium, Water Front:</strong>&nbsp;zrekonstruované pokoje, v první řadě u moře</li>\r\n<li><strong>Bungalov, Superior, Výhled zahrada:
