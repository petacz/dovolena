<html><h1>Almyros Beach Resort & SPA</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 827, "name": "Almyros Beach Resort & SPA", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Moderní hotelový areál v klidné části letoviska Almyros, nedaleko městečka Acharavi. Nejbližší nákupní možnosti, restaurace, kavárny a bary vzdáleny cca 2 km od hotelu v centru letoviska Acharavi. Vzdálenost hotelu od letiště Korfu je cca 40 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Hotelový komplex v udržované zahradě, kompletně bezbariérový, celkem 180 pokojů, vstupní hala s recepcí, restaurace, lobby bar, střešní bar, fitness, SPA, minimarket, obchod se suvenýry. V areálu hotelu bazén, dětský bazén, bar u bazénu, menší aquapark se skluzavkami (zdarma pro klienty s all inclusive). Lehátka a slunečníky v areálu hotelu zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Deluxe</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, telefon, TV/sat., rychlovarná konvice, minibar, wifi, trezor, balkon nebo terasa, 28 m2.<br /><br /><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Junior Suita</strong>: prostornější, opticky rozdělený prostor, 36 m2.</li>\r\n<li><strong>Rodinný pokoj</strong>: 2 oddělené místnosti, 31 m2.</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Pro samostatné použití:</strong> pro jednu osobu, na vyžádání.</li>\r\n<li><strong>Dvoulůžkový pokoj, Twin</strong>: pouze pro handicapované klienty, 31 m2, na vyžádání.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>U hotelu písečnooblázková pláž s pozvolným vstupem do moře, oddělená pouze místní komunikací, sprchy k dispozici, osušky zdarma. Lehátka a slunečníky zdarma pro hosty s all inclusive, pro ostatní klienty za poplatek.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong><strong>Snídaně<br /></strong></strong>\r\n<ul>\r\n<li>snídaně formou bufetu v hlavní restauraci Helios</li>\r\n<li>nealkoholické nápoje, káva, čaj během snídaně k dispozici</li>\r\n</ul>\r\n<strong><strong>Polopenze<br /></strong></strong>\r\n<ul>\r\n<li>snídaně a večeře formou bufetu v hlavní restauraci Helios (možnost výběru mezi obědem/večeří)</li>\r\n<li>nealkoholické nápoje, káva, čaj k dispozici pouze během snídaně&nbsp;</li>\r\n</ul>\r\n<strong>All inclusive</strong><br />\r\n<ul>\r\n<li class=\"f_list-item\">Snídaně, oběd a večeře formou bufetu v hlavní restauraci Helios.</li>\r\n<li class=\"f_list-item\">Studený i teplý snack během dne v baru u bazénu a v lobby baru (10:30-12:00, 16:00-18:00 hod.)</li>\r\n<li class=\"f_list-item\">Alkoholické a nealkoholické nápoje místní i mezinárodní výroby v lobby baru (7:00-23:00 hod.) a baru u bazénu (9:00-23.00 hod.)</li>\r\n<li class=\"f_list-item\">1x za pobyt (min. 7 nocí) nárok na večeři v ála carte restauraci Ambrosia.</li>\r\n<li>Střešní bar Nectar za poplatek (18:00-01:00 hod.)</li>\r\n<li class=\"f_list-item\">Upozornění: výše uvedené časy jsou stanovené hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> plážový volejbal, šipky, fotbal, stolní tenis, tenis, basketbal, fitness, aquagym.<br /><strong>Za poplatek:</strong> masáže a kulečník, jízda na koni, potápění."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní a večerní animační program (zumba, aquaerobic, volejbal, večer karaoke, tématické a herní večery, noční show).</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, dětské hřiště, hotelový miniklub, menší aquapark (pro děti s all inclusive zdarma, ostatní za poplatek, vstup je umožněn dětem bez věkového omezení, ale v doprovodu rodičů), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>Zdarma: </strong>hammam, sauna, fitness (9:00-18:00 hod.)<br /><strong>Za poplatek:</strong> masáže, kosmetika a kadeřnictví (10:00-17:00 hod.)"}, {"code": "NOTE", "title": "Pro handicapované", "text": "Na vyžádání několik pokojů pro handicapované, bezbariérový pohyb po areálu.&nbsp;"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "Hotel umožňuje pobyt psů do 8kg (za poplatek, na vyžádání)."}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma</strong>: WiFi ve veřejných prostorách hotelu.</p>"}, {"code": "WEB", "title": "Web", "text": "https://almyrosbeach.com/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.<br /><br /><strong>Doporučujeme včasnou rezervaci, hotel bývá brzy vyprodán.</strong></p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Korfu", "url": "https://www.eximtours.cz/recko/korfu"}]}}</script></div></html>
