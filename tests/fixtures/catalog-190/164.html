<html><h1>Annabelle Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 9059, "name": "Annabelle Beach Resort", "description": [{"code": null, "title": "Poloha", "text": "<p>Hotelový komplex cca 22 km od letiště Heraklion, cca 2 km od centra Chersonissos. Hotel nedoporučujeme klientům s pohybovými obtížemi.&nbsp;</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Hlavní budova a komplex bungalovů, vstupní hala s recepcí, lobby bar, restaurace, TV místnost, konferenční místnost, minimarket, kavárna. Venku 2 bazény se sladkou vodou, bazén pro děti, bar u bazénu, lehátka a slunečníky zdarma, osušky oproti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Economy</strong>: koupelna/WC (vysoušeč vlasů) lednička, trezor, TV/sat., telefon, klimatizace, pokoje umístěné v bungalovech<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj:</strong> terasa nebo balkon,&nbsp;pokoje umístěné v bungalovech</li>\r\n<li><strong>Třílůžkový pokoj, Bungalov:</strong> terasa nebo balkon,&nbsp;pokoje umístěné v bungalovech</li>\r\n<li><strong>Jednolůžkový pokoj:&nbsp;</strong>pokoje umístěné v bungalovech</li>\r\n<li><strong>Rodinný pokoj:</strong> dvě místnosti oddělené dveřmi,&nbsp;pokoje umístěné v bungalovech</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Písečná pláž přímo u hotelu (pro vstup do moře doporučujeme obuv), lehátka a slunečníky zdarma.</p>"}, {"code": null, "title": "Stravování", "text": "<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace: 7.15–10.00 snídaně formou bufetu, 12.30–14.00 oběd formou bufetu, 18.30–21.30 večeře formou bufetu. U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje, pivo, víno</li>\r\n<li>Hlavní bar: 18.00–1.30 (All Inclusive pouze do 24.00), nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj</li>\r\n<li>Bar u bazénu: 10.00–18.00, nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj</li>\r\n<li>Bar na pláži: 10.00–1.30 (All Inclusive pouze do 24.00), nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj</li>\r\n<li>Taverna: 10.00–18.00 nealkoholické nápoje, džus, filtrovaná káva, řecká káva, čaj, pivo, víno, 11.00–18.00 lehké občerstvení, zmrzlina, 16.00–17.00 odpolední káva, zákusky, 19.30–21.15 večeře (servírované menu, nápoje za poplatek), výběr ze tří menu (řecké, italské, středomořské), 1× za pobyt po předchozí rezervaci</li>\r\n</ul>\r\n<strong>Upozornění:</strong> U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": null, "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> fitnes, stolní tenis, tenis.<br /><strong>Za poplatek:</strong> vodní sporty na pláži."}, {"code": null, "title": "Zábava", "text": "<p>Lehké animační denní a večerní programy pro děti a dospělé.</p>"}, {"code": null, "title": "Děti", "text": "<p>Dětský bazén, miniklub, dětská postýlka zdarma.</p>"}, {"code": null, "title": "Wellness", "text": "<p><strong>Za poplatek: </strong>různé druhy masáží, kosmetické balíčky, sauna, jacuzzi.</p>"}, {"code": null, "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v celém areálu hotelu."}, {"code": null, "title": "Web", "text": "https://www.annabellebeachresort.gr"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Chania je vzdáleno 170 km od hotelu."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Anissaras", "url": "https://www.eximtours.cz/recko/kreta/anissaras"}]}}</script></div></html>
