poje (vše rozlévané, místní výroby), pivo, víno, káva, čaj, zmrzlina</li>\r\n<li>Bar u bazénu \"Jasmine\": 10.00-22.00 nealkoholické a alkoholické nápoje (vše rozlévané, místní výroby), pivo, víno, káva, čaj, zmrzlina, během dne lehké občerstvení</li>\r\n</ul>\r\n<strong>Upozornění:</strong>&nbsp;Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Za poplatek: </strong>půjčovna kol"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "Animační a večerní porgramy."}, {"code": "CHILDRENS", "title": "Děti", "text": "Dětská postýlka (zdarma), dětský bazén, venkovní a vnitřní dětské hřiště."}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma:</strong> Wi-Fi v celém areálu hotelu.</p>"}, {"code": "WEB", "title": "Web", "text": "<p>https://ibiscos.gr/home.html</p>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Rethymno", "url": "https://www.eximtours.cz/recko/kreta/rethymno"}]}}</script></div></html>
