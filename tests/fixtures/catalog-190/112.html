<html><h1>Alua Suites Fuerteventura (Ex Suite Atlantis Fuerteventura)</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1584, "name": "Alua Suites Fuerteventura (Ex Suite Atlantis Fuerteventura)", "description": [{"code": null, "title": "Obecný popis:", "text": "Plážový hotel v 2. řadě Alua Suites Fuerteventura (Ex Suite Atlantis Fuerteventura) se těší oblibě hlavně u novomanželů na svatební cestě a leží v blízkosti veřejné písečné pláže \"Corralejo\", ke které je zajištěna kyvadlová doprava zdarma. Na pláži jsou k dispozici slunečníky a lehátka (za poplatek). Nejbližší město je Corralejo. V okolí hotelu se nabízejí nejrůznější nákupní možnosti a také je zde supermarket. V blízkosti hotelu se nachází diskotéka. Z hotelu se můžete dostat k následujícím turistickým zajímavostem: Parque Natural de las Dunas de Corralejo a Acua Water Park. O Vaši mobilitu se postará půjčovna aut a motocyklů, stanoviště taxi a také autobusová zastávka. Letiště Fuerteventura je vzdáleno cca 37,5 km od hotelu."}, {"code": null, "title": "Vybavení:", "text": "Tento 2podlažní hotel, naposledy zrenovovaný v roce 2018, má 383 pokojů, které se nacházejí v hlavní budově a v 22 vedlejších budovách. K vybavení hotelu patří lobby s barem, klimatizace, sejf (za poplatek), kiosek, malý obchod, další obchody, diskotéka, parkoviště (zdarma) a směnárna. O blaho hostů se stará 5 restaurací (klimatizovaných) a snack bar. V celkem 3 barech si můžete večer užít příjemné posezení. Wi-Fi je hotelovým hostům k dispozici zdarma. Pohybově omezeným hostům nabízí ubytování částečně bezbariérové koupelny a bezbariérový vstup. Služba praní prádla a služba žehlení prádla jsou za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří 8 bazénů se sladkou vodou a samostatný dětský bazének. Zde jsou k dispozici lehátka a slunečníky (zdarma). Bar u bazénu nabízí hostům osvěžující nápoje. "}, {"code": null, "title": "Stravování:", "text": "Snídaně (07:30 - 10:30 hod.) formou bufetu. All inclusive: snídaně, obědy a večeře. Snídaně, obědy a večeře pouze ve vybraných restauracích. Dezerty & pečivo (16:00 - 17:00 hod.) a internet zdarma. Dřívější přihlášení a pozdější odhlášení je možné (dle vytížení/ dispozice). "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: šipky (zdarma), stolní tenis (zdarma), fotbal, tenis (za poplatek), plážový volejbal, basketbal, kulečník (za poplatek), aerobik a fitness. Golfové hřiště leží v okolí hotelu. Půjčovna kol a organizované výlety na kolech (za poplatek). Nabídka wellness: sauna a solárium zdarma. Masáže za poplatek. Zábava pro dospělé: animační program s večerní show a živou hudbou. Děti najdou ve venkovních prostorách hřiště. Hlídání dětí: animační program pro děti od 4 - 12 let, miniklub pro děti od 4 - 6 let a babysitting (za poplatek). Herna. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina. Kreditní karty: American Express. "}, {"code": null, "title": "Premium JuniorSuite:", "text": "Pokoje jsou vybavené rozkládací pohovkou, vytápěním (centrálním), varnou konvicí (zdarma), minibarem (případně za poplatek), balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. Koupelna se sprchou. "}, {"code": null, "title": "Standard JuniorSuite:", "text": "Pokoje jsou vybavené rozkládací pohovkou, dětskou postýlkou (zdarma), vytápěním (centrálním), varnou konvicí (zdarma), balkónem nebo terasou, internetem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. "}, {"code": null, "title": "Standard Suite:", "text": "Pokoje jsou vybavené rozkládací pohovkou, vytápěním (centrálním) a internetem (zdarma) a také individuálně regulovatelnou klimatizací. "}, {"code": null, "title": "2 ložnice Standard Suite:", "text": "Pokoje jsou vybavené rozkládací pohovkou, dětskou postýlkou (zdarma), vytápěním (centrálním), varnou konvicí (zdarma), balkónem nebo terasou, internetem (zdarma), sejfem (za poplatek) a satelit.TV a také individuálně regulovatelnou klimatizací. "}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Fuerteventura", "url": "https://www.eximtours.cz/spanelsko/fuerteventura"}, {"name": "Corralejo", "url": "https://www.eximtours.cz/spanelsko/fuerteventura/corralejo"}]}}</script></div></html>
