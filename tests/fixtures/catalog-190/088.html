<html><h1>Caldera Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 146103, "name": "Caldera Beach", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Hotel Caldera Beach se nachází v západní části Kréty, cca 1,5 km od centra letoviska Platanias. Nabízí ubytování ve studiích a apartmánech, které nabízejí dostatek prostoru i pro větší rodiny a v každém pokoji je kuchyňka. Hotel je tak ideální jako výchozí bod pro výlety za poznáním západní části ostrova. Nejbližší bary, restaurace a obchody naleznete cca 1 km od hotelu, město Chania je vzdáleno 14 km. Hotel doporučujeme všem věkovým kategoriím a rodinám s dětmi."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m u pláže</li>\r\n<li>letiště: 32 km Chania</li>\r\n<li>centra: 1,5 km</li>\r\n<li>nákupních možností: v hotelu / 1,5 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje:", "text": "<strong>Studio:</strong><br />\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (zdarma)</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>kuchyňka</li>\r\n<li>minilednička</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>telefon</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Apartmá, 1 ložnice: </strong>ložnice a obývací část oddělená dveřmi</li>\r\n<li><strong>Apartmá, 1 ložnice, Výhled na bazén: </strong>ložnice a obývací část oddělená dveřmi</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>bar u bazénu</li>\r\n<li>taverna</li>\r\n<li>a´la carte restaurace</li>\r\n<li>3 bazény se sladkou vodou (lehátka a slunečníky zdarma)</li>\r\n<li>vnitřní bazén</li>\r\n<li>dětský bazén</l
