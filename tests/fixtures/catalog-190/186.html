<html><h1>Pontiana Thalasso</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 245722, "name": "Pontiana Thalasso", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p data-start=\"83\" data-end=\"549\">Nově zrenovovaný hotel ve středomořském stylu, kde se moderní komfort snoubí s autentickou atmosférou. Užijte si jedinečné thalasso centrum s vnitřními i venkovními prostory, zábavný vodní svět pro děti, teenagery i dospělé a nechte se hýčkat chutěmi španělské kuchyně připravované z čerstvých bio surovin. Pro náročnější hosty jsou k dispozici pokoje Premium s nadstandardními službami v rámci Magic World Resortu.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>moře: 150 m</li>\r\n<li>pláže: 300 m</li>\r\n<li>letiště Castellon: 30 km</li>\r\n<li>zastávky vlaku: 3 km&nbsp;</li>\r\n<li>centra: 3 km Oropesa del Mar</li>\r\n<li>nákupní možnosti: 50 m</li>\r\n<li>restaurace a bary: 50 m</li>\r\n<li>nákupní centrum: 600 m</li>\r\n<li>aquaparku Polinesia: 650 m</li>\r\n<li>zábavního parku Magic DinoLand: 1 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>koupelna/WC (sprcha, vysoušeč vlasů)</li>\r\n<li>2 lůžka široká 105 cm nebo 135 cm v závislosti na obsazenosti pokoje; přistýlka není možná</li>\r\n<li>TV/sat.</li>\r\n<li>minilednička</li>\r\n<li>set na přípravu kávy nebo čaje</li>\r\n<li>trezor za poplatek</li>\r\n<li>balkon</li>\r\n<li>dětská postýlka za poplatek (na vyžádání)</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:</strong>&nbsp;balkon s výhledem na moře</li>\r\n<li><strong>Junior Suite, 1 ložnice: </strong>sprcha i vana, oddělená ložnice, 40 m2, 2 lůžka široká 105 cm, obývací část s pohovkou (1 lůžko); přistýlka není možná</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>renovovaný 2025</li>\r\n<li>192 pokojů</li>\r\n<li>12 pater (výtahy)</li>\r\n<li>vstupní hala s&nbsp;recepcí</li>\r\n<li>restaurace</li>\r\n<li>bar</li>\r\n<li>osušky zdarma, oproti kauci</li>\r\n<li>volný vstup do aquaparku Magic Splash Adventure (cca 100 m)\r\n<ul>\r\n<li>2 bazény</li>\r\n<li>dětský splash</li>\r\n<li>skluzavky a tobogány</li>\r\n<li>bar u bazénu</li>\r\n<li>snack bar</li>\r\n<li>slunečníky a lehátka zdarma</li>\r\n<li>některé atrakce jsou omezeny věkem, výškou a váhou</li>\r\n</ul>\r\n</li>\r\n<li>parkoviště za poplatek</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písečná</li>\r\n<li>pozvolný vstup do moře</li>\r\n<li>při vstupu do moře místy malé oblázky</li>\r\n<li>slunečníky a lehátka za poplatek</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně formou bufetu (08.00–10.30 hod.)</li>\r\n<li>Oběd formou bufetu (13.00–15.30 hod.)</li>\r\n<li>Večeře formou bufetu (20.00–22.30 hod.)</li>\r\n<li>Lehký snack (10.30–12.30 hod. a 15.30–19.00 hod.)</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje včetně prémiových značek v hotelovém baru (10.00–00.00 hod.)</li>\r\n<li>Minibar naplněný na uvítanou</li>\r\n<li>All Inclusive lze čerpat pouze v časech a místech určených hotelem, hotel si vyhrazuje právo na změny</li>\r\n</ul>\r\n<p><strong>Ultra All Inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně formou bufetu (08.00–10.30 hod.)</li>\r\n<li>Oběd formou bufetu (13.00–15.30 hod.)</li>\r\n<li>Večeře formou bufetu (20.00–22.30 hod.)</li>\r\n<li>Lehký snack (10.30–12.30 hod. a 15.30–19.00 hod.)&nbsp; &nbsp;&nbsp;</li>\r\n<li>Možnost výměny hlavního jídla v bufetové restauraci za jídlo v tematické restauraci (vybrané menu, nutná rezervace předem)\r\n<ul>\r\n<li>pobyty min. 4 noci max. 1 výměna</li>\r\n<li>pobyty 5 a 6 nocí max. 2 výměny</li>\r\n<li>pobyty 7 a více nocí max. 4 výměny</li>\r\n</ul>\r\n</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje včetně prémiových značek (10.00–00.00 hod.) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje včetně prémiových značek v Aloha Beach baru (12.30–20.00 hod.)</li>\r\n<li>Minibar naplněný na uvítanou, denně doplňovány nealkoholické nápoje a pivo</li>\r\n<li>Vstup do tematických parků, nutná rezervace předem\r\n<ul>\r\n<li>pobyty min. 4 noci – Polynesia 2 vstupy, Magic Dinoland 2 vstupy, Magic Show 1 vstup, Pontiana Thalasso Centrum 1 vstup</li>\r\n<li>pobyty min. 7 nocí – Polynesia 5 vstupů, Magic Dinoland 5 vstupů, Magic Show 1 vstup, Pontiana Thalasso Centrum 2 vstupy, Dům pohádkových hrdinů 1 vstup, Kouzelná zahrada 1 vstup</li>\r\n</ul>\r\n</li>\r\n<li>Vstup do herní zóny Magic Play, 1 vstup = 45 minut, nutná rezervace předem, simulátory nejsou v ceně\r\n<ul>\r\n<li>pobyty 1 až 3 noci – 1 vstup</li>\r\n<li>pobyty 4 až 5 nocí – 2 vstupy</li>\r\n<li>pobyt 6 a více nocí – 3 vstupy</li>\r\n</ul>\r\n</li>\r\n<li>Možnost strávit den v jiném hotelu v rámci Magic World Resort (Magic Fantasy, Magic Games nebo Magic Sport), nutná rezervace předem dle dostupnosti; možnost volby mezi 11.00–17.00 hod. včetně oběda nebo 17.00–00.00 hod. včetně večeře\r\n<ul>\r\n<li>pobyty 1 až 3 noci – 1 návštěva</li>\r\n<li>pobyty 4 až 7 nocí – 2 návštěvy</li>\r\n<li>pobyty 8 a více nocí – 3 návštěvy</li>\r\n</ul>\r\n</li>\r\n<li>Ultra All Inclusive lze čerpat pouze v časech a místech určených hotelem, hotel si vyhrazuje právo na změny</li>\r\n</ul>\r\n<p><strong>Ultra All Inclusive Premium </strong>(klienti navíc čerpají služby PREMIUM)</p>\r\n<ul>\r\n<li>kávovar Nespresso na pokoji</li>\r\n<li>VIP recepce</li>\r\n<li>VIP oddělená část hlavní restaurace</li>\r\n<li>VIP oddělená část u bazénu</li>\r\n<li>přednostní fronta ve vybraných barech</li>\r\n<li>sleva ve wellness centru</li>\r\n</ul>\r\n<br />Na vyžádání možnost zajistit bezlepkovou a bezlaktózovou stravu."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>fitness</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<strong>Motion - dovolená v pohybu - český animační klub pro dospělé v termínu 22.6.2026 - 24.9.2026.</strong><br />\r\n<ul>\r\n<li>Hotelový animační program během dne v části Magic Splash Adventure.</li>\r\n<li>Hotelový pravidelný večerní animační program v části Magic Splash Adventure.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Tématické parky Magic World Resort", "text": "<p>Užijte si tématické parky Magic World, které nabízejí nepřeberné možnosti zábavy, vzrušení a dobrodružství. Vstup do parků může být zpoplatněn nebo omezen dle vybrané stravy a délky pobytu.</p>\r\n<p><strong>Vodní park Polinesia</strong></p>\r\nTropický ráj plný skluzavek, bazénů a vodních atrakcí v srdci Magic World Resortu. Nechte se přenést do atmosféry Polynésie – od adrenalinových tobogánů přes rodinné bazény, línou řeku až po splash zóny pro nejmenší. Některé atrakce mohou být omezené věkem, výškou nebo váhou.&nbsp;Aquapark je v provozu od 19.6. do 5.9.2026.<br />\r\n<ul>\r\n<li>Líná řeka s vlnami a proudy</li>\r\n<li>Rychlé tobogány pro adrenalinové závodníky</li>\r\n<li>Torbellino – tobogán, kde pocítíte odstředivou sílu</li>\r\n<li>Splash Zone a Froggy Pool – vodní hřiště s několika bazénky</li>\r\n<li>Canal Play – vodní dráha pro ty nejmenší</li>\r\n</ul>\r\n<p><strong>Kouzelná zahrada</strong></p>\r\n<p>Přeneste se do světa snů a vstupte do pohádkové zahrady plné fantazie. Objevte malé skřítky schovávající své poklady, víly tančící mezi okvětními lístky i moudré stromy, které dokážou promluvit. Čeká vás velkolepá show, kde se představí i kouzelný jednorožec Rouge, jeden z maskotů Magic World Resortu.&nbsp;</p>\r\n<p><strong>Magic Dinoland&nbsp;</strong></p>\r\n<div>\r\n<p>Zábavní park Magic Land se proměnil v Magic Dinoland s novou dinosauří tematikou. Čeká vás zábava i poznání v prostředí plném atrakcí inspirovaných světem dinosaurů. Park si zachovává svůj rodinný charakter a nabízí zóny pro děti, atrakce pro různé věkové kategorie, a vizuální&nbsp; i interaktivní zážitky ideální pro malé návštěvníky. Objevte<strong>&nbsp;</strong>svět dinosaurů pro celou rodinu a poznejte historii dinosaurů – tvorů, kteří obývali naši planetu před miliony let!</p>\r\n</div>\r\n<p><strong>Herní zóna Magic Play</strong></p>\r\n<p>Stiskněte Play a zábava může začít! Vstupte do světa her, moderních technologií a digitálních zážitků. Čekají na vás herní automaty plné videoher, virtuální realita, taneční souboje a adrenalinové závody. Ideální místo pro každého, kdo má rád interaktivní dobrodružství.</p>\r\n<ul>\r\n<li>Herní automaty – klasické i moderní videohry a závodní simulátory</li>\r\n<li>Virtuální realita – pohlcující zážitky a dobrodružné světy</li>\r\n<li>Taneční souboje – hudební a rytmické výzvy pro malé i velké</li>\r\n<li>Adrenalinové závody – soutěže, kde rychlost a reakce rozhodují</li>\r\n</ul>\r\n<p><strong>Dům pohádkových hrdinů</strong></p>\r\n<p>Vítejte v místě, kde ožívají pohádkové příběhy Magic World Resortu! Seznamte se s Malou mořskou vílou, Poseidonem, neohroženým kapitánem Hookem, kouzelným jednorožcem Rouge a mnoha dalšími kamarády, kteří vaše děti zavedou do světa fantazie a radosti.&nbsp;</p>\r\n<p><strong>Večeřní show Magic World</strong></p>\r\n<p>Užijte si večery plné zábavy pro celou rodinu a nenechte si ujít některé z jedinečných představení. Čekají vás kouzelnické show, dechberoucí akrobacie i muzikály, které vás vtáhnou do světa fantazie a emocí. Každé představení přináší nové zážitky, které okouzlí malé i velké diváky.</p>\r\n<p><strong>Pontiana Mediterraneo Thalasso</strong></p>\r\n<p>Zregenerujte své tělo i mysl a objevte kouzlo thalassa. Užívejte si blahodárné účinky mořské vody v relaxačním bazénu s množstvím zákoutí a masážních trysek, případně v některé z vyvýšených jacuzzi. V létě 2026 bude nově otevřena i zrekonstruovaná vnitřní část thalasso centra. Některé části jsou přístupné pouze pro dospělé.<br /><br />Některé tematické parky jsou otevřeny pouze během letní sezóny, a to od<strong> </strong>19. 6. do 5. 9. 2026; poté jsou uzavřeny nebo jsou v provozu pouze ve vybraných dnech.</p>"}, {"code": "DINING", "title": "Restaurace & Bary Magic World Resort", "text": "<p>Objevte kulinářské kouzlo Magic World! Ať už máte chuť na autentickou italskou kuchyni, lahodné sushi, grilované speciality, klasický hamburger nebo jen lehké občerstvení ke kávě – resort nabízí restaurace i kavárny pro každý vkus. Vyberte si podle nálady a užijte si gastronomický zážitek v příjemném prostředí. Restaurace a bary mohou být zpoplatněny nebo omezeny dle vybrané stravy a délky pobytu.</p>\r\n<p><strong>Restaurace</strong></p>\r\n<ul>\r\n<li>Brisa di Mare – italská kuchyně, čerstvé těstoviny a mořské speciality</li>\r\n<li>Umi Yama – sushi a další japonské pokrmy spojující svěží chuť moře i vrchovin</li>\r\n<li>La Flama – brasserie specializovaná na grilovaná masa a intenzivní chutě, přes oběd se zde podává tradiční paella pocházející z regionu Valencie</li>\r\n<li>Burger Bites – klasické burgery, hranolky a mléčné koktejly v americkém stylu</li>\r\n</ul>\r\n<p><strong>Bary &amp; kavárny</strong></p>\r\n<ul>\r\n<li>Aloha Beach Club – relax jen pár kroků od moře, infinity bazén, balibeds, houpací lehátka a nabídka alkoholických i nealkoholických nápojů</li>\r\n<li>Rooftop Bar – střešní terasa hotelu Fantasy s jedinečnými výhledy a chill-out barem</li>\r\n<li>Irish Tavern – útulný bar s širokou nabídkou piv a skvělou atmosférou</li>\r\n<li>Checkpoint Cafe – bar v hotelu Magic Games s venkovní i vnitřní terasou</li>\r\n<li>William’s Snack Bar – příjemný bar s venkovní terasou a nabídkou snacků a nápojů, ideální pro přestávku mezi aktivitami</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p><strong>Animační program Mango klubu v termínu 29.6. - 3.9.2026<br /></strong>Dětský klub se nachází v sousedním hotelu Magic Fantasy<strong><br /></strong></p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<ul>\r\n<li><strong>zdarma:</strong> vstup do venkovní části Pontiana Mediterraneo Thalasso</li>\r\n<li><strong>za poplatek:</strong> vnitřní wellness, bazén s masážními tryskami, hydrotermální okruhy, jacuzzi, sauna, masáže a další druhy procedur</li>\r\n</ul>"}, {"code": "NOTICE", "title": "Pro handicapované", "text": "<ul>\r\n<li>na vyžádání 6 dvoulůžkový pokojů, výhled moře přizpůsobených pro handicapované klienty; max. obsazenost 3 osoby</li>\r\n<li>bezbariérový pohyb v areálu hotelu</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>WiFi v celém hotelu zdarma</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "www.magicworldresort.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa del Azahar", "url": "https://www.eximtours.cz/spanelsko/costa-del-azahar"}, {"name": "Oropesa del Mar", "url": "https://www.eximtours.cz/spanelsko/costa-del-azahar/oropesa-del-mar"}]}}</script></div></html>
