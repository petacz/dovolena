<html><h1>Lagos de Fanabé Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 145661, "name": "Lagos de Fanabé Beach Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Přímo u pobřežní promenády (v pěší zóně) spojující letoviska Costa Adeje, Playa de las Américas a Los Cristianos. Nákupní a zábavní možnosti v bezprostřední blízkosti hotelu, nákupní centrum cca 600 m, zastávka autobusu cca 200 m. Jachetní přístav Puerto Colón cca 1000 m.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Několik 1-2patrových budov v zahradě, vstupní hala s recepcí, restaurace, italská restaurace a la carte. V zahradě 2 kaskádovité bazény (jeden s možností klimatizace/vyhřívání), bar u bazénu, terasa s lehátky a slunečníky zdarma, osušky oproti kauci.&nbsp;</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<p><strong>Apartmá, 1 ložnice, Deluxe, Přízemí: </strong>koupelna/WC (vysoušeč vlasů), ložnice a oddělený obývací pokoj s kuchyňským koutem, větrák, TV/sat., telefon, trezor za poplatek, set na přípravu kávy/čaje, balkon nebo terasa, v přízemí.</p>\r\n<p><strong>Ostatní typy pokojů&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</strong></p>\r\n<ul>\r\n<li><strong>Apartmá, 1 ložnice, Deluxe, Vyšší patro: </strong>vyšší patro (přístup po schodech), klimatizace.</li>\r\n<li><strong>Apartmá, 1 ložnice, Deluxe, Přímý vstup do bazénu: </strong>s přímým vstupem do bazénu (po schodech).</li>\r\n<li><strong>Apartmá, 2 ložnice, Deluxe, Přízemí: </strong>2 oddělené ložnice.</li>\r\n<li><strong>Apartmá, 2 ložnice, Deluxe, Vyšší patro: </strong>2 oddělené ložnice, vyšší patro (přístup po schodech), klimatizace.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "Světlá písečná pláž Playa de Fañabé s pozvolným vstupem do moře jen přes promenádu, lehátka a slunečníky za poplatek."}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>snídaně, oběd a večeře formou bufetu</li>\r\n<li>lehký snack, ovoce, zmrzlina (15.30-19.30 hod.)</li>\r\n<li>vybrané místní alkoholické a nealkoholické nápoje (10.00–23.00 hod.)</li>\r\n</ul>\r\n<p>Bezlepkovou / bezlaktózovou stravu nutno nahlásit předem.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> fitness, vířivka.<br /><strong>Za poplatek:</strong> biliár, půjčovna kol. Vodní sporty na pláži, golfové hřiště cca 4 km."}, {"code": "CHILDRENS", "title": "Děti", "text": "Bazén, dětská postýlka zdarma (na vyžádání)."}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<p>Hotel akceptuje psy do 7 kg (na vyžádání).</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> WiFi v hotelu."}, {"code": "WEB", "title": "Web", "text": "www.lagosdefanabebeachresort.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Tenerife", "url": "https://www.eximtours.cz/spanelsko/tenerife"}, {"name": "Costa Adeje", "url": "https://www.eximtours.cz/spanelsko/tenerife/costa-adeje"}]}}</script></div></html>
