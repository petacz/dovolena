<html><h1>Paradise Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 240441, "name": "Paradise Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Paradise Resort je menší a klidný 4* hotel v oblasti Finikounda na jihozápadě Peloponésu, obklopený zelenými kopci a s výhledem na tyrkysové vody Jónského moře. Resort je ideální volbou pro klienty, kteří hledají odpočinek u krásné pláže, komorní atmosféru a autentické řecké prostředí mimo rušná letoviska. Finikounda patří mezi nejklidnější přímořská letoviska Peloponésu. Nabízí dlouhé písečné pláže, tradiční taverny, minimum turistického ruchu a jedinečnou atmosféru pravého Řecka.<br />Letiště Kalamata je vzdáleno cca 45 km, centrum města Finikounda 1 km.<br /><br /><strong>Letiště Kalamata</strong>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m od pláže</li>\r\n<li>letiště: 45 km Kalamata</li>\r\n<li>centra: 1 km Finikounda</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj, Deluxe, Výhled zaharada:</strong> koupelna/WC (vysoušeč vlasů), klimatizace (zdarma), TV/sat., telefon, rychlovarná konvice, trezor za poplatek, balkon nebo terasa, dětská postýlka zdarma (na vyžádání), velikost pokoje 18-22 m2, maximální obsazenost pokoje 3 osoby<br /><br /><strong>Ostatní typy pokojů</strong>&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Výhled moře:</strong>&nbsp;výhled moře</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Plus, Výhled zahrada:</strong> prostornější, maximální obsazenost pokoje 4 osoby, přistýlka formou sofa bed</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Plus, Výhled moře:</strong> prostornější, maximální obsazenost pokoje 4 osoby, přistýlka formou sofa bed, výhled moře</li>\r\n<li><strong>Family Suita, Výhled zahrada:&nbsp;</strong>prostornější, maximální obsazenost pokoje 4 osoby, oddělená ložnice</li>\r\n<li><strong>Family Suita, Výhled moře:&nbsp;</strong>prostornější, maximální obsazenost pokoje 4 osoby, oddělená ložnice, výhled moře</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>restaurace</li>\r\n<li>hlavní bar</li>\r\n<li>bar u bazénu</li>\r\n<li>bar u pláže (hrazený extra, není v rámci all inclusive)</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>bazén (lehátka a slunečníky zdarma, slaná voda)</li>\r\n<li>dětský bazén</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>Písečná pláž Maurovouni s pozvolným vstupem - ideální pro děti</li>\r\n<li>Krásné západy slunce</li>\r\n<li>Možnost lehátek a slunečníků oproti konzumaci v plážovém baru (není v rámci all inclusive, hrazený extra)</li>\r\n</ul>\r\n<div>Pláž je dostupná krátkou procházkou přes písečnou dunu nebo po místní komunikaci, případně lze využít hotelový transfer.</div>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně formou bufetu (08.00-10.30 hod.)</li>\r\n<li>Oběd formou bufetu (12.30-14.00 hod.)</li>\r\n<li>Večeře formou bufetu (19.30-21.00 hod.)</li>\r\n<li>Odpolední snack - lehká odpolední svačina (16.00-17.00 hod.)</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (10.00-22.00 hod.)</li>\r\n<li>Zmrzlina na baru (10.00-22.00 hod.)</li>\r\n</ul>\r\n<ul>\r\n<li>Upozornění: výše uvedené časy i místa podávání se mohou změnit.</li>\r\n</ul>"}, {"code": "NOTICE", "title": "Pro handicapované", "text": "<ul>\r\n<li>hotel není bezbariérově upraven</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>minilednička zdarma</li>\r\n<li>lehátka a slunečníky na pláži oproti konzumaci v plážovém baru</li>\r\n<li>domácí mazlíčci nejsou povoleni</li>\r\n<li>trezor na pokoji za poplatek</li>\r\n<li>dětská postýlka zdarma</li>\r\n<li>klimatizace zdarma</li>\r\n<li>plážové osu
