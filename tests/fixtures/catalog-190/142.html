<html><h1>Marilena</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2526, "name": "Marilena", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotel se nachází v malebném letovisku Ammoudara a skládá se ze 3 budov. Budovy hotelu jsou obklopeny zahradou s palmami, která přímo vybízí k odpočinku. Do města Heraklion je to pouhých 5 kilometrů. Díky svému umístění doporučujeme tento hotel především klientům, kteří chtějí strávit příjemnou dovolenou u moře, a také rodinám s dětmi.&nbsp;</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 150 m</li><li>letiště: 10 km Heraklion</li><li>centra: 5 km</li><li>nákupních možností: 0 m v okolí</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Economy, Přízemí:</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednička</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (za poplatek 1,50 EUR/den či 10 EUR/týden)</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n<li>Economy pokoj - pokoje ve sníženém přízemí, pouze terasa</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Dvoulůžkový pokoj, Superior:&nbsp;</strong>balkon nebo terasa</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled moře: </strong>balkon nebo terasa</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice: </strong>dvě místnosti oddělené dveřmi</li>\r\n<li><strong>Čtyřlůžkový pokoj:</strong> prostornější</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>lobby bar</li>\r\n<li>bar u bazénu</li>\r\n<li>TV koutek</li>\r\n<li>bazén (lehátka a slunečníky zdarma, osušky za vratnou zálohu 10 EUR/kus)</li>\r\n<li>dětské hřiště</li>\r\n<li>výtah</li>\r\n<li>parkovací stání (zdarma, dle dostupnosti)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>veřejná, písčitá</li><li>lehátka a slunečníky (za poplatek cca 6 EUR/set/den)</li></ul>"}, {"code": "DINING", "title": "Strava ", "text": "<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace: 7.00–10.15 snídaně formou bufetu, 12.00–14.00 oběd formou bufetu, 19.00–21.00 večeře formou bufetu. U snídaně filtrovaná káva, čaj a voda, u oběda a večeře nealkoholické nápoje, pivo a víno</li>\r\n<li>Hlavní bar: 17.30–1.00 (po 23.00 za poplatek) nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj</li>\r\n<li>Bar u bazénu: 10.00–23.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), lehké občerstvení, 16.00–17.00 filtrovaná káva, čaj, zákusky, lehké občerstvení</li>\r\n</ul>\r\n<strong>Upozornění: </strong>U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>stolní tenis</li>\r\n<li>šipky</li>\r\n<li>basketbal</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>tenisový kurt</li>\r\n<li>kulečník</li>\r\n<li>minihokej</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>Wi-Fi v celém areálu hotelu.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "http://marilenahotel.gr/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavede
