<html><h1>Sol Palmanova</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3500, "name": "Sol Palmanova", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V oblíbeném letovisku Palmanova. Pobřežní promenáda s množstvím obchodů, restaurací a barů cca 250 m. Rušné letovisko Magaluf cca 1 km. Hlavní město Palma de Mallorca cca 15 km (spojení linkovým autobusem, zastávka v blízkosti hotelu). Zábavní park Katmandu cca 1 km, aquapark Western Park cca 4 km. Letiště: 25 km Palma de Mallorca</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, restaurace a bar. Venku 2 bazény, bar u bazénu, terasa s lehátky a slunečníky zdarma, osušky oproti kauci.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong><strong>:</strong> koupelna/WC, klimatizace, TV/sat., telefon, minilednička, trezor za poplatek, balkon nebo terasa.<br /><br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled bazén</strong><strong>:</strong> výhled na bazén.</li>\r\n<li><strong>Rodinný pokoj</strong><strong>:</strong> 1. patro, prostornější, rozkládací pohovka.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Pravidelný denní a večerní animační program, zábavné večery.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký teplný a studený snack (10.00–13.00, 15.00–18.30 a 21.30–23.00 hod.)</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje (10.00–24.00 hod.)</li>\r\n<li>All inclusive je čerpán v místech a časech určených hotelem, právo na změnu vyhrazeno</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s pozvolným vstupem do moře cca 250 m, lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Za poplatek:</strong> golfové hřiště cca 3 km.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén s malým splash, brouzdaliště, animace, miniklub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "WEB", "title": "Web", "text": "www.sol-hotels.com"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma:</strong> WiFi v areálu hotelu.</li>  <li><strong>Za poplatek:</strong> internetový koutek.</li>  </ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Palma Nova", "url": "https://www.eximtours.cz/spanelsko/mallorca/palma-nova"}]}}</script></div></html>
