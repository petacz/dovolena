<html><h1>H10 Tindaya</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1650, "name": "H10 Tindaya", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel se nachází v klidné lokalitě na okraji oblíbeného letoviska Costa Calma. Centrum s možností nákupů, s bary a restauracemi cca 1 km. Letiště Fuerteventura je vzdáleno 65 km od hotelu.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>354 pokojů, výtahy, vstupní hala s recepcí, bary, restaurace, společenské prostory. Venku 3 bazény (1 v zimě s možností vyhřívání/klimatizace), snack bar u bazénu, terasa s lehátky a slunečníky zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře</strong>: koupelna/WC (vysoušeč vlasů), TV/sat., telefon, individuální klimatizace, trezor a minibar za poplatek, balkon nebo terasa směrem k moři nebo s bočním výhledem na moře.</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, výhled moře</strong>: prostornější, výhled na moře.</li>\r\n<li><strong>Dvoulůžkový pokoj, Priviledge, výhled moře:</strong> služby Priviledge, výhled moře, moderní vybavení.</li>\r\n<li><strong>Junior suite, 1 ložnice, výhled moře</strong>: oddělená ložnice, prostorná terasa, výhled na moře.</li>\r\n<li><strong>Junior suite, 1 ložnice, Priviledge, boční výhled moře:</strong> oddělená ložnice, služby Priviledge, prostorná terasa.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Pravidelné animační programy, zábavné show, živá hudba.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>Viz. program all inclusive.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž Sotavento s pozvolným vstupem do moře přímo u hotelu (přístup hotelovým podchodem a po schodech). Lehátka a slunečníky za poplatek.
