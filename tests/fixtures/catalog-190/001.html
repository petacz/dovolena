<html><h1>Vantaris Palace</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1063, "name": "Vantaris Palace", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Příjemný hotelový komplex, skládající se z hlavní budovy a několika vedlejších menších bloků, leží u písečné pláže na klidném místě v blízkosti Georgioupolis. Rušnější letovisko Rethymno je vzdáleno 18 kilometrů. Hotel je součástí 5 sesterských hotelů. Vantaris Palace je ideálním výchozím bodem pro poznávání ostrova. Jediné sladkovodní jezero na Krétě je vzdáleno cca 5 kilometrů. Toto příjemné ubytování doporučujeme všem, kteří chtějí strávit klidnou a odpočinkovou dovolenou, stejně jako rodinám s dětmi.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m u pláže</li>\r\n<li>letiště: 100 km Heraklion / 48 km Chania</li>\r\n<li>centra: 4 km Georgioupolis</li>\r\n<li>nákupních možností: 0 m v místě</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Promo:</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednice</li>\r\n<li>trezor (za poplatek cca 2 EUR/den, pro hosty s All Inclusive zdarma)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>terasa</li>\r\n<li>dětská postýlka na vyžádání (za poplatek 5 EUR/den)</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>pouze omezené množství pokojů</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled do krajiny:</strong> pouze terasa</li>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře: </strong>balkon nebo terasa</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře: </strong>balkon nebo terasa, pokoje umístěné v přední části hotelu</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Outdoor Jacuzzi:</strong> nové pokoje, privátní vířivka</li>\r\n<li><strong>Junior Suita, Výhled moře:</strong> prostorná místnost, pokoje umístěné v přední části hotelu</li>\r\n<li><strong>Junior Suita, Soukromý bazén:</strong> prostorná místnost, privátní bazén</li>\r\n<li><strong>Rodinný pokoj, Výhled do krajiny: </strong>dvě místnosti</li>\r\n<li><strong>Rodinná Suite, Soukromý bazén:</strong> dvě místnosti, privátní bazén</li>\r\n<li><strong>Jednolůžkové pokoje</strong></li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>lobby bar</li>\r\n<li>bar na pláži</li>\r\n<li>minimarket</li>\r\n<li>připojení k internetu (zdarma)</li>\r\n<li>vnitřní bazén (vyhřívaný v květnu a září)</li>\r\n<li>venkovní bazén s oddělenou částí pro děti (lehátka, slunečníky a osušky zdarma)</li>\r\n<li>dětské hřiště</li>\r\n<li>výtah</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá</li>\r\n<li>lehátka a slunečníky (za poplatek, pro hosty s All Inclusive zdarma), osušky (zdarma)</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava ", "text": "<strong>Polopenze:&nbsp;</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace: 7.30–10.30 snídaně formou bufetu, 12.30–14.30 oběd formou bufetu, 18.30–21.00 večeře formou bufetu. U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje, pivo, víno</li>\r\n<li>Lobby bar: 10.00–24.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj</li>\r\n<li>Bar na pláži: 10.00–18.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva,čaj, 11.00–17.00 sendviče, pizza, hranolky, ovoce, 12.30–15.30 salátový bar, 11.00–15.20 zmrzlina, 15.30–17.00 filtrovaná káva, čaj, zákusky</li>\r\n</ul>\r\n<strong>Upozornění
