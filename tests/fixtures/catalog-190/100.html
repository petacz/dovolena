<html><h1>Hipotels Mediterraneo Club</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3093, "name": "Hipotels Mediterraneo Club", "description": [{"code": null, "title": "Poloha", "text": "<p>Přímo u pobřežní promenády spojující letoviska Sa Coma a S´illot. V okolí hotelu mnoho obchodů, restaurací a barů. Oblíbené letovisko Cala Millor cca 2 km. Ideální místo pro výlety do okolí (krápníkové Dračí jeskyně, vesnice Son Servera, letovisko Porto Cristo. V blízkosti hotelu několik lékáren. Letiště Palma de Mallorca je od hotelu vzdáleno 69 km.</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Komplex rozdělen místní komunikací na 2 části - CLUB a GARDEN. První část komplexu označená CLUB se nachází u pobřežní promenády v blízkosti pláže a je orientovaná zejména na ubytovací služby – tříposchoďové budovy (bez výtahu) rozmístěny v zahradě a u bazénu. V hlavní budově recepce, venku&nbsp; bazén s oddělenou částí pro děti, snack bar u bazénu (část CLUB je rozdělena málo frekventovanou slepou silnicí). Druhá část komplexu označená GARDEN je oddělená místní komunikací – 2 klimatizované nekuřácké restaurace (1 s terasou), bar, amfiteátr, bazén, bazén s vodními atrakcemi pro menší děti, rozlehlá zahrada, dětské hřiště, další apartmá. Lehátka a slunečníky u všech bazénů zdarma, osušky oproti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<strong>Apartmá, 1 ložnice, Club: </strong>1 oddělená ložnice, obývací pokoj s vybaveným kuchyňským koutem (lednička, sporák, základní nádobí, mikrovlnná trouba), koupelna/WC (vysoušeč vlasů), TV/sat., individuální klimatizace, telefon, trezor zdarma, balkon nebo terasa; v části komplexu označené CLUB.<br /><br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Apartmá, 1 ložnice, Club, Výhled moře:</strong> výhled na moře; v části komplexu označené CLUB</li>\r\n<li><strong>Apartmá, 1 ložnice, Zahrada:</strong> v části komplexu označené GARDEN oddělené místní komunikací</li>\r\n<li><strong>Studio, Zahrada:</strong> pouze 1 místnost, kombinovaný obývací pokoj s ložnicí a kuchyňským kout, v části komplexu označené GARDEN oddělené místní komunikací</li>\r\n</ul>"}, {"code": null, "title": "Stravování", "text": "<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu.&nbsp;</li>\r\n</ul>\r\n<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně formou bufetu (08.00–10.30 hod.)</li>\r\n<li>Oběd formou bufetu (12.30–14.30 hod.)</li>\r\n<li>Večeře formou bufetu v hlavní restauraci (18.00–21.00 nebo 18.30–21.30 hod.)</li>\r\n<li>Večeře v restauraci - Tapas (1x týdně, rezervace nutná)</li>\r\n<li>Denní snack (10.30–21.00 hod.)</li>\r\n<li>Alkoholické a nealkoholické nápoje (10.00–23.30 hod.)</li>\r\n<li>Zmrzlina (10.00–23.30 hod.)</li>\r\n<li class=\"f_list-item\">All Inclusive je čerpán v místech a časech určených hotelem, právo na změnu vyhrazeno</li>\r\n</ul>"}, {"code": null, "title": "Náš názor", "text": "<p>Tento komplex apartmá doporučujeme pro aktivně založené rodiny, které uvítají blízkost centra letoviska Sa Coma. Rodiny s dětmi jsou vítány ve Funtazie klubu.</p>"}, {"code": null, "title": "Pláž", "text": "<p>Krásná široká písečná pláž s pozvolným&nbsp;vstupem do moře přístupná přes pěší promenádu.&nbsp;Lehátka a slunečníky za poplatek, sprchy na pláži.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma</strong>: v hotelu stolní tenis (vybavení oproti kauci), plážový volejbal</li>\r\n<li><strong>Za poplatek</strong>: biliár, videohry, kurz potápění, půjčovna kol, 4 tenisové kurty, nejbližší golfové hřiště Golf Son Servera 7 km, windsurfing.</li>\r\n</ul>"}, {"code": null, "title": "Děti", "text": "<p>Dětská postýlka zdarma, dětská stolička v hlavní restauraci, oddělený dětský sladkovodní bazén se skluzavkami a prolézačkami pro nejmenší.</p>\r\n<p><strong>Animační program Funtazie klubu v termínu 23.6. - 4.9.2027 </strong>(neplatí pro produkt Fischer Dynamix)</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Web", "text": "www.hipotels.com"}, {"code": null, "title": "Internet", "text": "<p><strong>Zdarma: </strong>WiFi zdarma v celém hotelovém komplexu.&nbsp;</p>"}, {"code": null, "title": "Poznámka", "text": "<p>Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Sa Coma", "url": "https://www.eximtours.cz/spanelsko/mallorca/sa-coma"}]}}</script></div></html>
