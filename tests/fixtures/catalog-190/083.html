<html><h1>Playacapricho</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 124, "name": "Playacapricho", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Přímo u písečné pláže a promenády. V okolí hotelu mnoho obchodů, restaurací a barů. Autobusová zastávka v blízkosti hotelu. Letiště Almeria je od hotelu vzdálené cca 40 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>335 pokojů, vstupní hala s recepcí, restaurace, kavárna, konferenční místnost, obchod se suvenýry. Venku 2 bazény, terasa s lehátky a slunečníky zdarma, osušky oproti kauci, snack bar u bazénu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong><strong>:</strong> koupelna/WC, vysoušeč vlasů, klimatizace, telefon, stropní ventilátor, TV/sat., minibar a&nbsp;trezor za poplatek, balkon nebo terasa;&nbsp;2&nbsp;lůžka široká 135 cm bez možnosti přistýlky.</li>\r\n<li><strong>Dvoulůžkový pokoj Výhled moře</strong><strong>:</strong> viz. dvoulůžkový pokoj, navíc výhled na moře.</li>\r\n<li><strong>Dvoulůžkový pokoj Comfort</strong><strong>:</strong> viz. dvoulůžkový pokoj, renovovaná koupelna, moderní nábytek, 2 lůžka široká 105 cm, rozkládací pohovka (velikost lůžka 180 cm x 120 cm); bez možnosti přistýlky.</li>\r\n<li><strong>Suite Playa:</strong> viz dvoulůžkový pokoj, navíc výhled na moře, pokoje situované v první linii od moře v oddělené budově, v koupelně kulatá vana.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní i večerní animační programy, zábavné večery.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Široká pláž s hrubým pískem s malými oblázky oddělena pouze pěší pobřežní promenádou, lehátka a slunečníky v docházkové vzdálenosti za poplatek.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze plus</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu, včetně nápojů k jídlu (voda, pivo, limo, víno)</li>\r\n</ul>\r\n<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack (12.00-15.00 a 17.00-19.00 hod.)</li>\r\n<li>Káva, čaj a sladké pečivo (17.00-19.00 hod.)</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje (10.00-24.00 hod.)</li>\r\n<li>V den odjezdu platnost do 12.00 hod.</li>\r\n<li>Výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Zdarma:</strong> fitness, zumba, aerobik, vodní polo.</li>  <li><strong>Za poplatek</strong>: biliár, minigolf, stolní tenis, vodní sporty na pláži, golfové hřiště 800 m, jízda na koni.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén se skluzavkami, brouzdaliště, hřiště, miniklub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC, Diners Club.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma:</strong> Wifi v lobby (pouze prvních 30 minut)</li>  <li><strong>Za poplatek:</strong> v celém areálu hotelu.</li>  </ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>Rozsah a kvalita výše uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": "WEB", "title": "Web", "text": "https://www.playasenator.com"}, {"code": "NOTE", "title": "Handicap", "text": "<p>Na vyžádání několik pokojů pro handicapované klienty.</p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Malaga je vzdáleno 204 km od hotelu. </br>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Almería", "url": "https://www.eximtours.cz/spanelsko/costa-almeria"}, {"name": "Roquetas de Mar", "url": "https://www.eximtours.cz/spanelsko/costa-almeria/roquetas-de-mar"}]}}</script></div></html>
