<html><h1>Mitsis Selection Azure</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 167801, "name": "Mitsis Selection Azure", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<span data-teams=\"true\"><strong>Mitsis Selection Azure (ex. Canvas by Mitsis Alexander the Great)</strong> je pětihvězdičkový hotel v oblasti Kriopigi na poloostrově Chalkidiki. Hotel je ideální volbou pro rodiny, páry i jednotlivce, kteří hledají kombinaci pohodlí a krásné přírody. U písečné pláže oceněné Modrou vlajkou kvality, což zaručuje čistotu a kvalitu vody, a nabízí nádherné výhledy na Egejské moře. Hotel prošel rekonstrukcí v roce 2026. Letovisko Kriopigi s bary, obchůdky a tavernami cca 1,5km, letiště (Soluň) cca 85km. Rušné letovisko vhodné pro noční život Kallithea cca 2,5km.<br /><br /><strong>Oblast Chalkidiki</strong></span>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "Hlavní budova a samostatné budovy (211 pokojů), vstupní hala s recepcí, hlavní restaurace, Noční bar,A la carte restaurace (italská a řecká), bar u bazénu, Beach bar, Snack Bar, basketbalové kurty, venkovní parkoviště. V zahradě hlavní bazén, dětská část bezénu, terasa na slunění s lehátky a slunečníky zdarma, dětská herna."}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Výhled zahrada:</strong> koupelna/WC (vysoušeč vlasů, walk-in sprchový kout), TV/sat., klimatizace (centrální), minilednička, set na přípravy čaje a kávy, telefon, trezor, balkon nebo terasa, výhled do zahrady, osuška k bazénu zdarma, cca 21 m2. Možnost pokojového servisu za poplatek.<br /><br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře:&nbsp;</strong>boční výhled na moře,</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:&nbsp;</strong>výhled na moře,</li>\r\n<li><strong>Junior Suita, Výhled zahrada:&nbsp;</strong>prostornější cca 26-28 m2,&nbsp;</li>\r\n<li><strong>Junior Suita, Boční výhled moře:&nbsp;</strong>prostornější cca 26-28 m2,&nbsp;</li>\r\n<li><strong>Junior Suita, Výhled moře:</strong> prostornější cca 26-28 m2,&nbsp;</li>\r\n<li><strong>Rodinný pokoj:</strong> velmi prostorný pokoj až pro 6 osob</li>\r\n<li><strong>Jednolůžkový pokoj, Výhled zahrada,</strong></li>\r\n<li><strong>Suita, Výhled zahrada: </strong>prostornější cca 31-44 m2, pohovka,</li>\r\n<li><strong>Suita, Výhled moře:</strong> prostornější cca 31-44 m2, pohovka, výhled moře,</li>\r\n</ul>\r\n<br />Pokoje po rekonstrukci."}, {"code": "BEACH", "title": "Pláž", "text": "<ul>\r\n<li>písečná pláž u hotelu</li>\r\n<li>lehátka a slunečníky (zdarma)</li>\r\n<li>sprcha na pláži</li>\r\n<li>přístup na pláž po schodech, nebo cestou cca 150m</li>\r\n<li>osušky k zapůjčení zdarma</li>\r\n</ul>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>brzká snídaně (04.00-07.00 hod.) v hlavní restauraci</li>\r\n<li>snídaně formou bufetu (07.00 - 10.30 hod.) v hlavní restauraci</li>\r\n<li>oběd formou bufetu (12.30 - 14.30 hod.) v hlavní restauraci</li>\r\n<li>večeře formou bufetu (18.30 - 21.30 hod.) v hlavní restauraci</li>\r\n<li>noční svačina (22.00-04.00 hod.) v hlavní restauraci</li>\r\n<li>řecká taverna \"Kefi\" (18.30-22.00 hod.), řecká kuchyně včetně vegetariánských pokrmů (nutná rezervace) - hrazeno extra</li>\r\n<li>italská taverna \"Evviva\" (09.00-12.00 hod.) brunch - nutná rezervace - hrazeno extra</li>\r\n<li>italská taverna \"Evviva\" (12.30-22.00 hod.) - nutná rezervace, hrazeno extra</li>\r\n<li>hlavní bar (18.00-01.00 hod.) - alkoholické a nealkoholické nápoje, pivo, víno, míchané koktejly, večer několikrát týdně živá hudba</li>\r\n<li>bar u bazénu (10.00-18.00 hod.) - lehký snack, alkoholické a nealkoholické nápoje, pivo, víno, míchané nápoje</li>\r\n<li>plážový bar (10.00-18.00 hod.) - lehký snack, alkoholické a nealkoholické nápoje, pivo, víno, míchané nápoje\r\n<ul>\r\n<li>lehký snack (12.00-18.00 hod.)</li>\r\n</ul>\r\n</li>\r\n<li>noční bar (18.00-02.00 hod.) - bar s nádherným výhledem na moře, alkoholické a nealkoholické nápoje, pivo, víno, míchané nápoje</li>\r\n</ul>\r\nUvedené časy jsou orientační, upřesněny budou na hotelové recepci.<br />V restauracích vyžadováno smart-casual oblečení, zakázán je vstup v plavkách.<br />Ztráta hotelového all-inclusive náramku a následné vydání nového je zpoplatněno.<br />Možnost přípravy svačinového balíčku výměnou za jídlo v restauraci pro klienty, kteří pojedou na výlet - nutno objednat den dopředu.<br />Speciální diety na vyžádání - bezlepková, bezlaktozová, vegetariánské jídlo, veganské jídlo."}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> basketbalové kurty (nutná rezervace předem), plážový volejbal<br /><strong>Za poplatek: </strong>French biliárd v baru, vodní sporty (poskytuje 3.strana)"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "Denní a večerní animační programy, večery s živou hudbou, DJ."}, {"code": "CHILDRENS", "title": "Děti", "text": "Dětský bazén, dětská stolička v hlavní restauraci, dětská postýlka zdarma, dětský klub pro děti vě věku 4-12 let (10.00 - 18.00 hod., 6x týdně) v anglickém jazyce"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>hotel neakceptuje domácí zvířata</li>\r\n<li>trezor na pokoji (zdarma)</li>\r\n<li>plážové osušky k zapůjčení (zdarma) - při check-in</li>\r\n<li>wifi zdarma</li>\r\n<li>rekonstrukce v roce 2026</li>\r\n</ul>"}, {"code": "NOTICE", "title": "Pro handicapované", "text": "<ul>\r\n<li>Hotel není zcela uzpůsoben k bezbariérovému pohybu,</li>\r\n<li>hotel má k dispozici 2 bezbariérové pokoje (na vyžádání),</li>\r\n<li>přístup k bazénu je bezbariérově upraven, vstup do bazénu po schodech.</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>WiFi v lobby a na pokoji (zdarma)</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<ul>\r\n<li>https://www.mitsis.com/en/hotels/mitsis_alexander_the_great</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Chalkidiki a Olympská Riviéra", "url": "https://www.eximtours.cz/recko/chalkidiki"}, {"name": "Kriopigi", "url": "https://www.eximtours.cz/recko/chalkidiki/kriopigi"}]}}</script></div></html>
