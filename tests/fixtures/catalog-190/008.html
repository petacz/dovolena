<html><h1>Playa Garden</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3386, "name": "Playa Garden", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V klidné oblasti na severním pobřeží ostrova. Možnost nákupů a zábavy v oblíbených letoviscích Alcúdia cca 6 km a C’an Picafort cca 4 km (spojení linkovým autobusem, zastávka cca 50 m). V okolí několik restaurací a možnost drobných nákupů. Letiště Palma de Mallorca je od hotelu vzdáleno 60 km. </p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>225 pokojů, 8 třípodlažních budov. Vstupní hala s recepcí, výtahy, restaurace,&nbsp; restaurace à la carte (pizzerie) a bar. Venku bazén, bar u bazénu, terasa s lehátky a slunečníky zdarma. Oddělená relaxační terasa s malým bazénem a balibeds za poplatek (vstup od 10 let). Osušky oproti kauci, výměna za poplatek.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Apartmá, 1 ložnice</strong>: koupelna/WC (vysoušeč vlasů), oddělená ložnice, obývací část s rozkládací pohovkou, kuchyňský kout (+mikrovlnná trouba), klimatizace, telefon, TV/sat., trezor za poplatek, balkon nebo terasa.<br /><br /><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Apartmá, 1 ložnice, Výhled bazén</strong>: výhled na bazén.</li>\r\n<li><strong>Apartmá, 1 ložnice, Boční výhled moře</strong>: boční výhled na moře.</li>\r\n<li><strong>Apartmá, 1 ložnice, Premium, Private Garden</strong>: v přízemí s přímým vstupem na privátní zahradu.&nbsp;</li>\r\n<li><strong>Apartmá, 1 ložnice, Priviledge, Boční výhled moře</strong>:&nbsp; střešní terasa s balinese a jacuzzi.</li>\r\n<li><strong>Apartmá, 1 ložnice, Swim-Up</strong>: v přízemí s přímým vstupem do sdíleného bazénu.</li>\r\n<li><strong>Apartmá, 1 ložnice, Promo</strong>: kapacitně omezená nabídka, pokoje mohou být umístněny v méně výhodné poloze.</li>\r\n<li><strong>Apartmá, 1 ložnice, Selected:</strong> exkluzivní služby Selected.</li>\r\n<li><strong>Apartmá, 1 ložnice, Selected, Swim-Up: </strong>v přízemí s přímým vstupem do sdíleného bazénu,&nbsp;exkluzivní služby Selected.</li>\r\n</ul>\r\n<strong><strong>SELECTED:&nbsp; </strong></strong>welcome balíček, pillow menu, prémiové matrace, minibar zdarma (doplnění za poplatek), trezor, župany a pantofle zdarma, prioritní check-in a check-out, exkluzivní Sky&amp;Sea terasa (bali beds), VIP zóny v bufetové restauraci."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní i večerní animační programy, pravidelně večerní představení, živá hudba.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack během dne v době mimo hlavní jídla</li>\r\n<li>Odpolední káva, čaj a sladké pečivo</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje (11.00–24.00 hod.)</li>\r\n<li class=\"f_list-item\">All Inclusive je čerpán v místech a časech určených hotelem, právo na změnu vyhrazeno</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Dlouhá písečná pláž Playa de Muro s pozvolným vstupem do moře vhodná pro děti přímo u hotelu, lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p><strong>Zdarma:</strong> fitness, minigolf, multifunkční hřiště (tenis, fotbal, volejbal), biliár, stolní tenis, plážový volejbal.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, hřiště, animace, miniklub (4–12 let), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "WEB", "title": "Web", "text": "www.gardenhotels.com"}, {"code": "WELLNESS", "title": "Wellness", "text": "<ul>  <li>Krásně zařízené spa centrum určené pro ničím nerušenou relaxaci</li>  <li>Vstup od 5 let (pro děti pouze v doprovodu dospělých osob)</li>  <li><strong>Zdarma:</strong> vnitřní bazén, termální koupel, jacuzzi, turecké lázně, finská sauna</li>  <li><strong>Za poplatek:</strong> salon krásy, masáže, léčebné a relaxační procedury</li>  </ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<p>Na vyžádání 5 apartmá přizpůsobených pro handicapované klienty. Bezbariérový pohyb v areálu hotelu včetně upraveného přístupu do bazénu.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi v celém hotelu.</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu.&nbsp;"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Playa de Muro", "url": "https://www.eximtours.cz/spanelsko/mallorca/playa-de-muro"}]}}</script></div></html>
