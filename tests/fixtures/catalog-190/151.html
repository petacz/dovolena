<html><h1>Sol Barbados</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 9475, "name": "Sol Barbados", "description": [{"code": null, "title": "Informace o hotelu", "text": "<p>Oblíbený hotelový komplex známého řetězce Sol Mélia je umístěn v blízkosti hlavní pláže Magaluf a díky terasovitému vzhledu nabízí i krásný výhled na celý záliv. Hotelové pokoje prošly v roce 2015 rekonstrukcí. Jedná se o velmi dobře vedený hotelový resort s kvalitním servisem služeb a výbornou polohou u pláže i v dosahu barů a restaurací a rovněž v blízkosti hlavního města Palma de Mallorca. V okolí se nachází hned několik golfových hřišť, z tohoto důvodu je resort oblíben i mezi hráči golfu. Doporučujeme klientům všech věkových kategorií a především rodinám s dětmi, které ocení kvalitní animační program i blízkost vodních parků Wester Water Park a Marineland. Hotel je bezbariérový a je uzpůsoben i pro handicapované klienty.</p>"}, {"code": null, "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 150 m</li>\r\n<li>letiště: 22 km Palma</li>\r\n<li>centra: 0.3 km</li>\r\n<li>hlavního města Palma: 15 km</li>\r\n<li>nákupních možností: 100 m</li>\r\n<li>autobusové zastávky: 50 m</li>\r\n</ul>"}, {"code": null, "title": "Popis hotelu", "text": "<ul>\r\n<li>428 pokojů</li>\r\n<li>výtahy</li>\r\n<li>vstupní hala s recepcí</li>\r\n<li>restaurace</li>\r\n<li>lobby bar</li>\r\n<li>snack bar</li>\r\n<li>bar u bazénu</li>\r\n<li>Wi-Fi zdarma</li>\r\n<li>bazén</li>\r\n<li>terasa s lehátky a slunečníky zdarma</li>\r\n<li>osušky oproti kauci</li>\r\n<li>dětský bazén</li>\r\n<li>dětský splash</li>\r\n<li>miniclub</li>\r\n</ul>"}, {"code": null, "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Výhled bazén</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV/sat.</li>\r\n<li>Wi-Fi zdarma</li>\r\n<li>minibar</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor za poplatek</li>\r\n<li>balkon nebo terasa<
