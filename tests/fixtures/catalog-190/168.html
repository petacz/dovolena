<html><h1>CLUB ELORO</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 142152, "name": "CLUB ELORO", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotel Eloro Club je situován v klidné oblasti letoviska Marina di Noto, přímo u krásné písčité pláže s pozvolným vstupem do moře. Na své si zde přijdou milovníci dobrého jídla - v areálu najdete kromě hlavní restaurace i dalších pět tématických restaurací a osvěžující drink si vychutnáte v jednom ze tří barů. Pro děti je k dispozici dětský bazén a velké dětské hřiště. Pár kroků od hotelu naleznete přírodní rezervaci Vendicari, která vás svými třemi turistickými stezkami zavede nejen na významné archeologické památky, ale také na nádherné pláže s perfektními podmínkami pro šnorchlování. Za návštěvu stojí i nedaleké známé město Syrakusy. Pokud zrovna nebudete poznávat krásy Sicílie, tak se můžete bavit při animačních a večerních programech, využívat hotelovou posilovnu či některé ze sportovních hřišť nebo jen relaxovat u prostorného bazénu.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: u pláže</li><li>letiště: 89 km Catania</li><li>centra: 0.8 km Marina di Noto, 8.5 km Noto</li><li>nákupních možností: 50 m</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>TV</li>\r\n<li>telefon</li>\r\n<li>trezor</li>\r\n<li>minibar</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>Wi-Fi (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>v případě čtyř osob může být přistýlka formou palandy</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>3 bary</li>\r\n<li>5 restaurací s obsluhou (pizzeria, sicilská, gril, libanonská a středomořská za poplatek, rezervace nutná)</li>\r\n<li>bazén (lehátka a slunečníky zdarma)</li
