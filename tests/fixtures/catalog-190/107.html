<html><h1>Playadulce</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 155927, "name": "Playadulce", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Na pobřežní promenádě oblíbeného letoviska Aguadulce. V blízkosti obchody, restaurace, bary, 2 km od přístavu. Autobusová zastávka v blízkosti hotelu (spojení do města Almería).</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, výtahy, restaurace, bar, konferenční místnost, obchod se suvenýry, kadeřnictví. Venku bazén s jacuzzi a skluzavkami, zahrada, terasa s lehátky a slunečníky zdarma, osušky oproti kauci, bar u bazénu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj a pokoj Yield</strong>: koupelna/WC (vysoušeč vlasů), TV/sat., klimatizace, telefon, trezor za poplatek, balkon nebo terasa, 2 prostorná lůžka o rozměrech 1,35 × 2 m, děti spí společně s rodiči, není možnost přistýlky.</li>\r\n<li><strong>Dvoulůžkový pokoj superior: </strong>modernější vybavení, župan, pantofle v pokoji, set na kávu a čaj (varná konvice)</li>\r\n<li><strong>Dvoulůžkový pokoj superior s výhledem na moře</strong>: viz dvoulůžkový pokoj superior, navíc výhled na moře.</li>\r\n<li><strong>Jednolůžkový pokoj:</strong> viz dvoulůžkový pokoj, pouze 1 lůžko 1,35 x 2 m - ubytování pro 1 osobu.</li>\r\n<li><strong>Rodinný pokoj</strong>: viz. dvoulůžkový pokoj, tematické pokoje ve westernovém stylu, pro menší děti palanda ve formě bryčky.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní i večerní animační programy, zábavné večery.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>Polopenze plus</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu s nápoji (voda, limonáda, pivo, víno)</li>\r\n</ul>\r\n<strong>All inclusive Premium</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu.</li>\r\n<li>Lehký snack - tapas (12.00–15.00 a 17.00–19.00 hod.)</li>\r\n<li>Vybrané druhy zmrzlin.</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje místní výroby (10.00–24.00 hod.).</li>\r\n<li>V den odjezdu platnost do 12.00 hod.</li>\r\n<li>Výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Pláž s hrubším pískem a pozvolným vstupem do moře je oddělena pobřežní komunikací, lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Zdarma:</strong> minigolf, pétanque, stolní tenis, plážový volejbal, aerobik, aquagym.</li>  <li><strong>Za poplatek:</strong> biliár, tenis, půjčovna kol, v blízkosti golfová hřiště.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, skluzavky, tobogan, miniklub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.playasenator.com/"}, {"code": "NOTE", "title": "Handicap", "text": "<p>Na vyžádání několik pokojů přizpůsobených pro handicapované klienty.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi v hotelu zdarma</li>\r\n<li><strong>Za poplatek:</strong> internetový koutek.</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Almería je vzdáleno 23 km od hotelu. </br>\r\nLetiště Malaga je vzdáleno 203 km od hotelu. </br>\r\n"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Almería", "url": "https://www.eximtours.cz/spanelsko/costa-almeria"}, {"name": "Roquetas de Mar", "url": "https://www.eximtours.cz/spanelsko/costa-almeria/roquetas-de-mar"}]}}</s
