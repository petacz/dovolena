<html><h1>Aldemar Olympian Village</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1751, "name": "Aldemar Olympian Village", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Aldemar Olympian Village***** resort se nachází na západním pobřeží Peloponésu v oblasti Olympia. Hotel se nachází přímo u dlouhé a široké písečné pláže s pozvolným vstupem do moře. Resort nabízí skvělou polohu, moderní vybavení a širokou nabídku animačních i sportovních aktivit pro děti i dospělé, je tak ideálním místem pro rodinnou dovolenou. Oceněn cenou za nejlepší hotelový resort roku 2020 a 2021.&nbsp; Mezinárodní letiště Araxos 50 km, městečko Pyrgos 12 km (spojení autobusem) a bájná Olympie cca 35 km, 3 hodiny jízdy od Athén.<br /><br /><strong>Letiště Araxos</strong></p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Rozsáhlý komplex několika vícepatrových budov umístěných v udržované zahradě. Hlavní budova s recepcí, lobby s barem, nákupní galerie (mini-market, obchůdek se suvenýry, boutique pro dámy, boutique pro pány, kadeřnictví), hlavní restaurace, restaurace a lá carte (italská, řecká), několik barů, konferenční místnost. V udržované subtropické zahradě 2 bazény (jeden se kluzavkou) a další 2 bazény pro děti, několik sdílených bazénů u bungalovů, lehátka a slunečníky zdama, bary u bazénů. Kongresové centrum.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Výhled zaharada:</strong> koupelna/WC (vysoušeč vlasů), klimatizace (zdarma), TV/sat., telefon, minilednice, rychlovarná konvice, trezor, balkon nebo terasa, ve vícepatrové budově, velikost pokoje 27 m2, dětská postýlka zdarma (na vyžádání)<br /><br /><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Premium, Výhled zahrada:</strong> prostornější 33 m2, ve vícepatrové budově, přistýlka formou rozkládacího lůžka</li>\r\n<li><strong>Dvoulůžkový pokoj, Premium, Výhled moře:</strong> prostornější 33 m2, výhled moře, ve vícepatrové budově, přistýlka formou rozkládacího lůžka</li>\r\n<li><strong>Bungalow, Výhled zahrada:</strong> v nižším patře, výhled zahrada</li>\r\n<li><strong>Swim-up pokoj:</strong> sdílený bazén, osuška na pláž zdarma</li>\r\n<li><strong>Rodinný pokoj, Výhled zahrada:</strong> oddělená ložnice a dvě jednolůžkové postele ve společné místnosti, velikost pokoje 43 m2, umístění v bungalovu</li>\r\n<li><strong>Rodinný pokoj, 2 ložnice, Výhled zahrada, Sdílený bazén:</strong> oddělená ložnice a dvě jednolůžkové postele ve společné místnosti, velikost pokoje 43 m2, sdílený bazén, umístění v bungalovu</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Široká a 2 km hotelová písečná pláž s pozvolným vstupem přímo u hotelu. Lehátka a slunečníky zdarma. Gazebo na pláži je hrazeno extra.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně formou bufetu (07.30-10.00 hod.)</li>\r\n<li>Brzká kontinentální snídaně (06.00-07.00 hod.) - nutná rezervace předem</li>\r\n<li>Snack restaurant(11.00-18.00 hod)</li>\r\n<li>Oběd formou bufetu (12.30-14.30 hod.)</li>\r\n<li>Večeře formou bufetu (19.00-21.30 hod.)</li>\r\n<li>Restaurace a la carte (večeře 2x za pobyt, rezervace nutná, pouze pro pobyty na 7 a více nocí) - restaurace Mediterranean, Italská a Řecká</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (10.00-24.00 hod.)</li>\r\n<li>Pool bar a plážový bar (10.00-18.00 hod.)</li>\r\n<li>Hlavní bar a Lounge bar (18.00-24.00 hod.)</li>\r\n<li>Restauraci RIZES mohou využívat hosté, kteří mají zamluvený tento typ pokoje: Swim-Up pokoj; Swim-up bungalow na pláži; Rodinný pokoj, sdílený bazén</li>\r\n</ul>\r\n<p><strong>All inclusive Dine Around (All inclusive Ultra)</strong></p>\r\n<ul>\r\n<li>Uvítací balíček po příjezdu: variace nealkoholických nápojů na pokoji (ovocné džusy, voda, víno), denní doplňování setu na přípravu kávy a čaje, denní kompletní úklid pokoje</li>\r\n<li>Snídaně formou bufetu (07.30-11.00 hod.)</li>\r\n<li>Oběd formou bufetu (11.00-16.00 hod.)</li>\r\n<li>Večeře formou bufetu (19.00-22.00 hod.)</li>\r\n<li>Snack restaurant (11.00-18.00 hod.)</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (10.00-24.00 hod.)</li>\r\n<li>Pool bar a plážový bar (10.00-18.00 hod.)</li>\r\n<li>Hlavní bar a Lounge bar (18.00-24.00 hod.)</li>\r\n<li>Ala Carte restaurace - večeře po předchozí rezervaci (19.00-24.00 hod.)</li>\r\n<li>Set na přípravu kávy a čaje</li>\r\n<li>Restaurace à la carte (večeře 2x za pobyt, rezervace nutná, pouze pro pobyty na 7 a více nocí)</li>\r\n<li>Set pro přípravu kávy a čaje na pokoji</li>\r\n<li>20% sleva na ala carte hotelové restaurace</li>\r\n<li>20% sleva na wellness procedury (nutné rezervovat předem na recepci - vstup povolen pouze osobám starším 16 let)</li>\r\n<li>50% sleva na vína z vinného listu v ala carte resturaci</li>\r\n<li>1x za pobyt na dobu 1 hod. zdarma vybrané vodní sporty (nutné se informovat na recepci hotelu)</li>\r\n</ul>\r\n<p>Uvedené časy jsou orientační, upřesněny budou na hotelové recepci.<br />V restauracích vyžadováno smart-casual oblečení, zakázán je vstup v plavkách.<br />Ztráta hotelového all-inclusive náramku a následné vydání nového je zpoplatněno.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p><strong>Zdrama:</strong> 4 tenisové kurty (hodina denně, osvětlení a vybavení za poplatek), stolní tenis, basketbal, fotbal, plážový volejbal, fitness, plavecký bazén, omezená nabídka vodních sportů</p>\r\n<p><strong>Za poplatek:</strong> půjčovna kol, vodní sporty na pláži, cvičení s trenérem, sauna, wellness centrum</p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>Animační programy pro děti i dospělé</li>\r\n<li>Minidisko pro děti</li>\r\n<li>Taneční soutěže</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětská postýlka zdarma, dětská stolička v hlavní restauraci, dětský bufet, 2 venkovní hřiště, 2 dětské bazény, tobogán, k zapůjčení sterilizátor a ohřívač dětských lahví za poplatek.</p>\r\n<p><strong>Animační program Funtazie klubu v termínu 23.6. - 5.9.2027 </strong>(neplatí pro produkt Fischer Dynamix)</p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<p>Royal Olympian Spa &amp; Thalasso Centrum</p>\r\n<p><strong>Za poplatek:</strong>&nbsp;sauna, masáže, salón krásy a procedury ve spa&nbsp;centru.</p>"}, {"code": "ABOUT_HOTEL", "title": "Pro handicapované", "text": "<ul>\r\n<li>bezbariérový vstup do hlavní budovy a restaurace</li>\r\n<li>prostorné pokoje, které ale nejsou označeny jako bezbariérové</li>\r\n<li>při vstupu na pláž pár schodů</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>minilednička zdarma</li>\r\n<li>lehátka a slunečníky na pláži zdarma - Gazebo za poplatek</li>\r\n<li>domácí mazlíčci nejsou povoleni</li>\r\n<li>trezor na pokoji zdarma</li>\r\n<li>dětská postýlka zdarma</li>\r\n<li>plážové osušky zdarma</li>\r\n<li>klimatizace zdarma</li>\r\n<li>bezlepková a bezlaktozová strava možná</li>\r\n<li>plně vybavené kongresové centrum - několik konferenčních center</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma:</strong> WiFi na veřejných místech i na pokojích</p>\r\n<p>&nbsp;</p>"}, {"code": "WEB", "title": "Web", "text": "https://www.aldemarolympianvillage.gr/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Pelopones", "url": "https://www.eximtours.cz/recko/pelopones-kalamata"}, {"name": "Skafidia", "url": "https://www.eximtours.cz/recko/pelopones/skafidia"}]}}</script></div></html>
