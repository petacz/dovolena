<html><h1>VOI BAIA DI TINDARI RESORT</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 20669, "name": "VOI BAIA DI TINDARI RESORT", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Rozlehlý resort VOI Baia di Tindari se nachází v krásné části severního pobřeží, lemovaný piniovo-eukalyptovým hájem. Hotel je vhodný pro rodiny s dětmi, které vyhledávají klidné prostředí. Poloha hotelu je ideální k výletům do měst i přírody v okolí. Největší předností hotelu je krásná pláž, vzdálena několik kroků od resortu. Samozřejmostí jsou bazény pro děti i dospělé. Hotel se chlubí kvalitními dětskými kluby pro děti všech věkových kategorií.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 150 m u pláže</li><li>letiště: 165 km Catania</li><li>centra: 30 km Milazzo, 14 km Barcellona Pozzo di Gotto</li><li>nákupních možností: 3000 m</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>TV</li>\r\n<li>telefon</li>\r\n<li>trezor (zdarma)</li>\r\n<li>minibar (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>pokoje se mohou nacházet v hlavní budově nebo v menších budovách v zahradě</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Rodinný pokoj:</strong> prostornější, ložnice a obývací část, blíže k moři, mezonet (schody)</li>\r\n<li><strong>Čtyřlůžkový pokoj:</strong> jedna místnost, možnost přistýlky</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>grill-pizzeria (rezervace nutná, cca od poloviny června do poloviny září)</li>\r\n<li>bar</li>\r\n<li>bazén</li>\r\n<li>2x dětský bazén</li>\r\n<li>konferenční místnost</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>miniklub (pro děti ve věku 4-18 let)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá</li>\r\n<li>lehátka a slunečníky zdarma (1 slunečník a 2 lehátka/pokoj) od 3. řady</li>\r\n<li>osušky zdarma, výměna za poplatek</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>tenisový kurt (osvětlení za poplatek)</li>\r\n<li>minifotbal</li>\r\n<li>plážový volejbal</li>\r\n<li>hřiště na padle (vybavení za poplatek)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": " <ul><li>SPA centrum</li><li>tenisové lekce</li><li>canoeing</li></ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>10.00-24.00, zahrnuje snídaně, obědy a večeře formou bufetu, během jídla nealkoholické nápoje, víno a pivo, během dne lehké občerstvení ve vybrané časy. Neomezené množství rozlévaných nealkoholických a vybraných alkoholických nápojů místní výroby (10.00–24.00)</li>\r\n<li>V baru na pláži vybrané nealkoholické nápoje.</li>\r\n<li>Lze čerpat v místech a časech určených hotelem.</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Pobytová taxa cca 4,5 EUR/os/noc splatná v hotovosti v destinaci.&nbsp;<br />V hotelovém bazénu je&nbsp;vyžadována koupací čepice."}], "destination": [{"name": "Itálie", "url": "https://www.eximtours.cz/italie"}, {"name": "Sicílie", "url": "https://www.eximtours.cz/italie/sicilie"}, {"name": "Patti Gulf - Mesina", "url": "https://www.eximtours.cz/italie/sicilie/patti-gulf-mesina"}]}}</script></div></html>
