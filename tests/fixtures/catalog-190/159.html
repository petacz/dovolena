<html><h1>IFA Altamarena by Lopesan</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1602, "name": "IFA Altamarena by Lopesan", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel se nachází v překrásné lokalitě centra letoviska Morro Jable/ Playa de Jandía přímo u krásné několik km dlouhé písečné pláže, která vybízí k procházkám po břehu moře. V pěší vzdálenosti od hotelu nákupní i zábavní možnosti.&nbsp;</p>\r\nLetiště Fuerteventura je ve vzdálenosti cca 85 km."}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>225 pokojů, 3 patra. Vstupní hala s recepcí, bar, restaurace. V zahradě 2 bazény (jeden v zimních měsících s možností klimatizace/vyhřívání), terasa s lehátky a slunečníky zdarma, osušky za poplatek.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, trezor za poplatek, TV/sat., telefon, balkon nebo terasa.</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled</strong>: výhled (na bazén či do zahrady)</li>\r\n<li><strong>Dvoulůžkový pokoj, Eco:</strong> horší umístění</li>\r\n<li><strong>Dvoulůžkový pokoj, yield: </strong>jiné cenové rozlišení&nbsp;</li>\r\n<li><strong>Rodinný pokoj</strong>: prostornější, rozkládací sofa.</li>\r\n<li><strong>Rodinný pokoj, Pool front:</strong> prostornější, rozkládací sofa, výhled bazén.</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Příležitostné animační programy pro děti i dospělé.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>Viz program all inclusive.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Dlouhá písečná pláž Playa Jandía cca 150 m, lehátka a slunečníky za poplatek.<br /><br />Upozornění: po bouři Therese byla zasažena pláž Jandía, aktuálně se zde nachází větší množství kamenů.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p><strong>Zdarma</strong>: stolní tenis, šipky, aerobik.</p>  <p><strong>Za poplatek</strong>: biliár, tenis, vodní sporty na pláži.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazének (možnost klimatizace/vyhřívání), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "ALL_INCLUSIVE", "title": "All inclusive", "text": "<strong>All inclusive</strong>\r\n<ul>\r\n<li>snídaně, oběd a večeře formou bufetu</li>\r\n<li>lehký snack během dne (sendviče, zmrzlina, sladké pečivo)</li>\r\n<li>vybrané alkoholické a nealkoholické nápoje místní výroby (11.00-23.00 hod.)</li>\r\n</ul>\r\n<strong>All inclusive premium</strong><br />\r\n<ul>\r\n<li>rozšířená nabídka značkových alkoholických a nealkoholických nápojů</li>\r\n</ul>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "WEB", "title": "Web", "text": "https://www.lopesan.com/en/hotels/spain/fuerteventura/jandia/ifa-altamarena/"}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Za poplatek</strong>: WiFi ve společných prostorách.</p>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p><strong>Oficiální třída</strong>: ****<br />Do 31.5.26 je jeden z bazénů v rekonstrukci, klienti mohou využívat ostatní bazény.<br /><br /></p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Fuerteventura", "url": "https://www.eximtours.cz/spanelsko/fuerteventura"}, {"name": "Jandía", "url": "https://www.eximtours.cz/spanelsko/fuerteventura/jandia"}]}}</script></div></html>
