<html><h1>Cavo Maris Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 775, "name": "Cavo Maris Beach", "description": [{"code": null, "title": "Poloha", "text": "<p>V klidné poloze cca 1 500 m od centra Protaras (pravidelné autobusové spojení) v krásné udržované zahradě. Obchody, restaurace, taverny, lékárna, bankomat v centru Protarasu. Autobusová zastávka 150m od hotelu (spojení Protaras, Ayia Napa).</p>\r\n<p>&nbsp;</p>\r\nLetiště Larnaca je vzdáleno 64 km od hotelu."}, {"code": null, "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, lobby bar, místnost s TV, hlavní restaurace s terasou, několik restaurací a la carte, kavárna, obchod se suvenýry, kadeřnictví, spa centrum, konferenční místnost, sushi bar (za poplatek).<br />Venku bazén, dětské brouzdaliště, bar u bazénu a Gelateria, terasa na slunění, lehátka a slunečníky zdarma, osušky oproti kauci.</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Superior</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, telefon, TV/sat., rádio, termoska s pitnou vodou, minibar za poplatek, lednička, trezor, balkon; při obsazenosti 2 dospělí a 2 děti – palanda, velikost pokoje 21 m2.<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled směrem k moři</strong>: výhled směrem k moři.</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled na moře</strong>:&nbsp; výhled na moře.</li>\r\n<li><strong> Rodinný pokoj, Superior, Výhled směrem k moři</strong>:&nbsp; ložnice oddělená posuvnými dveřmi, 4 pevná lůžka, velikost pokoje 25 m2.</li>\r\n<li><strong>Rodinný pokoj, Superior, Výhled na moře</strong>: ložnice oddělená posuvnými dveřmi, 4 pevná lůžka, velikost pokoje 25 m2. výhled na moře.</li>\r\n<li><strong>Rodinný pokoj mezonet:</strong> ložnice v 1. patře.&nbsp;</li>\r\n<li><strong>Rodinný pokoj, Premier, Výhled moře: </strong>výhled moře, oddělená ložnice zatahovacími dveřmi, velikost pokoje 31m2.</li>\r\n<li><strong>Suite Elite:</strong> výhled moře nebo strana k moři, 5. patro, luxusnější vybavení, rozkládací pohovka.</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Přímo u písečné pláže (pro vstup do moře doporučujeme obuv), lehátka a slunečníky za poplatek, osušky oproti kauci.</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Stravování", "text": "<strong>Polopenze</strong><br /><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu.&nbsp;</li>\r\n</ul>\r\n<strong>All inclusive</strong><br /><br /><br />\r\n<ul>\r\n<li>Snídaně formou bufetu (07.15–10.00 hod.)</li>\r\n<li>Oběd formou bufetu (13.00–15.30 hod.)</li>\r\n<li>Večeře formu bufetu (19.00–21.30 hod.)</li>\r\n<li>Občerstvení během dne</li>\r\n<li>Nealkoholické a alkoholické nápoje místní výroby (10.00–24.00 hod.)</li>\r\n<li>Odpolední káva, čaj, sušenky (15.00–18.30 hod.)</li>\r\n</ul>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\r\n<p><strong>Program Ultra All inclusive: </strong></p>\r\n<ul>\r\n<li><strong>Využití a lá carte restaurací (13.00-22.00 hod)</strong></li>\r\n<li><strong>Rozšířená nabídka alkoholických nápojů místní a zahraniční výroby v 5ti barech</strong></li>\r\n</ul>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma:</strong> tenis, stolní tenis, šipky, basketbal.</li>\r\n<li><strong>Za poplatek:</strong> vodní sporty na pláži, výuka potápění, biliár, půjčovna kol</li>\r\n</ul>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Zábava", "text": "<p>Pravidelné zábavné večery s tancem a animační programy.</p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Děti", "text": "<ul>  <li> Dětská postýlka zdarma, dětská stolička v hlavní restauraci, dětské menu v restauraci, dětský bazén, dětské hřiště.</li>  </ul>"}, {"code": null, "title": "Wellness", "text": "<ul>\r\n<li>Spa centrum</li>\r\n<li><strong>Za poplatek:</strong> jacuzzi,&nbsp;&nbsp; sauna, pára, masáže.</li>\r\n<li><strong>Zdarma:</strong> fitness, vnitřní bazén</li>\r\n</ul>"}, {"code": null, "title": "Pro handicapované", "text": "<p>Na vyžádání několik pokojů přizpůsobených pro handicapované klienty. Na pláži rampa pro vstup do moře.</p>"}, {"code": null, "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi v&nbsp;celém areálu hotelu.</li>\r\n<li><strong>Za poplatek:</strong> internetový koutek.</li>\r\n</ul>"}, {"code": null, "title": "Web", "text": "http://www.cavomaris.com"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li><strong>4 hvězdičky</strong></li>\r\n</ul>\r\n<p><strong>&nbsp;</strong></p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Paphos je vzdáleno 178 km od hotelu."}], "destination": [{"name": "Kypr", "url": "https://www.eximtours.cz/kypr"}, {"name": "Jižní Kypr", "url": "https://www.eximtours.cz/kypr/jizni-kypr"}, {"name": "Protaras", "url": "https://www.eximtours.cz/kypr/jizni-kypr/protaras"}]}}</script></div></html>
