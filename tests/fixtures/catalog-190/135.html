<html><h1>Sol Principe</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 180, "name": "Sol Principe", "description": [{"code": null, "title": "Poloha", "text": "<p>Hotelový komplex Sol Principe se nachází přímo u pláže Playamar, za pobřežní promenádou a místní komunikací,&nbsp; centrum střediska Torremolinos cca 2 km, Malaga cca 15 km, letiště cca 6 km. Nejbližší nákupní možnosti, restaurace a bary cca 150 m od hotelu.</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, výtah, restaurace, bary, kavárna, obchod se suvenýry, boutique, kadeřnictví, salon krásy, konfereční sály. Venku velký bazén ve stylu karibské laguny, bazén má i bublinkové hydromasážní lehátka, terasa s lehátky a slunečníky zdarma, osušky k bazénu za kauci, snack bar u bazénumístnost pro uskladnění kol v hotelu, zahrada.</p>"}, {"code": null, "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj:</strong> koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., trezor za poplatek, minilednička, balkón nebo terasa.</li>\r\n<li><strong>Dvoulůžkový pokoj boční výhled moře</strong> viz Dvoulůžkový pokoj, boční výhled na moře.</li>\r\n<li><strong>Jednolůžkový pokoj</strong>: viz Dvoulůžkový pokoj, menší pokoj, případně za poplatek boční výhled moře.</li>\r\n</ul>"}, {"code": null, "title": "Zábava", "text": "<p>Denní i večerní animační programy, oblíbené večerní show.</p>"}, {"code": null, "title": "Stravování", "text": "<strong>Polopenze:</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu. Možnost dokoupení programu all inclusive.</li>\r\n</ul>\r\n<strong>All inclusive:</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (10.00–24.00 hod.)</li>\r\n<li>Lehký snack během dne</li>\r\n<li>časy a místa All inclusive jsou určené hotelem a mohou se měnit.</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Pouze přes pobřežní komunikaci písečná pláž s pozvolným vstupem do moře, lehátka a slunečníky za poplatek.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma</strong>: fitness, stolní tenis, vnitřní bazén.</li>\r\n<li><strong>Za poplatek</strong>: biliár a herní zóna.</li>\r\n</ul>"}, {"code": null, "title": "Děti", "text": "<p>Dětský bazén, dětské hřiště, miniklub, hlídání dětí, animační program, dětská postýlka zdarma (na vyžádání).<br /><br /></p>"}, {"code": null, "title": "Karty", "text": "<p>VISA, EC/MC, AMEX, Diners Club.</p>"}, {"code": null, "title": "Web", "text": "http://www.melia.com"}, {"code": null, "title": "Handicap", "text": "<p>Bezbariérový pohyb v celém areálu, na vyžádání pokoje přizpůsobené pro handicapované klienty.</p>"}, {"code": null, "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>WiFi v celém areálu</li>\r\n<li><strong>Za poplatek:</strong>&nbsp; internetový koutek - počítače na mince</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "<p>Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": null, "title": "Oficiální kategorie", "text": "4 hvězdičky"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Andalusie", "url": "https://www.eximtours.cz/spanelsko/andalusie"}, {"name": "Torremolinos", "url": "https://www.eximtours.cz/spanelsko/andalusie/torremolinos"}]}}</script></div></html>
