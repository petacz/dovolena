<html><h1>Paradise Bay Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3313, "name": "Paradise Bay Resort", "description": [{"code": null, "title": "Poloha", "text": "<p>Nachází se v klidné oblasti Cirkewwa na severu ostrova.&nbsp;Centrum Melliehy s mnoha restauracemi, kavárnami a bary je vzdáleno cca 6 km. Před hotelem se nachází autobusová zastávka a přístav, odkud trajekt odjíždí na ostrov Gozo a lodní taxi na ostrov Comino.</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, 3 restaurace, bar, Wifi zdarma, 2 à la carte restaurace, kosmetika, konferenční místnosti. Venkovní 3 bazény (mořská voda), krytý bazén, bar u bazénu a terasa s lehátky a slunečníky zdarma, &nbsp;osušky proti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<p><strong>Dvoulůžkový pokoj ,výhled na moře: </strong>koupelna/WC (vysoušeč vlasů), centrální klimatizace, TV/sat., Telefon, mini lednice, trezor, set pro přípravu kávy a čaje, balkon.<br /><br /></p>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, pokoje mají výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, výhled na záliv: </strong>výhled na záliv Paradise</li>\r\n<li><strong>Junior Suite:</strong> prostorné apartmá, obývací prostor</li>\r\n</ul>"}, {"code": null, "title": "Zábava", "text": "<p>Animační programy během dne.</p>"}, {"code": null, "title": "Stravování", "text": "<p><strong>Bez Stravy<br /><br />Snídaně</strong> - snídaně formou bufetu.</p>\r\n<p><strong>Polopenze </strong>- snídaně a večeře formou bufetu. Voda, nealkoholické nápoje, točené pivo a víno jsou zahrnuty v ceně jídla.</p>\r\n<p><strong>Plná penze </strong>- Snídaně, obědy a večeře formou bufetu nebo výběr z jídelního lístku. V ceně jídla je zahrnuta voda, točené pivo, nealkoholické nápoje a víno.</p>\r\n<p>&nbsp;</p>"}, {"code": null, "title": "Pláž", "text": "<p>Malá písečná pláž (při vstupu do moře kameny) s výhledem na přístav, oddělená pouze silnicí (podchod), lehátka a slunečníky zdarma (omezený počet). Oblíbená a často navštěvovaná písečná pláž Paradise Bay s barem cca 900 m, lehátka a slunečníky za poplatek.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<p><strong>Za poplatek</strong>: tenis, škola potápění, biliár.</p>"}, {"code": null, "title": "Děti", "text": "<p>Brouzdaliště (mořská voda), hřiště, herna, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": null, "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": null, "title": "Wellness", "text": "<ul>\r\n<li>Vstup od 16 let</li>\r\n<li><strong>Zdarma:</strong> vnitřní bazén, sauna, vířivka.</li>\r\n<li><strong>Za poplatek:</strong> masáže a zkrášlující procedury.</li>\r\n</ul>"}, {"code": null, "title": "Web", "text": "http://www.paradise-bay.com/"}, {"code": null, "title": "Internet", "text": "<p><strong>Zdarma</strong>: WiFi v hotelu.</p>"}, {"code": null, "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": null, "title": "Poznámka", "text": "<p>V hotelu je vybírána místní Eco taxa 0,5 €/den (max. 5 €/os./pobyt) od 18 let. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.<br /><br />Hotel může vyžadovat zaplacení bezpečnostního depozitu při příjezdu.</p>"}], "destination": [{"name": "Malta", "url": "https://www.eximtours.cz/malta"}, {"name": "Ostrov Malta", "url": "https://www.eximtours.cz/malta/ostrov-malta"}, {"name": "Cirkewwa", "url": "https://www.eximtours.cz/malta/ostrov-malta/cirkewwa"}]}}</script></div></html>
