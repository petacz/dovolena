<html><h1>Iolida Beach Hotel</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 141189, "name": "Iolida Beach Hotel", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Hotel se nachází v centru letoviska Agia Marina, přímo u písečné pláže s pozvolným vstupem do moře. Hotel se skládá z několika budov a je rozdělen na dvě části. Jedna část je hned u moře a druhá je za pobřežní cestou, obě části hotelu jsou propojeny můstkem, který vede nad silnicí. Ubytování je poskytováno ve studiích a apartmánech, ve kterých nalznete kuchyňku. Nákupní možnosti, restaurace a bary naleznete v okolí hotelu."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláž: u pláže</li>\r\n<li>letiště: 22 km</li>\r\n<li>centrum: v centru</li>\r\n<li>nákupní možnosti: v okolí hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Studio:</strong> <br />\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>TV</li>\r\n<li>telefon</li>\r\n<li>trezor (zdarma)</li>\r\n<li>minilednička</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>varná konvice</li>\r\n<li>kuchyňka</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n</ul>\r\n<strong><br />Ostatní typy pokojů</strong>&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Studio, Výhled moře</strong></li>\r\n<li><strong>Apartmá, 1 ložnice:&nbsp;</strong>2 pokoje oddělené dveřmi</li>\r\n<li><strong>Apartmá, Výhled moře:&nbsp;</strong>2 pokoje oddělené dveřmi</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>2 bary u bazénu</li>\r\n<li>lobby bar</li>\r\n<li>2 venkovní bazény (lehátka a slunečníky zdarma)</li>\r\n<li>2 dětské bazény</li>\r\n<li>dětské hřiště</li>\r\n<li>konferenční místnost</li>\r\n</ul>"}, {"code": "BEACH", "tit
