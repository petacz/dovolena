<html><h1>Balansat Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 13038, "name": "Balansat Resort", "description": [{"code": null, "title": "Poloha", "text": "Plážový hotel v San Miguel cca 50 m od volně přístupné písečné pláže, obklopený borovicovými lesy. Turistické centrum v těsné blízkosti, město San Miguel vzdáleno cca 4 km. Nákupní možnosti, restaurace a bary přímo u hotelu. Letiště Ibiza je ve vzdálenosti cca 30 km. "}, {"code": null, "title": "Vybavení", "text": "7 budov, vstupní hala s recepcí, <span style=\"color: #404040; font-family: Verdana, sans-serif; font-size: 10.5pt; background-color: white;\">restaurace, bar, fitness, obchod se suvenýry. Venku 2 bazény (z toho jeden s <span style=\"color: #404040; font-family: Verdana, sans-serif; font-size: 10.5pt; background-color: white;\">hydromasáží</span> pouze pro dospělé (16+), bar u bazénu, terasa s lehátky a slunečníky zdarma, osušky oproti kauci, <span style=\"color: #404040; font-family: Verdana, sans-serif; font-size: 10.5pt; background-color: white;\">dětský bazén se splash vodními atrakcemi, dětské hřiště a miniklub.</span></span>"}, {"code": null, "title": "Pokoje", "text": "<strong>Junior Suite</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat. za poplatek, Wifi, minilednička, rychlovarná konvice, trezor za poplatek, telefon, ložnice a obývací část, balkon nebo terasa.<br /><br />Ostatní typy pokojů (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Apartmá, 1 ložnice, Superior</strong>: kuchyňský kout se základním vybavením.</li>\r\n<li><strong>Apartmá, 2 ložnice, Superior</strong>: kuchyňský kout se základním vybavením, 2 ložnice.</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "Písečná pláž přímo u hotelu. Lehátka a slunečníky za poplatek."}, {"code": null, "title": "Stravování", "text": "<p><strong>Polopenze s nápoji</strong></p>\r\n<ul>\r\n<li>Snídaně (8:00-10:30) a večeře (18:30-21:00) formou bufetu</li>\r\n<li>Nápoje u večeře zdarma (voda, vybrané nealkoholické nápoje, víno a pivo)</li>\r\n</ul>\r\n<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně (8:00-10:30), oběd (13:00-15:00) a večeře (18:30-21:00) formou bufetu</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje, káva, čaj, zmrzlina v baru u bazénu (11:00-23:00)</li>\r\n<li>Lehký snack a ovoce ve snack baru (11:00-18:00)</li>\r\n</ul>"}, {"code": null, "title": "Sportovní nabídka", "text": "<strong>Zdarma: </strong>fitness, volejbal, stolní tenis, aquaerobik.<br /><strong>Za poplatek: </strong>vodní sporty a potápění na pláži."}, {"code": null, "title": "Děti", "text": "<p style=\"background: white;\"><span style=\"font-size: 10.5pt; font-family: 'Verdana',sans-serif; color: #404040;\">Brouzdaliště, hřiště, water splash park s vodními atrakcemi a skluzavkami pro nejmenší, mini- a dětský klub. Dětská postýlka zdarma (na vyžádání).</span></p>"}, {"code": null, "title": "Pro handicapované", "text": "Na vyžádání několik pokojů přizpůsobených pro handicapované klienty. Bezbariérový pohyb v areálu hotelu, rampa do bazénu."}, {"code": null, "title": "Web", "text": "<a href=\"https://www.balansatresort.com/index.php\">https://www.balansatresort.com/index.php<br /><br /></a>"}, {"code": null, "title": "Internet", "text": "<strong>Zdarma: </strong>WiFi v hotelu."}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Ibiza", "url": "https://www.eximtours.cz/
