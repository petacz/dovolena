<html><h1>Emerald by Azul Collection</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 166005, "name": "Emerald by Azul Collection", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Nově zrekonstruovaný hotel Emerald je sesterským hotelem Azul Eco a nachází se na okraji letoviska Adelianos Kampos, nedaleko historického města Rethymno. Hotel má rodinnou atmosféru a nabízí ubytování v moderně a vkusně zařízených pokojích umístěných v několika hotelových budovách. Klienti mohou navíc využívat tobogány a All Inclusive v hotelu Azul Eco, kam je zajištěn hotelový shuttle bus zdarma. Pláž je vzdálena 100 metrů od hotelu, hotelová pláž je pak vzdálena cca 5km a jsou zde pro klienty k dispozici lehátka a slunečníky zdarma, plážový bar v rámci All Inclusive a také hotelový shuttle bus zdarma. Hotel doporučujeme všem věkovým kategoriím a rodinám s dětmi."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m / 5 km</li>\r\n<li>letiště: 74 km Heraklion / 74 km Chania</li>\r\n<li>centra: 2 km Adelianos Kampos / 7 km Rethymno</li>\r\n<li>nákupních možností: 2 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj:</strong><br />\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>minilednička</li>\r\n<li>kouplena/WC (vysoušeč vlasů)</li>\r\n<li>telefon</li>\r\n<li>trezor (zdarma)</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka zdarma&nbsp;</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong>&nbsp;(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Suita:&nbsp;</strong>ložnice a obývací pokoj oddělený dveřmi</li>\r\n<li><strong>Mezonet:&nbsp;</strong>ložnice v patře, přistýlky v přízemí</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>bar</li>\r\n<li>bazén se sladkou vodou (lehátka a slunečníky zdarma, osušky za poplatek cca 2 EUR + vratnou zálohu cca 10 EUR)</li>\r\n<li>dětský bazén</li>\r\n<li>sprcha a převlékárna</li>\r\n<li>dětské hřiště</li>\r\n<li>miniklub</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písečná pláž s oblázky cca 100 m od hotelu (přes pobřežní komunikaci). Doporučujeme obuv do vody.</li>\r\n<li>hotelová písečná pláž vzdálena cca 5 km od hotelu: shutlle bus zdarma (jezdí cca 5x denně v čase 10.30-18.00, přesný rozpis na recepci hotelu), All Inclusive bar, lehátka a slunečníky zdarma.</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive:<br /></strong>\r\n<ul>\r\n<li>snídaně 7.30-10.00, oběd 13.00-14.30 a večeře 19.00-21.00 formou bufetu, zmrzlina</li>\r\n<li>vybrané místní alkoholické a nealkoholické nápoje, káva, čaj, pivo, víno (10.00-23.00)</li>\r\n<li>lehké občerstvení 10.00-18.00</li>\r\n<li>možnost využívat All Inclusive (bary a restauarce) v sesterském hotelu Azul Eco</li>\r\n<li>Bar na pláži: lehké občerstvení, nealkoholické nápoje, pivo, víno, vybrané alkoholické nápoje</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>stolní tenis</li>\r\n<li>šipky</li>\r\n<li>volejbal</li>\r\n<li>tobogány v sesterském hotelu Azul Eco</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>kulečník</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>animační programy</li>\r\n<li>večerní programy</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>\r\n<p><strong>Zdarma:</strong> Wi-Fi v celém areálu hotelu.</p>\r\n</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<p>https://azulecohotel.com/index.php/emerald/</p>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Adelianos Kampos", "url": "https://www.eximtours.cz/recko/kreta/adelianos-kampos"}]}}</script></div></html>
