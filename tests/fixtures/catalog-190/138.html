<html><h1>Grupotel Flamingo Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2862, "name": "Grupotel Flamingo Beach", "description": [{"code": null, "title": "Obecný popis:", "text": "Přímo u veřejné písečné pláže \"Playa flamingo\" v Playa Blanca leží plážový hotel Grupotel Flamingo Beach. Do turistického centra se dostanete po cca 2 km. Město Puerto del Carmen je vzdáleno asi 27 km (Arrecife asi 43 km). Nejbližší nákupní možnosti najdete ve vzdálenosti 1 km od Vašeho ubytování., supermarket najdete ve vzdálenosti cca 501 m. Do nejbližších restaurací a barů se dostanete také po cca 1 km. Nejbližší diskotéka se nachází ve vzdálenosti cca 2 km. O Vaši mobilitu se postará půjčovna automobilů. Letiště Lanzarote je ve vzdálenosti cca 37 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento hotel disponuje celkem 303 pokoji. K vybavení hotelu patří recepce (přihlášení je možné od 15:00 hodin, odhlášení do 11:00 hodin), lobby, sejf (zdarma), malý obchod, parkoviště (zdarma) a možnost vyměnit peníze. Wi-Fi je hotelovým hostům k dispozici zdarma. Zdravotní služba je za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří 5 bazénů a dětský bazének. Zde jsou k dispozici lehátka (případně za poplatek). "}, {"code": null, "title": "Stravování:", "text": "All inclusive: snídaně, obědy a večeře. K dispozici jsou také dětské menu. Voda v určitých hodinách. "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: tenis (případně za poplatek) a fotbal. Půjčovna kol. Nabídka wellness: sauna, hamam a masáže případně za poplatek. Zábava pro dospělé: animační program. Dětské hřiště. Hlídání dětí: miniklub. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina, němčina a španělština. Kreditní karty: Euro/MasterCard, EC karta, American Express a Visa. "}, {"code": null, "title": "1 ložnice Apartment (Balkón Nebo Terasa):", "text": "Pokoje jsou vybavené jedním lůžkem, dětskou postýlkou (zdarma), kuchyňským koutem, balkónem nebo terasou, internetem (zdarma), sejfem (zdarma) a satelit.TV s místními kanály a také centrálně řízenou klimatizací. Ručníky jsou měněny 1x za týden. Velikost: cca 40 m². "}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Lanzarote", "url": "https://www.eximtours.cz/spanelsko/lanzarote"}, {"name": "Playa Blanca", "url": "https://www.eximtours.cz/spanelsko/lanzarote/playa-blanca"}]}}</script></div></html>
