<html><h1>Globales Almirante Farragut</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1796, "name": "Globales Almirante Farragut", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Na západním pobřeží v klidné lokalitě střediska Cala’n Forcat. Historické městečko Ciutadella cca 5 km. Zastávka linkového autobusu v blízkosti hotelu. Obchody, restaurace a bary cca 10 minut chůze od hotelu. Letiště cca 50 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>493 pokojů, 5 pater, vstupní hala s recepcí, výtahy, hlavní restaurace, několik barů (vč. večerního baru pouze pro dospělé), společenská místnost s TV/sat., obchod se suvenýry, minimarket, 2 konferenční sály. Venku 2 bazény (se slanou vodou), snack bar u bazénu a terasy na slunění s lehátky, slunečníky a osuškami zdarma.</p>\r\n<p>Za příplatek možnost vstupu do aquaparku Aqua Center Menorca, vzdáleného cca 900 m, za výhodnější cenu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, TV/sat., trezor (za poplatek), set na přípravu kávy a čaje, minilednička, telefon, balkon nebo terasa.<br /><br />\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Rodinný pokoj</strong>: prostornější.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Malá písečná pláž v zálivu cca 50 m, přímo u hotelu možnost koupání ze skal a betonových plat, terasy na slunění a schůdky do moře. Další písečná pláž v zálivu Cala’n Blanes cca 1 km, dostupní pěší procházkou.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>Polopenze</strong></p>\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně (7:30-10:00), oběd (13:00-15:00) a večeře (19:30-22:00) formou bufetu, k jídlu voda, vybrané nealkoholické nápoje, stolní víno a pivo</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje místní výroby, pivo, víno, sangria (10:00-24:00)</li>\r\n<li>Lehký snack, káva, čaj během dne (10:30-18:00), večerní snack (22:30-24:00)</li>\r\n<li>Upozornění: výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit</li>\r\n</ul>\r\nBezlepkovou / bezlaktózovou stravu nutno vyžádat.<br />\r\n<p>&nbsp;</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Zdarma:</strong> stolní tenis,&nbsp;pétanque, aerobik, volejbal, lukostřelba a další sporty&nbsp;v rámci animačních programů.<br /><strong>Za poplatek:</strong> fitness,&nbsp;biliár, tenis (tvrdý povrch), minigolf, multifunkční&nbsp;hřiště, půjčovna kol, vodní sporty a potápěčská&nbsp;škola na pláži, golfové hřiště cca 35 km."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní i večerní animační programy pro děti i dospělé.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Oddělené dětské brouzdaliště, dětské hřiště, miniklub (5–12 let), herní zóna. Dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "NOTE", "title": "Pro handicapovené", "text": "Na vyžádání několik pokojů přizpůsobených pro handicapované klienty."}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "Za příplatek možnost vstupu do aquaparku Aqua Center Menorca, vzdáleného cca 900 m, za výhodnější cenu."}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma</strong>: WiFi v hotelu.<br /><strong>Za poplatek:</strong> internetový koutek v lobby."}, {"code": "WEB", "title": "Web", "text": "http://www.hotelesglobales.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Menorca", "url": "https://www.eximtours.cz/spanelsko/menorca"}, {"name": "Cala n Forcat", "url": "https://www.eximtours.cz/spanelsko/menorca/cala-n-forcat"}]}}</script></div></html>
