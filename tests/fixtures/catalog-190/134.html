<html><h1>Sol Fuerteventura Jandia - All suites</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1626, "name": "Sol Fuerteventura Jandia - All suites", "description": [{"code": null, "title": "Poloha", "text": "<p>V centru střediska Playa de Jandia s mnoha obchod, restauracemi a bary. Obchodní a zábavní centruj cca 200m. Původní rybářská vesnička Morro Jable s přístavem a typickými restauracemi cca 1,5 km. Letiště Fuerteventura je ve vzdálenosti cca 85 km. </p>"}, {"code": null, "title": "Vybavení", "text": "<p>Moderní kompletně renovovaný hotel, 294 pokojů, 3 dvoupatrové budovy, vstupní hala s recepcí, restaurace a bar. Venku bazén, terasa na slunění s lehátky a slunečníky zdarma.  Osušky oproti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<ul>\r\n<li><strong>Junior suita, 1 ložnice, výhled bazén:</strong> obývací pokoj a ložnice (odděleno zatahovacími dveřmi), koupelna/WC (vysoušeč vlasů), individuální klimatizace, telefon, TV/sat., trezor za poplatek, minibar (za poplatek), balkon nebo terasa, výhled bazén.</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Junior suita, 1 ložnice, výhled moře:</strong>&nbsp;výhled moře a bazén.</li>\r\n</ul>"}, {"code": null, "title": "Zábava", "text": "<p>Denní a večerní lehký animační program.</p>"}, {"code": null, "title": "Stravování", "text": "<p>Polopenze formou bufetu (u večeře v ceně pivo, víno, nealko), za příplatek all inclusive.</p>"}, {"code": null, "title": "Pláž", "text": "<p>Dlouhá bílá písečná pláž Jandía&nbsp; cca 150 m, lehátka a slunečníky za poplatek.<br />Upozornění: po bouři Therese byla zasažena pláž Jandía, aktuálně se zde nachází větší množství kamenů.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<p><strong>Zdarma:</strong> vodní aerobik.</p>"}, {"code": null, "title": "Děti", "text": "<p>Bazén (možnost vyhřívání/klimatizace), dětská postýlka zdarma (na vyždání).</p>"}, {"code": null, "title": "All inclusive", "text": "<ul>\r\n<li>Snídaně (08:00-10.00 hod.), lehký oběd (13.00-15.00 hod.) a večeře formou bufetu (18.00-21.00 hod.)</li>\r\n<li>Občerstvení v baru u bazénu (10.30-17.45 hod.), pizza, sendviče, burgery, párek v rohlíku.</li>\r\n<li>Nealkoholické a alkoholické nápoje místní výroby&nbsp;(10.30-23.00 hod.)</li>\r\n</ul>"}, {"code": null, "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": null, "title": "Web", "text": "https://www.melia.com/"}, {"code": null, "title": "Poznámka", "text": "<p>Autobus při transferu aktuálně nemůže zajet přímo k hotelu kvůli opravě místní komunikace. Transfery budou realizovány cca 200 m od hotelu.</p>"}, {"code": null, "title": "Internet", "text": "<p><strong>Zdrama:</strong> Wifi na pokoji.</p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Fuerteventura", "url": "https://www.eximtours.cz/spanelsko/fuerteventura"}, {"name": "Jandía", "url": "https://www.eximtours.cz/spanelsko/fuerteventura/jandia"}]}}</script></div></html>
