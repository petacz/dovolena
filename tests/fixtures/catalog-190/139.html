<html><h1>Evita Bay </h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3882, "name": "Evita Bay ", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>1,5 km od centra letoviska Faliraki přímo u dlouhé písečné pláže. V okolí taverny, restaurace, bary a obchody. Zastávka autobusu (spojení s městy Lindos, hlavní město Rhodos cca 12 km). Aquapark cca 2,5 km od hotelu. Mezinárodní letiště Rhodos je 16 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>145 pokojů, vstupní hala s recepcí, lobby, restaurace, bar. Hotelový resort se skládá z 8 budov, zahradě 4 bazény, bar u bazénu, lehátka a slunečníky u bazénu zdarma, osušky oproti kauci. Možnost návštěvy největšího veřejného aquaparku na ostrově (cca 2,5 km, za poplatek).</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj:</strong> koupelna/WC (vysoušeč vlasů, na vyžádání na recepci), TV/sat., klimatizace, minilednička, trezor za poplatek, balkon nebo terasa.&nbsp;<br /><br /><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:</strong> výhled moře</li>\r\n<li><strong>Dvoulůžkový pokoj, Sdílený bazén:</strong> sdílený bazén, terasa,&nbsp; <strong>děti pouze v doprovodu dospělé osoby 18</strong>+</li>\r\n<li><strong>Čtyřlůžkový pokoj: </strong>jedna místnost, přistýlka formou palandy (patrová postel)</li>\r\n<li><strong>Čtyřlůžkový pokoj, Výhled moře: </strong>výhled moře<strong>, </strong>jedna místnost, přistýlka formou palandy (patrová postel)</li>\r\n<li><strong>Čtyřlůžkový pokoj, Sdílený bazén:</strong> sdílený bazén, přistýlka formou palandy (patrová postel), terasa,&nbsp;<strong>děti pouze v doprovodu dospělé osoby 18</strong>+</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Dlouhá písečná pláž přímo u hotelu. Lehátka a slunečníky za poplatek. Osušky za mírný poplatek a oproti depozitu.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně formou bufetu (07.00–10.00 hod.)</li>\r\n<li>Oběd formou bufetu (12.30–14.30 hod.)</li>\r\n<li>Večeře formou bufetu (18.30–21.30 hod.)</li>\r\n<li>Zmrzlina během oběda a večeře</li>\r\n<li>Snack – sendviče, koláče, sušenky atd. (11.00–12.00, 17.00–18.00 a 22.00–23.00 hod.)</li>\r\n<li>Nealkoholické nápoje (10.00–23.00 hod.), víno a pivo&nbsp; (11.00-23.00 hod.), alkoholické nápoje (12.30-23.00 hod.)</li>\r\n<li>Bar mezi bazénem a pláží</li>\r\n<li>Možnost dětského menu</li>\r\n<li>Speciální diety na vyžádání</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Za poplatek:</strong> vodní sporty na pláži (poskytuje 3.strana)</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>V centru střediska Faliraki taverny, restaurace, bary a obchody. Největší aquapark ostrova cca 2,5 km (za poplatek).</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětská postýlka zdarma (na vyžádání).&nbsp;</p>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "Výborný poměr ceny a kvality v jednom z nejpopulárnějších středisek ostrova."}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi v lobby a na pokojích.&nbsp;</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<a href=\"https://evita-hotels.com/evita-bay/\">Evita Bay – Evita Hotels &amp; Resorts (evita-hotels.com)</a>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.&nbsp;</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Rhodos", "url": "https://www.eximtours.cz/recko/rhodos"}, {"name": "Faliraki", "url": "https://www.eximtours.cz/recko/rhodos/faliraki"}]}}</script></div></html>
