<html><h1>St. Constantin Beach Hotel & SPA Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 18989, "name": "St. Constantin Beach Hotel & SPA Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Přijemný rodinný hotelový komplex skládající se z několika budov se nachází v letovisku Gouves, na ideálním místě jen cca 100 metrů od písečné pláže. Svým klientům nabízí ubytování v komfortně zařízených pokojcíh v řeckém stylu, zábavu pro dospělé i děti, sportovní vyžití, ale také možnost relaxace. Doporučujeme všem věkovým kategoriím a rodinám s dětmi."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m</li>\r\n<li>letiště: 18 km</li>\r\n<li>centra: 500 m Gouves</li>\r\n<li>nákupních možností: v okolí hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj:</strong><br />\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>TV/Sat.</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>telefon</li>\r\n<li>minilednička</li>\r\n<li>varná konvice</li>\r\n<li>trezor (za poplatek cca 3 EUR/den)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka zdarma&nbsp;</li>\r\n<li>nezrekonstruované pokoje</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Rodinný pokoj, 1 ložnice:</strong> ložnice a obývací pokoj,&nbsp;nezrekonstruované pokoje</li>\r\n<li><strong>Dvoulůžkový pokoj, Superior: </strong>novější pokoje</li>\r\n<li><strong>Rodinný pokoj:</strong> ložnice a obývací pokoj,&nbsp;nezrekonstruované pokoje</li>\r\n<li><strong>Rodinný pokoj, Superior: </strong>ložnice a obývací pokoj, novější pokoje</li>\r\n<li><strong>Rodinná Suita, Soukromý bazén:</strong> ložnice a obývací pokoj, privátní bazén</li>\r\n<li><strong>Junior Suita: </strong>modernější vybavení</li>\r\n<li><strong>Junior Suita, Sdílený bazén: </strong>modernější vybavení, sdílený bazén</li>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>2x a la carte restaurace</li>\r\n<li>bar</li>\r\n<li>6 venkovních bazénů (lehátka a slunečníky zdarma, osušky za zálohu)</li>\r\n<li>2 dětské bazény</li>\r\n<li>vnitřní bazén</li>\r\n<li>skluzavky</li>\r\n<li>snack bar</li>\r\n<li>2 výtahy</li>\r\n<li>dětské hřiště</li>\r\n<li>dětský klub</li>\r\n<li>parkoviště</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá pláž s pozvolným vstupem přístupná přes místní nefrekventovanou komunikaci</li>\r\n<li>lehátka a slunečníky za poplatek, osušky za zálohu</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace \"Estia\": 7.25-10.30 snídaně, 12.30-14.30 oběd a 18.30-21.00 večeře formou bufetu. U snídaně nealkoholické nápoje, káva, čaj, u oběda a večeře nealkoholické nápoje, pivo, víno.</li>\r\n<li>A´la Carte restaurace (umístěna u pláže): 18.30-21.30 večeře, servírovaná (1x za pobyt po předchozí rezervaci), nápoje za poplatek</li>\r\n<li>Snack bar \"Calypso\" a \"Estia\": 10.00-19.00 nealkoholické nápoje, pivo, víno, káva, během dne lehké občerstvení, zmrzlina</li>\r\n<li>Bar u bazénu \"Dionysos\": 10.30-22.00 nealkoholické a alkoholické nápoje (rozlévané, místní výroby), pivo, víno</li>\r\n</ul>\r\n<strong>Upozornění:</strong>&nbsp;U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>stolní tenis</li>\r\n<li>posilovna</li>\r\n<li>skluzavky</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>kulečník</li>\r\n<li>vodní sporty na pláži</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>animační programy</li>\r\n<li>večerní programy</li>\r\n</ul>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>SPA centrum:</strong><br />\r\n<ul>\r\n<li>za poplatek</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>\r\n<p><strong>Za poplatek:</strong> Wi-Fi v celém areálu hotelu.</p>\r\n</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<p>https://stconstantin.gr/</p>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Gouves", "url": "https://www.eximtours.cz/recko/kreta/gouves"}]}}</script></div></html>
