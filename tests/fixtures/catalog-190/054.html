am pro děti. Herna. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Kreditní karty: American Express.  "}, {"code": null, "title": "Rodinný apartmán ", "text": "Pokoje jsou vybavené sejfem (za poplatek) a satelit.TV s plochou obrazovkou a také individuálně regulovatelnou klimatizací. "}, {"code": null, "title": "Dvoulůžkový pokoj standard ", "text": "Pokoje jsou vybavené sejfem (za poplatek) a satelit.TV s plochou obrazovkou a také individuálně regulovatelnou klimatizací. Nachází se v hl.budově. "}, {"code": null, "title": "Dvoulůžkový pokoj superior ", "text": "Pokoje jsou vybavené sejfem (za poplatek) a satelit.TV s plochou obrazovkou a také individuálně regulovatelnou klimatizací. Nachází se v oblasti Village. "}, {"code": null, "title": "Třílůžkový pokoj standard ", "text": "Pokoje jsou vybavené sejfem (za poplatek) a satelit.TV s plochou obrazovkou a také individuálně regulovatelnou klimatizací. Nachází se v hl.budově. "}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Andalusie", "url": "https://www.eximtours.cz/spanelsko/andalusie"}, {"name": "Torremolinos", "url": "https://www.eximtours.cz/spanelsko/andalusie/torremolinos"}]}}</script></div></html>
