<html><h1>Playamarina Hotel</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1573, "name": "Playamarina Hotel", "description": [{"code": null, "title": "Poloha", "text": "<p>Hotelový komplex v klidné oblasti menšího letoviska Isla Canela, původní rybářské vesničky. Malé nákupní centrum s přístavem cca 700 m, lodní spojení do města Isla Cristina. Přímo u hotelu supermarket.<br />Tradiční rybářská vesnice Punta del Moral s několika bary cca 800 m. Město Ayamonte cca 9 km, spojení linkovým autobusem (zastávka u hotelu). Letiště Faro je vzdáleno 75 km od hotelu.</p>"}, {"code": null, "title": "Vybavení", "text": "3 patrová budova se 142 pokoji, vstupní hala s receptí, výtahy, restaurace, bary, herna, obchod se suvenýry, úschovna zavazadel ,TV místnost, tělocvična, venkovní bazén se skluzavkou pro&nbsp; děti, terasa s lehátky a slunečníky zdarma, osušky oproti kauci, výměna za poplatek. SPA, Wellness centrum (vstup 15+ let) za poplatek."}, {"code": null, "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj:</strong> koupelna/WC (vysoušeč vlasů), klimatizace, stropní ventilátor, TV/sat., telefon, minibar za poplatek, trezor za poplatek, balkon nebo terasa. V pokojích jsou 2 lůžka široká 135 cm x 2 m.</li>\r\n<li><strong>Dvoulůžkový pokoj s bočním výhledem na moře:</strong> viz DR, boční výhled na moře.&nbsp;</li>\r\n<li><strong>Dvoulůžkový pokoj Superior s bočním výhledem na moře: </strong>viz DR, navíc je v pokoji župan a kosmetický balíček v koupelně.</li>\r\n<li><strong>Dvoulůžkový pokoj obsazený 1 osobou:</strong> viz DR, postel 135 cm x 2 m.</li>\r\n</ul>"}, {"code": null, "title": "Stravování", "text": "<p><strong>Polopenze plus:</strong></p>\r\n<ul class=\"f_list f_list--unordered\">\r\n<li class=\"f_list-item\">Snídaně a večeře formou bufetu, nápoje k jídlu (pivo, limo, víno)</li>\r\n</ul>\r\n<p><strong>All inclusive Premium:</strong></p>\r\n<ul class=\"f_list f_list--unordered\">\r\n<li class=\"f_list-item\">Snídaně, oběd a večeře formou bufetu</li>\r\n<li class=\"f_list-item\">Lehký snack během dne (mimo časy hlavních jídel)</li>\r\n<li class=\"f_list-item\">Tapas v baru u bazénu (12.00–15.00 hod.)</li>\r\n<li class=\"f_list-item\">Vybrané alkoholické a nealkoholické nápoje místní výroby (08.00–24.00 hod.)</li>\r\n<li class=\"f_list-item\">Dietní menu či bezlepková strava na vyžádání</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Písečná pláž s pozvolným vstupem do moře cca 100 m, přístup po dřevěných můstcích přes území chráněných dun. Lehátka a slunečníky za poplatek.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<ul>\r\n<li><strong>Zdarma:</strong> minigolf</li>\r\n<li><strong>Za poplatek:</strong> paddle, stolní tenis, šipky, půjčovna kol, golfové hřiště Isla Canela Golf Club cca 10 minut jízdy.</li>\r\n</ul>"}, {"code": null, "title": "Děti", "text": "<p>Hřiště, dětská postýlka zdarma (na vyžádání). Skluzavka pro děti u bazénu.</p>"}, {"code": null, "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": null, "title": "Web", "text": "http://www.playasenator.com"}, {"code": null, "title": "Oficiální kategorie", "text": "<p>4 hvězdičky</p>"}, {"code": null, "title": "Další příletová letiště", "text": "Letiště Malaga je vzdáleno 375 km od hotelu a letiště Jerez je vzdáleno 235 km od hotelu. </br>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa de La Luz", "url": "https://www.eximtours.cz/spanelsko/costa-de-la-luz"}, {"name": "Isla del Moral", "url": "https://www.eximtours.cz/spanelsko/costa-de-la-luz/isla-del-moral"}]}}</script></div></html>
