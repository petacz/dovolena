<html><h1>Garden Palace</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 5191, "name": "Garden Palace", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Menší hotel v zahradě je umístěný přímo v oblíbeném letovisku Laganas. Díky své poloze zhruba 500m od hlavní rušné třídy je vhodný jak pro páry, tak i rodiny s dětmi. Klienti zde ocení klidnější umístění, zároveň však v dosahu obchodů, restaurací i pláže."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 300m</li>\r\n<li>letiště: 7km</li>\r\n<li>centrum: 500m</li>\r\n<li>nákupní možnosti: 100m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj:</strong>&nbsp;<br />\r\n<ul>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>klimatizace zdarma</li>\r\n<li>trezor za poplatek (3e/den)</li>\r\n<li>minilednička</li>\r\n<li>telefon</li>\r\n<li>balkon nebo terasa</li>\r\n</ul>\r\n<ul>\r\n<li><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</li>\r\n</ul>\r\n<ul>\r\n<li><strong>Rodinný pokoj</strong>: jedna větší místnost, až pro 4 osoby.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>Lehátka a slunečníky u bazénu zdarma</li>\r\n<li>WiFi v lobby</li>\r\n<li>Recepce</li>\r\n<li>Restaurace v objektu(á la carte)</li>\r\n<li>Klimatizace</li>\r\n<li>Bar(y)</li>\r\n<li>Lobby</li>\r\n<li>Novelty</li>\r\n<li>Dětský bazén</li>\r\n<li>Dětská postýlka zdarma na vyžádání</li>\r\n<li>Venkovní bazén(y)</li>\r\n<li>Bar u bazénu</li>\r\n<li>Biliárd/kulečník</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písečná pláž cca 350 m</li>\r\n<li>lehátka a slunečníky na pláži za poplatek</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack během dne</li>\r\n<li>Nealkoholické a místní alkoholické nápoje&nbsp;</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>kulečník</li>\r\n<li>nemotorizované vodní sporty na pláži</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>možnost vyžití v centru letoviska Laganas (500m)</li>\r\n<li>nákupní možnosti přímo u hotelu, cca 100m</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<section class=\"mt-8\">\r\n<div>\r\n<div data-v-fdbe7602=\"\">\r\n<ul>\r\n<li>WiFi ve veřejných prostorech hotelu (zdarma)</li>\r\n</ul>\r\n</div>\r\n</div>\r\n</section>\r\n<section class=\"mt-8\"></section>"}, {"code": "WEB", "title": "Web", "text": "<section class=\"mt-8\">\r\n<div>\r\n<div data-v-fdbe7602=\"\">http://www.gardenpalacehotel.gr/</div>\r\n</div>\r\n<div>\r\n<div class=\"@container relative\">\r\n<div class=\"gap-4 flex items-stretch overflow-x-auto overflow-y-hidden select-none\">&nbsp;</div>\r\n</div>\r\n</div>\r\n</section>\r\n<section class=\"mt-8\"></section>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<section class=\"mt-8\">\r\n<div>\r\n<div data-v-fdbe7602=\"\">\r\n<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>\r\n</div>\r\n</div>\r\n</section>\r\n<section class=\"mt-8\"></section>"}, {"code": "NOTE", "title": "Poznámka", "text": "V Řecku je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Laganas", "url": "https://www.eximtours.cz/recko/zakynthos/laganas"}]}}</script></div></
