<html><h1>Diogenis Blue Palace</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2382, "name": "Diogenis Blue Palace", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel cca 16 km od letiště v Heraklionu, v letovisku Gouves, v okolí obchody, restaurace, taverny, centrum rušného letoviska Chersonissos cca 7 km.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, restaurace, lobby bar, minimarket. Venku bazén s oddělenou částí pro děti (se sladkou vodou), terasa na slunění, lehátka a slunečníky zdarma, osušky za zálohu (cca 10 EUR), bar u bazénu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: zrekonstruovaná koupelna/WC (vysoušeč vlasů), klimatizace, trezor na recepci (za poplatek cca 3 EUR/den), minilednička, TV/sat., telefon, balkon nebo terasa, varná konvice (na vyžádání, zdarma).<br />\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Promo</strong>: pod úrovní chodníku</li>\r\n<li><strong>Rodinný pokoj, Open Plan</strong>: jedna prostorná místnost, 4 pevná lůžka</li>\r\n<li><strong>Rodinný pokoj, Promo</strong>: pod úrovní chodníku</li>\r\n<li><strong>Rodinný pokoj, 1 ložnice</strong>: ložnice a dveřmi oddělený obývací pokoj s přistýlkami (klimatizace v každém pokoji)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s jemnými oblázky u hotelu (oddělená jen místní komunikací). Lehátka a slunečníky zdarma (omezené množství).</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All Inclusive:</strong></p>\r\n<ul>\r\n<li>Snídaně 8.00-10.15, oběd 12.30-14.30 a večeře 19.00-21.15 formou bufetu (1x týdně BBQ a krétský večer)</li>\r\n<li>Odpolední káva, čaj, zákusky</li>\r\n<li>Alkoholické a nealkoholické nápoje místní výroby (11.00–23.00 hod.)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<strong>Za poplatek:</strong> kulečník, masáže."}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Občas zábavné večery.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, dětská postýlka zdarma.</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<strong>Zdarma:</strong> Wi-Fi v lobby.<br /><strong>Za poplatek:</strong> internetový koutek v lobby."}, {"code": "WEB", "title": "Web", "text": "http://www.diogenysbluepalace.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": "DISTANCES", "title": "Další příletová letiště", "text": "Letiště Chania je vzdáleno 163 km od hotelu."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Gouves", "url": "https://www.eximtours.cz/recko/kreta/gouves"}]}}</script></div></html>
