<html><h1>Portes Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 145155, "name": "Portes Beach", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel v příjemném, klidném prostředí, umístěn do udržované zahrady. V blízkosti měst Nea Poteidaia (cca 2,5km) a Nea Moudania (cca 4,5km), kde se nachází bary, taverny a obchůdky, možnost využít zdarma dopravy hotelovým autobusem ve stanovených dnech v týdnu. Město Soluň (Thessaloniki) cca 70km (60 min. autem). Letiště Thessaloniki je vzdáleno 55 km od hotelu.&nbsp;</p>\r\n<p><strong>Oblast Chalkidiki.</strong></p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "195 pokojů, recepce, restaurace, taverna, bar, minimarket, diskotéka, business centrum za poplatek, konferenční prostory, prádelna za poplatek. V zahradě bazén, lehátka, slunečníky a osušky zdarma, bar u bazénu, hlavní bazén (09.00-18.00h.), splash park, dětské hřiště"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), individuálné ovládaná klimatizace, WiFi (zdarma), telefon, TV/sat., lednička, trezor za poplatek, balkon nebo terasa. Hotel zapůjčuje varnou konvici na vyžádání."}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž s pozvolným vstupem přímo u hotelu, lehátka a slunečníky zdarma. Pláž oceněna modrou vlajkou. Možnost výměny ručníků u pláže (10.00-14.00h.)</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně (07.30-10.00h.), oběd (12.30-15.00h.) a večeře (18.30-21.00h.) formou bufetu.&nbsp;</li>\r\n<li>Místní alkoholické a nealkoholické nápoje (10.00-24.00h.), mimo bary diskotéky</li>\r\n<li>zmrzlina pro děti&nbsp;(10.00-20.00h.)</li>\r\n<li>odpolední káva/čaj, moučníky (16.00- 17.00h.)</li>\r\n<li>studené snacky během celého dne (10.00-18.00h.)</li>\r\n<li>Lobby bar (17.00-24.00 hod.)</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p><strong>Zdarma:</strong> fitness, hromadné cvičení, aerobik, vodní aerobik, stoní tenis, boccia, kánoe, šlapadla<br /><strong>Za poplatek:</strong> vodní sporty na pláži, potápění, sauna</p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní a večerní animační programy.&nbsp;<br />Řecká noc (živá muzika a lidové tance) jednou týdně.<br />Živá hudba jednou týdně.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén s atrakcemi, hřiště, dětské hřiště, miniclub (4-12let), animační programy, hlídání dětí za poplatek, dětská postýlka zdarma (na vyžádání)</p>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<p>Za poplatek: sauna, pára, relaxační a léčebné procedury.&nbsp;</p>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<ul>\r\n<li>vstup do hlavní budovy řešen bezbariérově</li>\r\n<li>bezbariérový pohyb po areálu možný</li>\r\n<li>hotel nemá bezbariérové pokoje</li>\r\n<li>bezbariérový přístup na pláž i k bazénu (vstup do bazénu po schůdkách)</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>minilednička na pokoji zdarma</li>\r\n<li>lehátka a slunečníky na pláži zdarma</li>\r\n<li>domáci mazlíčci nejsou povoleni</li>\r\n<li>trezor na pokoji za poplatek</li>\r\n<li>dětská postýlka zdarma</li>\r\n<li>plážové osušky zdarma</li>\r\n<li>klimatizace na pokoji zdarma</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<p><strong>Zdarma:</strong> WiFi ve veřejných prostorách a na pokojích. </p>"}, {"code": "WEB", "title": "Web", "text": "https://www.portesbeach.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Chalkidiki a Olympská Riviéra", "url": "https://www.eximtours.cz/recko/chalkidiki"}, {"name": "Potidea", "url": "https://www.eximtours.cz/recko/chalkidiki/potidea"}]}}</script></div></html>
