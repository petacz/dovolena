<html><h1>Golden Acqua Salou </h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 7772, "name": "Golden Acqua Salou ", "description": [{"code": null, "title": "Obecný popis:", "text": "Plážový hotel Acqua Hotel Salou se nachází cca 107 km od Barcelona (Tarragona cca 12 km, Reus cca 9 km). Nejbližší písečná pláž leží cca 200 m od hotelu. Do turistického centra se dostanete po cca 300 m. Supermarket a jiné nákupní možnosti jsou ve vzdálenosti cca 300 m. Do nejbližších barů a restaurací se dostanete také po cca 300 m. Nejbližší diskotéka se nachází ve vzdálenosti cca 350 m. Další možnosti zábavy Vám během Vaší dovolené nabízí kino (cca 3 km). O Vaši mobilitu se postará stanoviště taxi (cca 350 m). Do vzdálenějších míst se můžete dostat z nádraží vzdáleného asi 6 km. Lékařskou pomoc najdete v případě potřeby v nemocnici, která se nachází ve vzdálenosti cca 12 km od hotelu. Letiště Reus je ve vzdálenosti cca 15 km. Další letiště Barcelona leží ve vzdálenosti cca 97 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento 7podlažní hotel disponuje celkem 95 pokoji. K vybavení hotelu patří recepce (přihlášení je možné od 14:00 hodin, odhlášení do 10:30 hodin), lobby, 2 výtahy, klimatizace a sejf (za poplatek). O blaho hostů se stará restaurace (klimatizovaná). Wi-Fi je hotelovým hostům k dispozici zdarma. Dále má hotel konferenční prostor s celkem 100 sedadly a připojením k internetu. Vozíčkářům nabízí hotel bezbariérový výtah a vstup a částečně bezbariérové koupelny. Úklid pokojů je zdarma. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení moderního hotelu patří bazén se sladkou vodou a integrovaný dětský bazének (s otevírací dobou od dubna do listopadu). Zde jsou k dispozici lehátka (zdarma). Osvěžující nápoje je možno dostat přímo v baru u bazénu. (otevřeno od 10:00 - 00:00). "}, {"code": null, "title": "Stravování:", "text": "Snídaně (08:00 - 10:00 hod.) formou bufetu. Polopenze: včetně
