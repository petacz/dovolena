én</li>\r\n<li><strong>Rodinný pokoj, Classic: </strong>jedna prostornější místnost</li>\r\n<li><strong>Rodinný pokoj, Classic, Výhled moře:&nbsp;</strong>jedna prostornější místnost</li>\r\n<li><strong>Rodinný pokoj, Classic, Venkovní Jacuzzi: </strong>jedna prostornější místnost, vířivka na terase/balkoně</li>\r\n<li><strong>Rodinný pokoj, Classic, Soukromý bazén: </strong>jedna prostornější místnost, privátní bazén</li>\r\n<li><strong>Suita, Venkovní Jacuzzi, Výhled moře: </strong>jedna prostornější místnost nebo dvě místnosti oddělené posuvnými dveřmi, vířivka na terase/balkoně</li>\r\n<li><strong>Suita, Venkovní Jacuzzi: </strong>jedna prostornější místnost nebo dvě místnosti oddělené posuvnými dveřmi, vířivka na terase/balkoně</li>\r\n<li><strong>Suita, Výhled do zahrady, Sdílený bazén:&nbsp;</strong>jedna prostornější místnost nebo dvě místnosti oddělené posuvnými dveřmi, přímý vstup do sdíleného bazénu</li>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Čtyřlůžkový pokoj, Classic: </strong>prostornější pokoj</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>lobby</li>\r\n<li>hlavní restaurace</li>\r\n<li>řecká a italská a´la carte restaurace</li>\r\n<li>lobby bar</li>\r\n<li>bar u bazénu</li>\r\n<li>bar u bázénu se skluzavkami</li>\r\n<li>venkovní bazén (lehátka, slunečníky a osušky zdarma)</li>\r\n<li>dětský bazén</li>\r\n<li>vodní park (malé i velké skluzavky/tobogány pro všechny věkové kategorie)</li>\r\n<li>Parkoviště (zdarma)</li>\r\n<li>dětské hřiště</li>\r\n<li>dětská klub</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá pláž</li>\r\n<li>přístupná přes místní nefrekventovanou komunikaci</li>\r\n<li>lehátka, slunečníky a osušky zdarma</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All Inclusive Premium:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace: snídaně, oběd a večeře formou bohatého bufetu. U snídaně f
