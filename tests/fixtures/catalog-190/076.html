<html><h1>Golden Donaire Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 146661, "name": "Golden Donaire Beach", "description": [{"code": null, "title": "Obecný popis:", "text": "Hotel se nachází přímo u písečné pláže s pobřežní promenádou. Zastávka autobusu se nachází 50 m od hotelu a můžete se tak dostat do Salou či Tarragony. Letiště Barcelona je vzdáleno 103 km od hotelu a letiště Reus 16 km."}, {"code": null, "title": "Vybavení:", "text": "Tento hotel Golden Donaire Beach, naposledy zrenovovaný v roce 2018, má 360 pokojů. V hotelu se nachází lobby, klimatizace a směnárna. O blaho hostů se starají 3 restaurace (klimatizované) a snack bar. Na Vaši návštěvu se budou těšit dva bary v hotelu. Wi-Fi je hotelovým hostům k dispozici zdarma. Vozíčkářům nabízí hotel bezbariérový výtah a vstup a částečně bezbariérové koupelny. Služba žehlení prádla a zdravotní služba jsou za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří bazén se sladkou vodou a samostatný dětský bazének. Zde jsou k dispozici lehátka (zdarma). Osvěžující nápoje je možno dostat přímo v baru u bazénu. "}, {"code": null, "title": "Stravování:", "text": "Snídaně formou bufetu. Polopenze: včetně snídaně a večeře. Plná penze zahrnuje snídaně, obědy a večeře. All inclusive: snídaně, obědy a večeře. Voda, nealkoholické nápoje, káva & čaj, dezerty & pečivo, pivo, víno, národní alkoholické nápoje a rychlé občerstvení v určitých hodinách. "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: fotbal, volejbal a stolní tenis (za poplatek). Půjčovna kol. Nabídka wellness: sauna zdarma. Zábava pro dospělé: animační program s večerní show. Hlídání dětí: animační program pro děti a miniklub pro děti od 4 - 12 let. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním
