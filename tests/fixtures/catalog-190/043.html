<html><h1>Pilot Beach Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1022, "name": "Pilot Beach Resort", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Tento pětihvězdičkový hotel leží na severozápadním pobřeží Kréty, v zátoce Almyros. V blízkosti najdete malebnou rybářskou vesnici Georgioupolis. Nabízí jedinečnou kombinaci tradice, pohostinnosti a luxusu s komfortem jednoho z modernějších hotelů. Resort se může pochlubit prostornými a luxusními prostory s krétskou architekturou. Písečná pláž v Georgioupolis nabízí krásný výhled na Egejské moře a Bílé hory. Doporučujeme všem věkovým kategoriím, rodinám s dětmi a také náročnějším klientům.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m u pláže</li>\r\n<li>letiště: 100 km Heraklion / 48 km Chania</li>\r\n<li>centra: 1 km</li>\r\n<li>nákupních možností: 1000 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Bungalov, Superior, Výhled zahrada</strong></p>\r\n<ul>\r\n<li>individuálně ovladatelná klimatizace</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>malá lednička nebo minibar (na vyžádání)</li>\r\n<li>varná konvice (k dispozici káva a čaj)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (zdarma)</li>\r\n<li>dětská postýlka zdarma</li>\r\n<li>balkon nebo terasa</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Bungalov, Superior, Výhled bazén</strong></li>\r\n<li><strong>Jednolůžkový pokoj (bungalov superior s výhledem do zahrady)</strong></li>\r\n<li><strong>Beach Bungalov, Výhled moře: </strong>pokoje blíže k moři, umístěné v části u pláže</li>\r\n<li><strong>Rodinná Junior Suite, 1 ložnice, Výhled na bazén nebo do zahrady: </strong>2 oddělené ložnice, 1 koupelna</li>\r\n<li><strong>Beach Bungalov, Výhled zahrada:</strong>&nbsp;pokoje umístěné v části u pláže</li>\r\n<li><strong>Beach Bungalov, Sea Front:</strong> pokoje umístěné v první řadě u pláže</li>\r\n<li><strong>Suite, Deluxe, 1 ložnice, Panoramatický výhled na bazén:</strong> ložnice a obývací část</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>3 tématické restaurace (řecká, italská a \"plody moře\")</li>\r\n<li>lobby bar</li>\r\n<li>bar u bazénu</li>\r\n<li>kavárna</li>\r\n<li>minimarket</li>\r\n<li>obchod se suvenýry</li>\r\n<li>minidiskotéka</li>\r\n<li>konferenční místnost</li>\r\n<li>4 bazény se sladkou vodou (lehátka a slunečníky zdarma)</li>\r\n<li>dětský bazén (malé skluzavky pro děti)</li>\r\n<li>dětské hřiště</li>\r\n<li>miniklub (pro děti 4–12 let)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>písčitá</li><li>oceněná Modrou vlajkou za čistotu</li><li>lehátka a slunečníky zdarma</li></ul>"}, {"code": "DINING", "title": "Strava ", "text": "<strong>Polopenze:&nbsp;</strong><br />\r\n<ul>\r\n<li>Snídaně (7.30-10.00) a večeře formou bufetu (18:30-21:30). Pro děti do 13 let je zajištěné celodenní (11.00-17.00) občerstvení v rámci polopenze - nápoje a lehké občerstvení. U večeře je vyžadováno formální oblečení.</li>\r\n</ul>\r\n<br /><strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li class=\"f_list-item\">Restaurace \"Kronos\": 7.00-11.00 snídaně a 18.30-21.30 večeře formou bufetu, během snídaně nealkoholické nápoje, voda, čaj, káva, u večeře nealkoholické nápoje, pivo, víno.</li>\r\n<li class=\"f_list-item\">Restaurace \"Ariadne\": 5.00-7.00 brzká snídaně, 12.30-15.30 oběd, 15.30-17.00 lehké občerstvení (sendviče, ovoce, zákusky, zmrzlina), 19.00-22.30 večeře formou bufetu, během snídaně nealkoholické nápoje, voda, čaj, káva, u večeře nealkoholické nápoje, pivo, víno.</li>\r\n<li class=\"f_list-item\">Restaurace u pláže \"Gialos\": 8.00-10.30 snídaně formou bufetu, 12.30-15.00 lehké občerstvení (sendviče, ovoce, zákusky, zmrzlina), 19.00-21.45 večeře formou bufetu (5x v týdnu, po předchozí rezervaci).</li>\r\n<li class=\"f_list-item\">Asijská restaurace \"Almyra\": 19.00-22.00 servírovaná večeře (1x za pobyt po předchozí rezervaci).</li>\r\n<li class=\"f_list-item\">Hlavní bar \"Dionysos\": 10.00-24.00 nealkoholické a alkoholické nápoje (místní výroby i značkový alkohol, rozlévané), pivo, víno, voda, džus, káva, čaj, koktejly.</li>\r\n<li class=\"f_list-item\">Bar na pláži \"Avra\": 10.00-24.00 nealkoholické a alkoholické nápoje (místní výroby i značkový alkohol, rozlévané), pivo, víno, voda, džus, káva, čaj, koktejly.</li>\r\n</ul>\r\n<strong>Upozornění:</strong> Lze čerpat v místech a časech určených hotelem. U večeře je vyžadováno formální oblečení."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>plážový volejbal</li>\r\n<li>minifotbal</li>\r\n<li>šipky</li>\r\n<li>stolní tenis</li>\r\n<li>posilovna</li>\r\n<li>joga</li>\r\n<li>zumba</li>\r\n<li>vodní pólo</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>kulečník</li>\r\n<li>tenisový kurt</li>\r\n<li>vodní sporty na pláži</li>\r\n<li>wellness</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>animační a večerní programy</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>Wi-Fi v celém areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://www.pilot-beach.gr/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření
