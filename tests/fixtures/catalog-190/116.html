<html><h1>Ona Marinas de Nerja Spa Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 13089, "name": "Ona Marinas de Nerja Spa Resort", "description": [{"code": null, "title": "Obecný popis:", "text": "Přímo u pláže v Nerja leží plážový hotel Ona Marinas de Nerja Spa Resort. Na pláži si hosté mohou zapůjčit lehátka (zdarma). Město Nerja je vzdáleno asi 2 km (AlmuñEcar asi 26 km, Malaga asi 58 km). Do nejbližších restaurací a barů se dostanete po cca 2 km. Z hotelu se můžete dostat k následujícím turistickým zajímavostem: Nerja Caves (cca 6 km) a Palacio Alhambra (cca 98 km). O Vaši mobilitu se během dovolené postarají půjčovna automobilů a také blízká autobusová zastávka. Letiště Malaga je ve vzdálenosti cca 65 km. "}, {"code": null, "title": "Vybavení:", "text": "Tento 6podlažní hotel disponuje celkem 216 pokoji. K vybavení hotelu patří recepce otevřená 24 hodin denně (přihlášení je možné od 14:00 hodin, odhlášení do 12:00 hodin), lobby s barem, 6 výtahů, klimatizace, sejf (zdarma), obchod, parkoviště (zdarma) a směnárna. O blaho hostů se stará restaurace. Dále má hotel konferenční prostor s celkem 600 sedadly. Pohybově omezeným hostům nabízí ubytování bezbariérový výtah a vstup. "}, {"code": null, "title": "Stravování:", "text": "Snídaně formou bufetu. All inclusive: snídaně, obědy a večeře. Voda, nealkoholické nápoje, pivo, víno, národní alkoholické nápoje, rychlé občerstvení a koktejly v určitých hodinách. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří bazén se sladkou vodou a samostatný dětský bazének. Zde jsou k dispozici lehátka a slunečníky (zdarma). "}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: tenis (zdarma), stolní tenis (případně za poplatek), fitness a volejbal. Golfové hřiště se nachází 22 km od hotelu. Nabídka wellness: lázeňská oblast a slunečná terasa za poplatek. Sauna, solárium, whirlpool, hamam a masáže případně za poplatek. Zábava pro dospělé: animační program s večerní show a živou hudbou. Hlídání dětí: miniklub pro děti od 4 - 12 let. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina, němčina a španělština. Kreditní karty: Visa, American Express a Euro/MasterCard. "}, {"code": null, "title": "2 ložnice Standard Apartment:", "text": "Pokoje jsou vybavené rozkládací pohovkou, dětskou postýlkou (zdarma), kuchyňským koutem, varnou konvicí (zdarma), balkónem, sejfem (zdarma) a satelit.TV a také individuálně regulovatelnou klimatizací. "}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Andalusie", "url": "https://www.eximtours.cz/spanelsko/andalusie"}, {"name": "Nerja", "url": "https://www.eximtours.cz/spanelsko/andalusie/nerja"}]}}</script></div></html>
