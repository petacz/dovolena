poje (vše místní výroby, rozlévané), filtrovaná káva,čaj</li>\r\n<li>Bar u bazénu: 10.00–23.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva,čaj, 11.00–18.00 zmrzlina, lehké občerstvení</li>\r\n<li>Bar na pláži: 10.00–18.00 (v hlavní sezoně 10.00–23.00) nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva,čaj, 12.00–18.00 lehké občerstvení</li>\r\n</ul>\r\n<strong>Upozornění:</strong> U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>tenisový kurt</li>\r\n<li>stolní tenis</li>\r\n<li>fitness</li>\r\n<li>padel</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty na pláži</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>animační programy (jóga, pilates, taneční lekce, vodní aerobic)</li>\r\n<li>večerní programy</li>\r\n</ul>"}, {"code": "WELLNESS", "title": "Wellness", "text": "<strong>Za poplatek:</strong><br />\r\n<ul>\r\n<li>SPA centrum</li>\r\n<li>sauna</li>\r\n<li>masáže</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>Wi-Fi v celém areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://www.mythos-palace.gr/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "
