<html><h1>Elba Sara Beach & Golf Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1618, "name": "Elba Sara Beach & Golf Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotel upoutá svoji jedinečnou polohou mezi písečnou pláží a golfovým hřištěm. Centrum letoviska Caleta de Fuste s obchody, restauracemi, bary a kavárnami cca 2 km. Komerční centrum s mnoha obchody, restauracemi, kinem, supermarketem, bowlingem a dalšími zábavními možnostmi v těsné blízkosti hotelu. Hlavní město Puerto del Rosario cca 13 km.</p>\r\nMezinárodní letiště Fuerteventura je vzdáleno 8 km (12 minut jízdy autem)."}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>266 moderních pokojů, vstupní hala s recepcí, restaurace, 2 restaurace a la carte, kavárna, 2 bary, dětský klub, kabaretní divadlo, minimarket, konferenční místnosti 250 a 65 m, až pro 200 osob), sauna s jacuzzi, prádelna, půjčovna aut, v udržované subtropické zahradě 2 bazény (jeden v zimních měsících s možností klimatizace/vyhřívání), dětský bazén (s možností vyhřívání/klimatizace), sluneční terasa, lehátka a slunečníky zdarma, balibeds za poplatek 10 Eur, oddělená sluneční terasa pouze pro dospělé.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře</strong>: koupelna/WC (vysoušeč vlasů), TV/sat., klimatizace, trezor a minibar (za poplatek), set na přípravu kávy/čaje, balkom nebo terasa, výhled na moře.</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, výhled zahrada: </strong>výhled zahrada</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Prestige, Výhled moře</strong>: modernější vybavení, minibar denně doplněn.</li>\r\n<li><strong>Junior suita, Výhled moře</strong>: jedna prostornější místnost s obývací částí.</li>\r\n<li><strong>Suita, 1 ložnice, Výhled moře</strong>: oddělená obývací část a ložnice.</li>\r\n<li><strong>Family Dvoulůžkový pokoj, Výhled moře:</strong>&nbsp; 2 přistýlky, výhled moře.</li>\r\n<li><strong>Rodinný pokoj, Propojený, Výhled moře:</strong> propojené dva pokoje, výhled moře.</li>\r\n</ul>\r\n<p>&nbsp;</p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Několikrát týdně hotel pořádá animační program pro děti i dospělé a večerní zábavná představení.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>Snídaně a večeře formou bufetu. Možnost dokoupení programu all inclusive.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž Playa de Castillo se světlým pískem za plážovou promenádou, cca 100 m od hotelu. Lehátka a slunečníky na pláži za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p><strong>Zdarma:</strong> fitness, stolní tenis, multifunkční hřiště, beach volleyball hřiště, tenisový kurt.<br /><br /><strong>Za poplatek:</strong> hotel zajišťuje pro své hosty kompletní servis služeb a slevy na všechna golfová hřiště (3 km od golfových hřišť Fuerteventura Golf Club a Golf Club Salinas de Antigua), minigolf, na pláži možnost vodních sportů.</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Aktivity v miniklub 4-12 let, minidisko, dětský bazén (s možností vyhřívání/kliemtizace), splash pro děti.</p>"}, {"code": "ALL_INCLUSIVE", "title": "All inclusive", "text": "<ul>\r\n<li>Snídaně formou bufetu (08.00-10.30 hod.)</li>\r\n<li>Pozdní kontinetální snídaně (11.00-13.00 hod.)</li>\r\n<li>Snack (13.30-17.00 hod.)</li>\r\n<li>Oběd formou bufetu (13.00-15.00 hod.)</li>\r\n<li>Káva a čaj, sušenky a sendviče (17.00-19.00 hod.)</li>\r\n<li>Večeře formou bufetu (18.30-22.00 hod.)</li>\r\n<li>Nealkoholické a alkoholické nápoje místní výroby (10.00-23.00 hod.)</li>\r\n<li>1x týdně a la carte restaurace na večeři (dle kapacity po předchozí rezervaci)</li>\r\n</ul>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"cod
