<html><h1>Mitsis Bali Paradise </h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 146071, "name": "Mitsis Bali Paradise ", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "Hotel Bali Paradise se nachází v oblíbeném letovisku Bali, pouhých 200 metrů od písečné pláže. Nabízí ubytování v několik budovách, které jsou obklopené udržovou zahradou. Má několik bazénu včetně jednoho se skluzavkami a je tak skvělou volbou pro rodiny s dětmi. Centrum letoviska Bali s množstím obchůdků a restaurací je vzdáleno cca 1 km od hotelu. Hotel doporučujeme všem věkovým kategorií a rodinám s dětmi. Hotel nedoporučujeme klientům s pohybovými obtížemi."}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 200 metrů</li>\r\n<li>letiště: 51 km</li>\r\n<li>centra: 1 km</li>\r\n<li>nákupních možností: 1 km</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Dvoulůžkový pokoj, Výhled zahrada:</strong><br />\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>telefon</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>trezor (zdarma)</li>\r\n<li>minilednička (lahev vody po příjezdu)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>set na přípravu čaje a kávy</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n<li>velikost cca 23m2</li>\r\n<li>pokoje odpovídají kategorii 4*</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře:&nbsp;</strong>pokoje odpovídají kategorii 4*</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:&nbsp;</strong>pokoje odpovídají kategorii 4*</li>\r\n<li><strong>Čtyřlůžkový pokoj, Výhled zahrada:&nbsp;</strong>prostornější místnost, velikost cca 29m2,&nbsp;pokoje odpovídají kategorii 4*</li>\r\n<li><strong>Rodinný pokoj, Výhled zahrada:&nbsp;</strong>jedna prostornější mís
