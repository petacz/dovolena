<html><h1>Kalogria Beach</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 143575, "name": "Kalogria Beach", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Hotelový komplex <strong>Kalogria Beach</strong>**** se nachází v jedinečné přírodní lokalitě západního Peloponésu, přímo u široké písečné pláže <strong>Kalogria</strong>, která je součástí chráněné krajinné oblasti s dunami, borovicovými lesy a lagunami. Resort tvoří hlavní budova a několik vedlejších objektů zasazených do rozlehlé zahrady, která nabízí dostatek prostoru pro hry i odpočinek. Hotel je ideální volbou pro <strong>rodiny s dětmi</strong>, které ocení nejen bezpečný přístup k moři, ale především <strong>hotelový aquapark</strong> s tobogány, skluzavkami a dětským bazénem. Pro nejmenší jsou připraveny animační programy, dětské hřiště, miniklub a večerní zábava. Rodiče si mohou užít relaxaci u hlavního bazénu, sportovní aktivity nebo výlety do okolní přírody.</p>\r\n<p>Ubytování je zajištěno v prostorných klimatizovaných pokojích s balkonem nebo terasou. Stravování formou all inclusive zahrnuje pestrou nabídku jídel, dětské menu i neomezenou konzumaci nápojů. Pláž je vybavena lehátky a slunečníky zdarma.</p>\r\n<p>Letiště <strong>Araxos</strong> je vzdálené cca 10 km, město <strong>Patras</strong> cca 35 km. Díky své poloze, vybavení a službám zaměřeným na rodiny je <strong>Kalogria Beach</strong>**** skvělou volbou pro nezapomenutelnou rodinnou dovolenou plnou zábavy, slunce a řecké pohostinnosti.<br /><br /><strong>Letiště Araxos</strong></p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>221 pokojů, bungalů a suite, vstupní hala s recepcí, lobby bar, restaurace, minimarket. Venku 3 bazény (z toho jeden se skluzavkami), dětský bazén, terasa na slunění, lehátka a slunečníky zdarma, osušky za poplatek, bar u bazénu, masážní salon, 2 dětská hřiště, 3 tenisové kurty, 2 kurty na mini fotbal, 1 baksetbalový kurt a beach volejbal hřiště.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled zahrada: </strong>koupelna/WC (vysoušeč vlasů), individuálně ovládaná klimatizace, lednička, trezor na recepci(za poplatek), TV/sat., telefon, balkon nebo terasa. Při obsazenosti 4 osob - palanda</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled zahrada:</strong> prostornější - třílůžkový pokoj</li>\r\n</ul>\r\n<ul>\r\n<li><strong>Rodinný pokoj, Výhled zahrada:</strong> prostornější pokoj s oddělenou ložnicí, pokoj se samostatnými lůžky je průchozí</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž přímo u hotelu. <br />Lehátka a slunečníky zdarma, osušky za poplatek.<br />Vodní sporty za poplatek.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>snídaně (7.30-9.30 hod), oběd (12.30-14.30 hod) a večeře formou bufetu (19.30-21.30 hod)</li>\r\n<li>snack během dne (11.00 - 18.00 v pool baru)</li>\r\n<li>neomezená konzumace vybraných alkoholických a nealkoholických nápojů místní výroby (11.00-23.30 hod.)</li>\r\n<li>Upozornění: výše uvedené časy i místa podávání se mohou změnit. Na večeři je vyžadováno formální oblečení.</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<p>Zdarma: tenis, plážový volejbal, hřiště na minifotbal, basketbal, volejbal, fitnes.<br />Za poplatek: vodní sporty na pláži, masáže.</p>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Animační programy pro děti a dospělé.<br />Každé ráno \"Baila\" fitness program (Zumba, aerobic, aqua-aerobic)</p>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětská postýlka zdarma na vyžádání, dětský bazén, bazén se skluzavkami, dětské hřiště, miniklub, v restauraci dětské menu.<br /><br /><strong>Animační program Funtazie klubu v termínu 23.6. - 4.9.2027</strong> (neplatí pro produkt Fischer Dynamix)</p>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<ul>\r\n<li>bezbariérový vstup do hlavní budovy</li>\r\n<li>5 pokojů bezbariérových na vyžádání přes prodejce</li>\r\n<li>bezbariérový přístup na pláž a k bazénu</li>\r\n</ul>"}, {"code": "SPECIFICS", "title": "Zvláštnosti", "text": "<ul>\r\n<li>minilednička na pokoji zdarma</li>\r\n<li>lehátka a slunečníky na pláži zdarma</li>\r\n<li>domácí mazlíčci nejsou povoleni</li>\r\n<li>trezor na recepci za poplatek</li>\r\n<li>dětská postýlka zdarma</li>\r\n<li>plážové osušky za poplatek</li>\r\n<li>klimatizace zdarma</li>\r\n<li>bezlepková a bezlaktozová strava na vyžádání</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<p>Zdarma: WIFI v lobby a u bazénu.</p>"}, {"code": "WEB", "title": "Web", "text": "https://www.kalogriahotel.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Pelopones", "url": "https://www.eximtours.cz/recko/pelopones-kalamata"}, {"name": "Kalogria", "url": "https://www.eximtours.cz/recko/pelopones/kalogria"}]}}</script></div></html>
