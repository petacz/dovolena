<html><h1>SENTIDO OROSEI BEACH</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 147351, "name": "SENTIDO OROSEI BEACH", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Sentido Orosei Beach se nachází v jedné z nejkrásnějších oblastí Sardinie. Typický sardinský resort obklopený udržovanými zahradami vás okouzlí svou polohou u nádherné pláže, která se dotýká azurového moře v srdci zálivu Orosei. Svým klientům nabízí spoustu sportovních aktivit, lekce jógy, večerní programy a zábavu pro děti. Hotel je vhodný pro klienty všech věkových kategorií.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 250 m</li>\r\n<li>letiště: 95 km Olbia</li>\r\n<li>centra: 2 km Orosei</li>\r\n<li>nákupních možností: 0 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>telefon</li>\r\n<li>trezor</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>minibar</li>\r\n<li>set pro přípravu čaje a kávy</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>V případě ubytování 4 osob je přistýlka formou palandy</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior:</strong> orientovaný směrem k moři či směrem na bazén</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": " <ul><li>vstupní hala s recepcí</li><li>restaurace</li><li>tématická restaurace (za poplatek)</li><li>Wi-Fi ve společných prostorách (zdarma)</li><li>salón krásy</li><li>bar na pláži</li><li>bar u bazénu</li><li>bazén (lehátka a slunečníky zdarma)</li><li>dětský bazén</li><li>dětské hřiště</li><li>obchod se suvenýry</li></ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>písčitá (2 lehátka a slunečník od 3. řady na pokoj zdarma)</li><li>osušky zdarma</li><li>plážový bar</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": " <ul><li>plážový volejbal</li><li>boccia</li><li>tenis</li><li>basketbal</li><li>fotbal</li><li>fitness</li><li>spinning</li><li>jóga</li><li>večerní programy</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": " <ul><li>masáže</li><li>salon krásy</li><li>horská kola</li><li>potápění</li><li>pronájem lodí</li><li>vodní sporty</li></ul>"}, {"code": "DINING", "title": "Strava v ceně", "text": "<ul>\r\n<li><strong>All Inclusive</strong>:</li>\r\n<li>Hlavní restaurace: 7.30–10.00 snídaně formou bufetu, 12.30–14.30 oběd formou bufetu, 19.30–21.30 večeře formou bufetu. Během obědů a večeří k dispozici rozlévané nealko nápoje (voda, soft drinky) a rozlévané stolní víno a místní pivo.</li>\r\n<li>Snack bar u bazénu: 11.00–12.30 a 17.00–18.30 lehké občerstvení (například pizza, hamburger, focaccia, hot-dog, hranolky)</li>\r\n<li>Bar u bazénu: 10.00–24.00 neomezené množství rozlévaných nealkoholických a vybraných alkoholických nápojů místní výroby.</li>\r\n<li>Bar na pláži: 9:00-19:00 nealkoholické nápoje, čaj, káva.</li>\r\n<li>U večeře je vyžadováno formální oblečení.</li>\r\n<li>Upozornění: výše uvedené časy i místa podávání jsou určeny hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "V hotelovém bazénu je vyžadována koupací čepice. Pobytová taxa cca 3 EUR/osoba/noc splatná v hotovosti na recepci hotelu."}], "destination": [{"name": "Itálie", "url": "https://www.eximtours.cz/italie"}, {"name": "Sardinie", "url": "https://www.eximtours.cz/italie/sardinie"}, {"name": "Orosei", "url": "https://www.eximtours.cz/italie/sardinie/orosei"}]}}</script></div></html>
