<html><h1>Arion Resort</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 5145, "name": "Arion Resort", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Oblíbený hotel v klidné oblasti obklopený krásnou zelení. Příjemné středisko Vassilikos s několika tavernami a obchody pouze několik minut chůze. Rušné turistické středisko Argassi s bohatým nočním životem cca 9 km. Hlavní město Zakynthos cca 13 km (spojení linkovým autobusem, zastávka 200 m).</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>52 pokojů, 3 budovy. Vstupní hala s recepcí, restaurace, menší fitness v sesterském hotelu Arion Green Riviera. Venku bazén, terasa s lehátky a slunečníky zdarma, bar u bazénu.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), individuální klimatizace, telefon, TV/sat., lednička, trezor, set na přípravu kávy a čaje, balkon nebo terasa<br /><br />\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Rodinný pokoj</strong>: prostornější</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž u sesterského hotelu Aspro Krino Dunes, cca 300 m (při vstupu do vody oblázky), lehátka na pláži zdarma. V rámci All Inclusive k dispozici plážový bar (pivo, víno, nealkoholické nápoje). Známá pláž Banana Beach vzdálená cca 500m.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje</li>\r\n<li>Oběd a večeře se podává blíže pláži v sesterském hotelu Arion Green Riviera</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci</li>\r\n</ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětské brouzdaliště a hřiště (v Arion Sea Front), dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma:</strong> WiFi na pokojích.</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "<a href=\"https://arionhotelzante.com/arion-resort.html\">https://arionhotelzante.com/arion-resort.html</a>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Vassilikos", "url": "https://www.eximtours.cz/recko/zakynthos/vassilikos"}]}}</script></div></html>
