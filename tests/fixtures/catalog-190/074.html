<html><h1>Star Beach Village</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 2684, "name": "Star Beach Village", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotelový komplex Star Beach se skládá z několika dvoupatrových budov, které jsou umístěny v krásné udržované zahradě. Přímo před hotelem se nachází písečná pláž, přístupná přes vodní park. Ten nabízí skvělé vyžití pro děti, stejně jako zábavní park, který se nachází u hotelu. Můžete navštívit také velké množství kaváren, barů, restaurací a obchůdků v letovisku Hersonissos, které se nachází nedaleko hotelu. Star Beach doporučujeme hlavně těm, kteří chtějí zažít aktivní dovolenou a rodinám s dětmi.</p>\r\n<p>&nbsp;</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 50 m</li><li>letiště: 25 km Heraklion</li><li>centra: 1.5 km</li><li>nákupních možností: 0 m v hotelu</li></ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Annex</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>telefon</li>\r\n<li>trezor (zdarma)</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>lednička</li>\r\n<li>kávovar</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka (zdarma)</li>\r\n<li>ubytování mimo hlavní areál hotelu, budova přístupná přes silnici nebo podchodem</li>\r\n<li>vlastní bazén a snack bar</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Rodinný pokoj:</strong> 2 místnosti, v hlavním hotelovém areálu</li>\r\n<li><strong>Rodinný pokoj, Superior:</strong> 2 prostornější místnosti, v hlavním hotelovém areálu</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled zahrada:</strong> v hlavním hotelovém areálu</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:</strong> v hlavním hotelovém areálu</li>\r\n<li><strong>Jednolůžkový pokoj</strong></li>\r\n<li><strong>Suite, Superior: </strong>pokoje pouze pro dospělé, nachází se v první řadě hotelu (u moře), v hlavním hotelovém areálu</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>hlavní bar</li>\r\n<li>bar u bazénu</li>\r\n<li>bar na pláži</li>\r\n<li>2 tematické restaurace (řecká, asijská)</li>\r\n<li>bazén se sladkou vodou (lehátka, slunečníky a osušky zdarma)</li>\r\n<li>dětský bazén</li>\r\n<li>dětské hřiště</li>\r\n<li>miniklub (pro děti 4–12 let)</li>\r\n<li>minimarket</li>\r\n<li>obchod se suvenýry</li>\r\n<li>vodní a zábavní park (pro klienty hotelu přístupný v čase 11.00–18.00), <strong>nový Aquapark pro sezonu 2026</strong></li>\r\n<li><strong>nové dětské hřiště</strong></li>\r\n<li>bankomat</li>\r\n<li>šíša bar</li>\r\n<li>minimarket</li>\r\n<li>obchod se suvenýry</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>písčitá</li><li>lehátka, slunečníky a osušky zdarma (za vratnou zálohu 10 EUR/kus)</li></ul>"}, {"code": "DINING", "title": "Strava ", "text": "<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>Hlavní restaurace: 7.30–10.30 snídaně formou bufetu, 13.00–14.30 oběd formou bufetu, 18.30–21.30 večeře formou bufetu. U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje, pivo, víno</li>\r\n<li>Taverna: 8.00–10.00 snídaně formou bufetu, 12.30–14.30 oběd formou bufetu, 18.30–21.30 večeře formou bufetu. U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje, pivo, víno, rezervace nutná předem</li>\r\n<li>Asijská restaurace: 18.30–21.30 večeře formou bufetu, rezervace nutná předem</li>\r\n<li>Lobby bar: 15.00–23.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (rozlévané, místní výroby), 16.30–17.30 filtrovaná káva, čaj, zákusky</li>\r\n<li>Bar u bazénu: 10.00–24.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (rozlévané, místní výroby), filtrovaná káva, čaj, 10.00–18.30 lehké občerstvení</li>\r\n<li>Bar u bazénu se skluzavkami: 10.00–18.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (vše místní výroby, rozlévané), filtrovaná káva, čaj, lehké občerstvení</li>\r\n<li>2 bary na pláži: 10.00–18.00 nealkoholické nápoje, pivo, víno, alkoholické nápoje (rozlévané, místní výroby), filtrovaná káva, čaj</li>\r\n</ul>\r\n<strong>Upozornění:</strong> U večeře je vyžadováno formální oblečení. Výše uvedené časy a místa se mohou změnit."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>minifotbal</li>\r\n<li>basketbal</li>\r\n<li>fitness</li>\r\n<li>vodní park a zábavní park (11.00–18.00)</li>\r\n<li>plážový volejbal</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty na pláži</li>\r\n<li>SPA centrum</li>\r\n<li>bungee jumping</li>\r\n<li>VIP zóna aquaparku (poplatek cca 30 EUR/osoba/den) - jedná se o malou část v areálu aquparku, kde jsou hotelem pořádány speciální akce (program naleznete přímo v hotelu), do této části je možný vstup i lidem, kteří nejsou v hotelu ubytováni (VIP zóna nijak neomezuje vstupn na všechny skluzavky a tobogány v aquaparku).</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>animační programy</li>\r\n<li>večerní programy</li>\r\n</ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<ul>\r\n<li>k dispozici 5 bezbariérových pokojů (na vyžádání)</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li><strong>Zdarma: </strong>Wi-Fi v celém areálu hotelu</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "http://www.starbeachvillage.gr"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}, {"code": "DISTANCES", "title": "Další příletová letiště", "text": "Letiště Chania je vzdáleno 173 km od hotelu."}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Kréta", "url": "https://www.eximtours.cz/recko/kreta"}, {"name": "Hersonissos", "url": "https://www.eximtours.cz/recko/kreta/hersonissos"}]}}</script></div></html>
