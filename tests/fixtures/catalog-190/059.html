<html><h1>Apollo Blue</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 9549, "name": "Apollo Blue", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>V centru letoviska Faliraki přímo u dlouhé písečné pláže. V okolí taverny, restaurace, bary a onchody. Sesterský hotel hotelu Apollo Beach. Zástávka autobusu (spojení s městy Lindos, hlavní město Rhodos cca 14 km. Aquapark cca 2 km od hotelu. Zastávka autobus cca 150m. Letiště Rhodos je vzdáleno 17 km od hotelu</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, lobby, restaurace, taverna Blue á la carte, bary, obchod se suvenýry, venkovní bazén, dětský bazén, prádelna, fitness, herna, dětský koutek, doktor na zavolání</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Výhled zahrada:</strong> 28 m2, koupelna/WC (vysoušeč vlasů), TV/sat., klimatizace (1.6.-30.9. zdarma), minilednička, set na příparavu kávy &amp; čaje, trezor zdarma, balkon nebo terasa<br /><br />\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře: </strong>boční výhled moře</li>\r\n<li><strong>Junior Suita, Výhled moře:</strong> jedna místnost pouze opticky rozdělena na ložnici a obývací část, sdílený bazén, výhled moře, balkon nebo terasa, sdílený bazén pro pokoje v přízemí i v patře. Velikost pokoje cca 35m2.</li>\r\n<li><strong>Junior Suita, Deluxe, Výhled moře, Sdílený bazén:</strong> oddělená ložnice a obývací pokoj (zatahovacími dveřmi), terasa. Prostornější cca 45m2. <strong>Pozor: pouze pro osoby od 13 let </strong>(nelze 0-12,99 let).</li>\r\n<li><strong>Junior Suita, Výhled zahrada, Přízemí, Soukromý bazén:</strong> privátní bazén (cca 23m2), výhled zahrada, jedna místnost pouze opticky rozdělena na ložnici a obývací část, terasa. Velikost pokoje cca 35m2.</li>\r\n</ul>"}, {"code": " RY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>5 hvězdiček</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Rhodos", "url": "https://www.eximtours.cz/recko/rhodos"}, {"name": "Faliraki", "url": "https://www.eximtours.cz/recko/rhodos/faliraki"}]}}</script></div></html>
