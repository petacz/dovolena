<html><h1>TUI Magic Life Fuerteventura</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 1603, "name": "TUI Magic Life Fuerteventura", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Na vyvýšenině přímo nad pláží Esquinzo v klidné oblasti Playa Butihondo. Malebná rybářská vesnička Morro Jable cca 7 km, rušné středisko Jandía s pobřežní promenádou a mnoha nákupními a zábavními možnostmi cca 4 km. Letiště Fuerteventura je vzdáleno 79 km od hotelu. </p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>634 pokojů v hlavní hotelové části (hlavní budova a několik vedlejších) a 59 pokojů v klidné zóně Private Lodge. Vstupní hala s recepcí, restaurace, 3 tematické restaurace, bar, minimarket. V zahradě 4 bazény (1 s možností klimatizace/ vyhřívání), terasy s lehátky, slunečníky a osuškami zdarma. Oddělená nudistická zóna s bazénem s jacuzzi a saunou.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong>: koupelna/WC (vysoušeč vlasů), klimatizace (centrální), TV/sat., trezor, minilednička, balkon nebo terasa.</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, výhled moře</strong>: , výhled na moře.</li>\r\n<li><strong>Rodinný pokoj:</strong> přistýlka v podobě rozkládacího sofa.</li>\r\n<li><strong>Dvoulůžkový pokoj, adults only, private lodge:</strong>&nbsp;stropní ventilátor, jacuzzi, v části areálu Private Lodge (pouze pro osoby starší 16 let).</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Bohatý sportovní program během dne, animace, večerní zábavný program.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p>Viz program all inclusive.</p>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Přímo nad užší písečnou pláží (u vstupu do vody místy kameny, doporučujeme obuv do vody). Přístup na pláž po schodech. Lehátka a slunečníky za poplatek.<br /><br />Upozornění: po bouři Therese byla zasažena pláž Esquinzo, aktuálně se zde nachází větší množství kamenů.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Zdarma:</strong> 2 tenisové kurty, stolní tenis, fitness, plážový volejbal, minifotbal, aerobik.</li>  <li><strong>Za poplatek</strong>: masáže.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, hřiště, miniklub, teen klub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "ALL_INCLUSIVE", "title": "All inclusive", "text": "<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehký snack během dne</li>\r\n<li>Odpolední káva, čaj a zákusek</li>\r\n<li>1× možnost výměny večeře v hlavní restauraci za večeři v tematické restauraci Bodega, The Flavour nebo Trattoria (nutná rezervace)</li>\r\n<li>Vybrané alkoholické a nealkoholické nápoje</li>\r\n</ul>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "WEB", "title": "Web", "text": "http://www.magiclife.com"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma:</strong> WiFi v celém hotelu.</li>  </ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p><strong>Oficiální třída: ****<br /></strong><strong><br /></strong>Od 6.4. do 15.5. bude uzavřen semiolympijský bazén, od 11.5. do 19.6. bude uzavřena naturistická část, z důvodu rekonstrukce, může být slyšet hluk.<strong><br /></strong></p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Fuerteventura", "url": "https://www.eximtours.cz/spanelsko/fuerteventura"}, {"name": "Playa Del Esquinzo", "url": "https://www.eximtours.cz/spanelsko/fuerteventura/playa-del-esquinzo"}]}}</script></div></html>
