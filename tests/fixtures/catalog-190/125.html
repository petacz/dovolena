<html><h1>Playalinda Aquapark & Spa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 86635, "name": "Playalinda Aquapark & Spa", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": " <p>Pěkný rodinný hotel s andaluskou architekturou, vhodný pro všechny věkové kategorie. Hotel nabízí kvalitní služby, stravování a pro rodiny s dětmi je zde akvapark. Výborná poloha v srdci turistické části Roquetas. Hotel leží přímo u pláže s hrubším pískem, cca 800 m od golfového hřiště Playa Serena. V blízkém okolí nákupní možńosti, restaurace a bary. Pevnost Santa Ana cca 3,5 km místní promenádou, centrum Roquetas cca 4 km, autobusová zastávka 200 m od hotelu.</p>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>stropní ventilátor</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>sat TV</li>\r\n<li>telefon</li>\r\n<li>minibar</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>2 pevné postele velikosti 135 x 2 m - nelze další přistýlky</li>\r\n<li>postýlka zdarma na vyžádání - lze započítat nad obsazenost pokoje</li>\r\n<li>hotel disponuje bezbariérovými pokoji.</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů</strong>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj</strong>, <strong>Výhled na moře</strong></li>\r\n</ul>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": " <ul><li>pláže: 0 m u pláže</li><li>centra: 4 km Roquetas</li></ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": " <ul><li>vstupní hala s recepcí</li><li>hlavní restaurace El Patio - dětská jídelní židlička zdarma</li><li>bar Queens</li><li>bar u bazénu</li><li>bazén</li><li>aquapark</li><li>možnost využívat bazén se skluzavkami</li><li>jacuzzi (vstup od 18ti let)</li><li>a all inclusive služby v sousedním sesterském hotelu Playasol</li><li>lehátka a slunečníky u bazénu zdarma</li><li>palmový háj</li><li>možnost zapůjčení osušek (záloha cca 0 EUR + výmeně 1 EUR)</li><li>TV místnost</li><li>místnost pro zavazadla</li><li>miniklub v angličtině</li><li>animační programy</li><li>WiFi zdarma.</li></ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": " <ul><li>dlouhá široká písčitá pláž s hrubším pískem je u hotelu, pouze za místní plážovou promenádou. </li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": " <ul><li>fitness</li></ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": " <ul><li>Welness Senzia Spa bazény,saunou, jacuzzi a masážemi- vše za poplatek</li><li>golf Playa Serena za poplatek</li><li>stolní tenis a minigolf za depozit</li><li>petanque</li></ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>Polopenze plus:</strong> <br />\r\n<ul>\r\n<li>snídaně a večeře formou bufetu, nápoje k jídlu - voda, limo, víno, pivo.</li>\r\n</ul>\r\n<strong>All Inclusive:</strong><br />\r\n<ul>\r\n<li>10:00 - 24:00, zahrnuje snídaně, obědy a večeře formou bufetu s nápoji k jídlu - voda, limo, víno, pivo</li>\r\n<li>během dne lehké občerstvení, zmrzlina. Tapas od 12:00 - 15:00 v baru u bazénu</li>\r\n<li>neomezené množství rozlévaných nealkoholických a vybraných alkoholických nápojů místní výroby.</li>\r\n<li>Služby AI končí v den odjezdu ve 12:00 (klienti mají ještě oběd), v odpoledních hodinách je již není možné využít. Lze čerpat v místech a časech určených hotelem</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "4 hvězdičky"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Costa Almería", "url": "https://www.eximtours.cz/spanelsko/costa-almeria"}, {"name": "Roquetas de Mar", "url": "https://www.eximtours.cz/spanelsko/costa-almeria/roquetas-de-mar"}]}}</script></div></html>
