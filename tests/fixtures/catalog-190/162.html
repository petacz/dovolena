<html><h1>ASTIR PALACE</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 140214, "name": "ASTIR PALACE", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Příjemný hotel s dobrými službami se nachází přímo u široké písčité pláže s pozvolným vstupem do moře. Díky své poloze je hotel ideální zejména pro milovníky pěkného koupání a také pro klienty vyhledávající večerní zábavu či procházky v nedalekém živém centru letoviska Laganas. Do hlavního města Zakynthos se dopravíte místní autobusovou linkou. Hotel doporučujeme klientům všech věkových kategorií.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 0 m</li>\r\n<li>letiště: 7 km Zakynthos</li>\r\n<li>centra: 0.8 km Laganas, 9 km Hlavní město Zakynthos</li>\r\n<li>nákupních možností: 100 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Promo</strong></p>\r\n<ul>\r\n<li>individuálně ovládaná klimatizace (zdarma od 1.7.–31. 8.)</li>\r\n<li>telefon</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>TV se satelitním příjmem</li>\r\n<li>lednička (zdarma)</li>\r\n<li>koupelna/WC (vysoušeč vlasů - na vyžádání)</li>\r\n<li>trezor (za poplatek 3 EUR/den)</li>\r\n<li>pokoje jsou bez balkonu a specifikace výhledu</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Boční výhled moře:&nbsp;</strong>balkon nebo terasa, boční výhled moře</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled zahrada:&nbsp;</strong>balkon nebo terasa, výhled zahrada</li>\r\n<li><strong>Dvoulůžkový pokoj, Výhled moře:&nbsp;</strong>balkon nebo terasa, výhled moře</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>Vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>hlavní bar (otevřen v případě nepříznivého počasí)</li>\r\n<li>Wi-Fi v lobby a okolí recepce&nbsp;</li>\r\n<li>konferenční místnost</li>\r\n<li>TV místnost</li>\r\n<li>bazén s oddělenou částí pro děti. Lehátka a slunečníky u bazénu zdarma.</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>Písčitá s pozvolným vstupem</li>\r\n<li>lehátka a slunečníky v okolí bazénu a nad pláží zdarma, na pláži za poplatek</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>Vodní sporty na pláži</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava v ceně", "text": "<strong>Snídaně</strong><br />\r\n<ul>\r\n<li>snídaně formou bohatého bufetu</li>\r\n</ul>\r\n<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>snídaně a večeře formou bohatého bufetu</li>\r\n</ul>\r\n<strong>Plná penze</strong><br />\r\n<ul>\r\n<li>snídaně, oběd a večeře formou bohatého bufetu</li>\r\n</ul>\r\n<strong>All Inclusive</strong><br />\r\n<ul>\r\n<li>8.00–10.00 snídaně formou bohatého bufetu, 13.30–15.00 obědy formou bohatého bufetu</li>\r\n<li>19.00–21.00 večeře bohatého formou bufetu. U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje z postmixu - coca cola, sprite, orange, soda, voda točené pivo, víno místní výroby, čaj, filtrovaná káva</li>\r\n<li>Snack bar ve vedlejším sesterském hotelu Astir Beach: 11.00–18.00 lehké svačiny, zmrzlina pro děti do 11,99 let, 11.00–23.00 nealkoholické nápoje z postmixu – coca cola, sprite, orange, soda, voda, tonic, točené pivo, víno místní výroby, čaj, filtrovaná káva, tvrdý alkohol – whisky, gin, vodka, rum, brandy – vše místní výroby. Všechny nápoje ve Snack baru jsou z důvodu bezpečnosti servírované v plastových kelímcích.</li>\r\n<li>Upozornění: Výše uvedené časy i místa podávání se mohou změnit. V případě nepříznivého počasí je místo Snack baru v Astir Beach otevřen Hlavní bar v Astir Palace.</li>\r\n</ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Zakynthos", "url": "https://www.eximtours.cz/recko/zakynthos"}, {"name": "Laganas", "url": "https://www.eximtours.cz/recko/zakynthos/laganas"}]}}</script></div></html>
