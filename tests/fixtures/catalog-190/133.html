<html><h1>Best Tenerife</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 141784, "name": "Best Tenerife", "description": [{"code": null, "title": "Obecný popis:", "text": "Plážový hotel Best Tenerife se nachází v Playa de las Americas v blízkosti volně přístupné písečné pláže \"Las Vistas\". Na pláži si hosté mohou zapůjčit lehátka a slunečníky (za poplatek). Nejbližší město je Los Cristianos. V okolí hotelu se nabízejí nejrůznější nákupní možnosti a také je zde supermarket. V blízkosti hotelu se nachází diskotéka. Z hotelu se můžete dostat k následujícím turistickým zajímavostem: Harbour Los Cristianos, Siam Park, Puerto Colon Yacht Marina, Las Canadas National Park a Santa Cruz Monuments. O Vaši mobilitu se postará stanoviště taxi a také autobusová zastávka. Letiště Tenerife Jih je vzdáleno 17 km od hotelu."}, {"code": null, "title": "Vybavení:", "text": "Tento 9podlažní hotel, naposledy zrenovovaný v roce 2008, má 365 pokojů. V hotelu se nachází lobby s barem, 3 výtahy, klimatizace, sejf (za poplatek), kadeřnictví, kiosek a směnárna. O blaho hostů se stará restaurace (klimatizovaná) a snack bar. V celkem 3 barech si můžete večer užít příjemné posezení. Wi-Fi je hotelovým hostům k dispozici zdarma. Dále má hotel konferenční prostor. Pohybově omezeným hostům nabízí ubytování bezbariérový výtah a vstup a částečně bezbariérové koupelny. Služba praní prádla, služba žehlení prádla a zdravotní služba jsou za poplatek. "}, {"code": null, "title": "Bazén:", "text": "K venkovnímu vybavení hotelu patří bazén se sladkou vodou a samostatný dětský bazének. Zde jsou k dispozici lehátka a slunečníky (zdarma). V baru u bazénu jsou k dostání osvěžující nápoje. "}, {"code": null, "title": "Stravování:", "text": "Snídaně (07:00 - 10:00 hod.) formou bufetu. Polopenze. Plná penze. All Inclusive."}, {"code": null, "title": "Sport/ volný čas:", "text": "Sportovní a volnočasová nabídka: kulečník (případně za poplatek), šipky (případně za poplatek) a stolní tenis (případně za poplatek). Ve vzdálenosti cca 500 m jsou nabízeny vodní sporty (částečně od místních poskytovatelů). Golfové hřiště se nachází 2 km od hotelu. Nabídka wellness: slunečná terasa a whirlpool případně za poplatek. Zábava pro dospělé: animační program s večerní show. Hlídání dětí: animační program pro děti. "}, {"code": null, "title": "Další informace:", "text": "Využití některých zařízení a aktivit může být zpoplatněno navíc. Některé služby jsou závislé na ročním období a na místních klimatických podmínkách. Jazyky: angličtina. Kreditní karty: Euro/MasterCard. Premium Terrace je určena pouze pro 18+."}, {"code": null, "title": "Standard Pokoj:", "text": "Pokoje jsou vybavené balkónem, sejfem (za poplatek) a satelit.TV a také individuálně regulovatelnou klimatizací. Koupelna s vanou a se sprchou."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Tenerife", "url": "https://www.eximtours.cz/spanelsko/tenerife"}, {"name": "Playa de las Américas", "url": "https://www.eximtours.cz/spanelsko/tenerife/playa-de-las-americas"}]}}</script></div></html>
