<html><h1>Globales America</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3056, "name": "Globales America", "description": [{"code": "LOCATION", "title": "Poloha", "text": "<p>Na východním pobřeží ostrova Mallorca. V blízkosti několik obchodů, restaurací a barů. Hlavní město Palma de Mallorca cca 70 km, autobusová zastávka cca 100 m. Zábavní vodní parky a aquaparky poblíž hlavního města.</p>"}, {"code": "EQUIPMENT", "title": "Vybavení", "text": "<p>372 pokojů, 2 budovy – hlavní osmipatrová budova a sousední nižší budova. V hlavní budově vstupní hala s recepcí, výtahy, bar, restaurace, pizzerie bar, kavárna, místnost s TV/sat. Venku 2 bazény, bar u bazénu, terasa s lehátky a slunečníky zdarma.</p>"}, {"code": "ROOMS", "title": "Pokoje", "text": "<strong>Dvoulůžkový pokoj, Nižší patro, Boční výhled moře</strong>: koupelna/WC (vysoušeč vlasů), klimatizace, telefon, TV/sat., minilednička, trezor za poplatek, balkon s bočním výhledem na moře, přízemí až 3. patro.<br /><br /><strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Vyšší patro, Boční výhled moře</strong>: 4. patro a vyšší patra.&nbsp;</li>\r\n<li><strong>Rodinný pokoj, Nižší patro, Boční výhled moře</strong>: prostornější s možností ubytování 2 dospělých a 2 dětí, přízemí až 3. patro.&nbsp;</li>\r\n<li><strong>Rodinný pokoj, Vyšší patro, Boční výhled moře</strong>: prostornější s možností ubytování 2 dospělých a 2 dětí, 4. patro a vyšší patra.&nbsp;</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<p>Denní i večerní animační program.</p>"}, {"code": "DINING", "title": "Stravování", "text": "<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Pozdní snídaně (10.00–10.30 hod.)</li>\r\n<li>Lehký snack (11.00–18.00 hod.)</li>\r\n<li>Pizza (12.00–23.00 hod.)</li>\r\n<li>Vybrané nealkoholické a alkoholické nápoje (10.00–24.00 hod.)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Pláž", "text": "<p>Písečná pláž Cala Domingos cca 50 m, přístup na pláž z mírného kopce a po několika schodech. Lehátka a slunečníky za poplatek.</p>"}, {"code": "SPORTS", "title": "Sportovní nabídka", "text": "<ul>  <li><strong>Zdarma:</strong> tenis, multifunkční hřiště, stolní tenis.</li>  <li><strong>Za poplatek:</strong> biliár, 18jamkové golfové hřiště Vall d’Or cca 11 km.</li>  </ul>"}, {"code": "CHILDRENS", "title": "Děti", "text": "<p>Dětský bazén, hřiště, animace, miniklub, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": "PAYMENTS", "title": "Karty", "text": "<p>VISA, EC/MC.</p>"}, {"code": "WEB", "title": "Web", "text": "www.hotelesglobales.com"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>  <li><strong>Zdarma:</strong> WiFi v lobby a na pokojích (omezený časový limit).</li>  <li><strong>Za poplatek:</strong> internetový koutek.</li>  </ul>"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdy</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci."}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca"}, {"name": "Calas de Mallorca", "url": "https://www.eximtours.cz/spanelsko/mallorca/calas-de-mallorca"}]}}</script></div></html>
