<html><h1>Sol Falcó Menorca</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 151095, "name": "Sol Falcó Menorca", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotel Sol Falcó se nachází v dosahu dvou krásných pláží - Son Xoriguer (písek a kameny) cca 250 m a Cala´n Bosch s bílým pískem cca 700 m a průzračně čistou tyrkysovou vodou.&nbsp; Hotel nabízí svým hostům stravování formou polopenze, v hlavní sezoně pouze all inclusive a dále veškeré pohodlí pro strávení ideální klidné dovolené. Ubytování je poskytováno ve 449 pokojích různého typu. V hotelu se nachází 7 bazénů, včetně jednoho speciálně pro děti a jednoho v klidnější relax zóně. Výborná poloha hotelu kombinuje blízkost pláže i centra. Hotel lze doporučit všem věkovým kategoriím a především rodinám s dětmi. Nový malý aquapark se splash atrakcemi přímo v hotelu.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláž: 250 m (Son Xoriguer), 700 m (Cala´n Bosch)</li>\r\n<li>letiště: 40 km</li>\r\n<li>centrum: 700 m</li>\r\n<li>nákupní možnosti: 50 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj</strong></p>\r\n<ul>\r\n<li>individuální klimatizace</li>\r\n<li>stropní ventilátor</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>telefon</li>\r\n<li>TV</li>\r\n<li>minilednička (zdarma)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)&nbsp;</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>dětská postýlka (na vyžádání, zdarma)</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů </strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Výhled bazén:</strong> výhled na bazén.</li>\r\n<li><strong>Rodinný pokoj:</strong> prostornější, umístěné v přízemí, s terasou.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>hlavní restaurace</li>\r\n<li>lounge bar</li>\r\n<li>bar u bazénu</li>\r\n<li>7 bazénů (lehátka a slunečníky zdarma, osušky oproti kauci a výměna za poplatek)</li>\r\n<li>dětský bazén</li>\r\n<li>splash aquapark pro děti</li>\r\n<li>dětské hřiště</li>\r\n<li>miniklub</li>\r\n<li>minimarket</li>\r\n<li>obchod se suvenýry</li>\r\n<li>konferenční prostory</li>\r\n<li>parkoviště (za poplatek)</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá pláž Son Xoriguer (u vstupu do vody místy s kameny) cca 200 m, písčitá pláž Cala´n Bosch s bílým pískem cca 700 m</li>\r\n<li>lehátka a slunečníky za poplatek</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>Polopenze</strong><br />\r\n<ul>\r\n<li>Snídaně a večeře formou bufetu</li>\r\n</ul>\r\n<strong>All Inclusive<br /></strong>\r\n<ul>\r\n<li>Snídaně (8:00 - 10:30), obědy (13:00 - 15:00) a večeře (19:00 - 22:00) formou bufetu</li>\r\n<li>Během dne lehké občerstvení (10:00 - 19:00)</li>\r\n<li>Neomezené množství nealkoholických nápojů (voda, filtrovaná káva, čaj, postmixové nápoje) a alkoholických rozlévaných nápojů místní výroby (pivo, víno)&nbsp;</li>\r\n<li>Lze čerpat v místech a časech určených hotelem</li>\r\n</ul>\r\nBezlepkovou / bezlaktózovou stravu nutno vyžádat."}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>animační programy</li>\r\n<li>večerní programy</li>\r\n<li>fitness</li>\r\n<li>lukostřelba</li>\r\n<li>stolní tenis</li>\r\n<li>volejbal</li>\r\n<li>basketbal</li>\r\n<li>fotbal</li>\r\n<li>vodní pólo</li>\r\n<li>vodní gymnastika</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>vodní sporty na pláži</li>\r\n<li>potápění</li>\r\n<li>golf</li>\r\n<li>tenis</li>\r\n<li>půjčovna kol</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>denní i večerní animační programy</li>\r\n<li>příležitostně živá hudba</li>\r\n</ul>"}, {"code": "NOTE", "title": "Pro handicapované", "text": "<ul>\r\n<li>několik pokojů přizpůsobených pro handicapované klienty (na vyžádání)</li>\r\n<li>bezbariérový pohyb v areálu hotelu</li>\r\n<li>rampa do bazénu</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>Wi-Fi v hotelu (zdarma)</li>\r\n<li>internetový koutek (za poplatek)</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "www.melia.com"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p>Na Baleárských ostrovech je povinnost hradit pobytovou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Španělsko", "url": "https://www.eximtours.cz/spanelsko"}, {"name": "Menorca", "url": "https://www.eximtours.cz/spanelsko/menorca"}, {"name": "Cala n Bosch", "url": "https://www.eximtours.cz/spanelsko/menorca/cala-n-bosch"}]}}</script></div></html>
