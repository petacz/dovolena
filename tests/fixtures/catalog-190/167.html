<html><h1>SAINT GEORGE PALACE</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 824, "name": "SAINT GEORGE PALACE", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotelový komplex Saint George Palace je umístěn v udržované zahradě na severozápadním pobřeží Korfu, v nádherném zálivu Agios Georgios. Součástí hotelu jsou dva venkovní bazény s částí pro děti a tobogánem. Hotel nabízí ubytování ve 150 pokojích s moderním designem několika typů; většina z nich je s výhledem na bazén a okolní přírodu. V roce 2024 byla přistavěna nová část Saint George Garden, která nabízí ubytování typu Deluxe, a to v menších budovách uprostřed hotelové zahrady. Nedaleko zálivu se nachází ikonická dvojpláž Porto Timoni, která patří mezi nejnavštěvovanější místa na ostrově.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 250 m (shuttle bus zdarma)</li>\r\n<li>letiště: 31 km Kerkyra</li>\r\n<li>centra: 0.3 km</li>\r\n<li>nákupních možností: 300 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Výhled zahrada</strong></p>\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>telefon</li>\r\n<li>satelitní TV</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>balkon nebo terasa</li>\r\n<li>zahrada nebo veranda</li>\r\n<li>dětská postýlka na vyžádání (zdarma)</li>\r\n<li>22m2</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Dvoulůžkový pokoj, Superior, Výhled zahrada</strong>: prostornější pokoj s jednou přistýlkou.</li>\r\n<li><strong>Family Dvoulůžkový pokoj, Výhled zahrada</strong>: prostornější pokoj, palanda.</li>\r\n<li><strong>Rodinný pokoj</strong>: prostornější pokoj, 2 přistýlky, 28m2.</li>\r\n<li><strong>Dvoulůžkový pokoj, Deluxe, Výhled zahrada, Nová budova:</strong> umístěné v nových budovách v zahradě, klidné části Saint George Garden.</li>\r\n<li><strong>Junior Suita, Deluxe, Výhled zahrada, Nová budova:</strong> prostornější, umístěné v nových budovách v zahradě, klidné části Saint George Garden.</li>\r\n</ul>"}, {"code": "HOTEL", "title": "Popis hotelu", "text": "<ul>\r\n<li>vstupní hala s recepcí</li>\r\n<li>restaurace</li>\r\n<li>bar</li>\r\n<li>bar u bazénu</li>\r\n<li>bazén</li>\r\n<li>dětský bazén</li>\r\n<li>sluneční terasa (lehátka a slunečníky zdarma, osušky za poplatek)</li>\r\n<li>parkoviště</li>\r\n<li>tobogán</li>\r\n<li>půjčovna aut</li>\r\n</ul>"}, {"code": "BEACH", "title": "Popis pláže", "text": "<ul>\r\n<li>písčitá s pozvolným vstupem do vody</li>\r\n<li>lehátka a slunečníky (za poplatek)</li>\r\n<li>1x denně zdarma hotelový shuttle na pláž (10:00 tam, 12:30 zpět)</li>\r\n</ul>"}, {"code": "DINING", "title": "Strava", "text": "<strong>All inclusive</strong><br />\r\n<ul>\r\n<li>Snídaně formou bufetu (7.30–10.00 hod.), oběd formou bufetu (12.30–14.30 hod.), večeře formou bufetu (19.00–21.30 hod.). U snídaně filtrovaná káva, čaj, džus, voda, u oběda a večeře nealkoholické nápoje, pivo, víno.</li>\r\n<li>Nealkoholické a alkoholické nápoje místní výroby (10.00-22.45 hod.)</li>\r\n<li>Lehké občerstvení, zákusky a sendviče (15.00-18.00 hod.)</li>\r\n<li>Dietní omezení je nutné uvést do poznámky a po příjezdu nahlásit na recepci.</li>\r\n<li>Upozornění: výše uvedené časy a místa jsou stanovené hotelem a mohou se změnit.</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity zdarma", "text": "<ul>\r\n<li>každý týden 2 tematické večery – živá hudba a řecký večer s ukázkou tanců</li>\r\n<li>tobogán</li>\r\n<li>stolní tenis</li>\r\n</ul>"}, {"code": "SPORTS", "title": "Sportovní aktivity za příplatek", "text": "<ul>\r\n<li>půjčovna motorových člunů</li>\r\n</ul>"}, {"code": "ENTERTAINMENT", "title": "Zábava", "text": "<ul>\r\n<li>nepravidelné večerní programy, možnost vyžití ve městečku Agios Georgios</li>\r\n</ul>"}, {"code": "INTERNET", "title": "Internet", "text": "<ul>\r\n<li>wifi v baru a restauraci (zdarma)</li>\r\n</ul>"}, {"code": "WEB", "title": "Web", "text": "https://www.saintgeorgepalacecorfu.com/index.php/en/"}, {"code": "CATEGORY", "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4 hvězdičky</li>\r\n</ul>"}, {"code": "NOTE", "title": "Poznámka", "text": "<p class=\"f_outsideHtml mb-8\">V Řecku je povinnost hradit klimatickou taxu v závislosti na kategorii hotelu. Taxa není zahrnuta v ceně zájezdu a musí být uhrazena klientem přímo na recepci hotelu. Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.</p>"}], "destination": [{"name": "Řecko", "url": "https://www.eximtours.cz/recko"}, {"name": "Korfu", "url": "https://www.eximtours.cz/recko/korfu"}, {"name": "Agios Georgios Pagon", "url": "https://www.eximtours.cz/recko/korfu/agios-georgios-pagon"}]}}</script></div></html>
