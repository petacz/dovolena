<html><h1>db San Antonio Hotel & Spa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3341, "name": "db San Antonio Hotel & Spa", "description": [{"code": null, "title": "Poloha", "text": "<p>V letovisku Qawra cca 15 km od hlavního města Valletta. Letiště je vzdáleno 20 km, autobusové nádraží cca 150 m.</p>"}, {"code": null, "title": "Vybavení", "text": "<p>Vstupní hala s recepcí, výtahy, restaurace, 4 tematické restaurace, 2 bary, kavárna, obchod se suvenýry, konferenční sál. Venku bazén, bar u bazénu a terasa s lehátky a slunečníky zdarma, osušky oproti kauci.</p>"}, {"code": null, "title": "Pokoje", "text": "<p><strong>Standard Room (Inland View, Balcony) - Dvoulůžkový pokoj:</strong> koupelna/WC (vysoušeč vlasů), &nbsp;klimatizace, telefon, TV/sat., minibar, trezor, set na přípravu kávy a čaje, výhled do okolí, balkon.<br /><strong><br />Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Standard Room (SeaView, Balcony) - Dvoulůžkový pokoj, Výhled na moře: </strong>výhled na moře</li>\r\n<li><strong>SingleUse Standard Room (Inland View, Balcony) - Dvoulůžkový pokoj, Pro samostatné použití:</strong> pokoj pro 1 osobu nebo 1 osobu a 1 dítě</li>\r\n<li><strong>SingleUse Standard Room (SeaView, Balcony) - Dvoulůžkový pokoj, Pro samostatné použití, Výhled na moře:</strong> pokoj pro 1 osobu nebo 1 osobu a 1 dítě, výhled moře</li>\r\n<li><strong>Standard FamilyRoom (Inland View, Balcony) - Rodinný pokoj:</strong> prostornější pokoj, 2 osoby na pevném lůžku a až 2 osoby na přistýlce</li>\r\n<li><strong>Standard FamilyRoom (SeaView, Balcony) - Rodinný pokoj, Výhled moře:</strong> &nbsp;prostornější pokoj, 2 osoby na pevném lůžku a až 2 osoby na přistýlce, výhled na moře</li>\r\n</ul>"}, {"code": null, "title": "Zábava", "text": "<p>Denní i večerní animační programy.</p>"}, {"code": null, "title": "Stravování", "text": "<p><strong>All Inclusive</strong></p>\r\n<ul>\r\n<li>Snídaně, oběd a večeře formou bufetu</li>\r\n<li>Lehké občerstvení (15.30–16.30 hod.)</li>\r\n<li>Možnost večeře v à la carte restauraci 1x za pobyt, nutná předchozí rezervace</li>\r\n<li>Vybrané místní rozlévané alkoholické a nealkoholické nápoje (10.00–23.00 hod.)</li>\r\n<li class=\"f_list-item\">Uvedené časy a místa jsou určeny hotelem a mohou se změnit</li>\r\n</ul>"}, {"code": null, "title": "Pláž", "text": "<p>Skalnatá pláž cca 100 m, přístup přes místní komunikaci, lehátka za poplatek. Část pláže s hrubozrnným pískem, přístup do moře po schůdcích a molech, skalnaté podloží, doporučujeme boty do vody.</p>"}, {"code": null, "title": "Sportovní nabídka", "text": "<p><strong>Zdarma:</strong> stolní tenis, plážový volejbal, šipky, fitness.<br /><strong>Za poplatek:</strong> půjčovna kol, vodní sporty na pláži.</p>"}, {"code": null, "title": "Děti", "text": "<p>2 brouzdaliště se skluzavkou, miniklub (4-12 let), herna, dětská postýlka zdarma (na vyžádání).</p>"}, {"code": null, "title": "Karty", "text": "<p>VISA, EC/MC, AMEX.</p>"}, {"code": null, "title": "Web", "text": "http://www.dbhotelsresorts.com/dbsanantonio"}, {"code": null, "title": "Handicap", "text": "<p>Hotel disponuje několika pokoji přizpůsobenými pro handicapované klienty. Bezbarierový pohyb v areálu.</p>"}, {"code": null, "title": "Wellness", "text": "<ul>  <li><strong>Zdarma:</strong> vnitřní bazén, sauna, pára</li>  <li><strong>Za poplatek:</strong> masáže a různé druhy procedur</li>  </ul>"}, {"code": null, "title": "Internet", "text": "<p><strong>Zdarma:</strong> WiFi v hotelu.</p>"}, {"code": null, "title": "Oficiální kategorie", "text": "<ul>\r\n<li>4,5 hvězdičky</li>\r\n</ul>"}, {"code": null, "title": "Poznámka", "text": "<p>V hotelu je vybírána místní Eco taxa 1,5 €/den (max. 22,5 €/os./pobyt) od 18 let.<br />Rozsah a kvalita uvedených služeb a aktivit může být ovlivněna zavedením případných hygienických či protiepidemických opatření v dané destinaci.<br />Hotel může vyžadovat zaplacení bezpečnostního depozitu při příjezdu.</p>"}], "destination": [{"name": "Malta", "url": "https://www.eximtours.cz/malta"}, {"name": "Ostrov Malta", "url": "https://www.eximtours.cz/malta/ostrov-malta"}, {"name": "Qawra", "url": "https://www.eximtours.cz/malta/ostrov-malta/qawra"}]}}</script></div></html>
