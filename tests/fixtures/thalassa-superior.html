<html><h1>Thalassa Superior</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 145619, "name": "Thalassa Superior", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Hotelový komplex Thalassa Superior vás přivítá v krásné zelené oáze v oblasti Kounopetra, 7 km od malebného městečka Lixouri. Architektonicky elegantní a propracovaný, designově uzpůsobený v mořských odstínech modré svým návštěvníkům slibuje klid a úplnou relaxaci v rozsáhlé zahradě. Součástí hotelu je taky aquapark pro děti i dospělé. Dobře vybavené pokoje, slibují hostům maximální comfort. Spojení s hlavním městem Argostoli několikrát denně z přístavu z Lixouri lodí, cca 46 km od letiště.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m</li>\r\n<li>letiště: 50 km Kefalonie</li>\r\n<li>centra: 7 km (Lixouri)</li>\r\n<li>nákupních možností: 7000 m</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<p><strong>Dvoulůžkový pokoj, Superior</strong></p>\r\n<ul>\r\n<li>klimatizace (zdarma)</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>satelitní TV</li>\r\n<li>lednice</li>\r\n<li>telefon</li>\r\n<li>trezor (za poplatek)</li>\r\n<li>dětská postýlka na vyžádaní (za poplatek cca 20 EUR/pobyt (platí se v hotelové recepci v destinaci, upozornění v hlavní sezóně může dojít k navýšení&nbsp; ceny)</li>\r\n<li>balkon nebo terasa</li>\r\n</ul>\r\n<strong>Ostatní typy pokojů&nbsp;</strong>(pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)<br />\r\n<ul>\r\n<li class=\"f_list-item\"><strong>Dvoulůžkový pokoj, Výhled moře:</strong>&nbsp;výhled moře, v budově Ionian.</li>\r\n<li class=\"f_list-item\"><strong>Rodinný pokoj, Výhled moře:&nbsp;</strong>výhled moře, prostornější, v budově Ionian.</li>\r\n<li class=\"f_list-item\"><strong>Dvoulůžkový pokoj, Annex:</strong>&nbsp;annexová budova umístěna cca 150 m od hl. budovy hotelu.</li
