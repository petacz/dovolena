<html><h1>db San Antonio Hotel & Spa</h1><div data-component-name="abnbHotelDetail"><script type="application/json">{"hotelDetailInfo": {"identifier": 3341, "name": "db San Antonio Hotel & Spa", "description": [{"code": "ABOUT_HOTEL", "title": "Informace o hotelu", "text": "<p>Oceňovaný hotel db San Antonio je se svými více než 500 pokoji jedním z největších hotelů na Maltě. Tomu odpovídá i rozmanitá nabídka služeb, výborně vybavené pokoje a soukromá pláž. Hotel leží v centru Qawry, v jedné z nejvyhledávanějších turistických oblastí na ostrově, v docházkové vzdálenosti od restaurací, barů, klubů a nákupních možností.</p>"}, {"code": "DISTANCES", "title": "Vzdálenost", "text": "<ul>\r\n<li>pláže: 100 m</li>\r\n<li>letiště: 20 km</li>\r\n<li>centra - v centru</li>\r\n<li>nákupní možnosti - u hotelu</li>\r\n</ul>"}, {"code": "ROOMS", "title": "Popis pokoje", "text": "<strong>Standard Room (Inland View, Balcony) - Dvoulůžkový pokoj</strong><br />\r\n<ul>\r\n<li>klimatizace</li>\r\n<li>TV/sat.</li>\r\n<li>telefon</li>\r\n<li>Wi-Fi (zdarma)</li>\r\n<li>minibar (na vyžádání, za poplatek)</li>\r\n<li>set pro přípravu kávy a čaje</li>\r\n<li>koupelna/WC (vysoušeč vlasů)</li>\r\n<li>trezor (zdarma)</li>\r\n<li>výhled do okolí</li>\r\n<li>balkon</li>\r\n</ul>\r\n<p><strong>Ostatní typy pokojů</strong> (pokud není uvedeno jinak, mají pokoje výše uvedené vybavení)</p>\r\n<ul>\r\n<li><strong>Standard Room (SeaView, Balcony) - Dvoulůžkový pokoj, Výhled na moře: </strong>výhled na moře</li>\r\n<li><strong>SingleUse Standard Room (Inland View, Balcony) - Dvoulůžkový pokoj, Pro samostatné použití:</strong> pokoj pro 1 osobu nebo 1 osobu a 1 dítě</li>\r\n<li><strong>SingleUse Standard Room (SeaView, Balcony) - Dvoulůžkový pokoj, Pro samostatné použití, Výhled na moře:</strong> pokoj pro 1 osobu nebo 1 osobu a 1 dítě, výhled moře</li>\r\n<li><strong>Standard FamilyRoom (Inland View, Balcony) - Rodinný pokoj:</strong> prostornější pokoj, 2 osoby na pevném lůžku a až 2 osoby na přistýlce
